const docs = [{"label": "Research (R1)", "name": "teacher-ux-research.md", "text": "# Teacher UX Research Note (TEACH-UX-R1)\n\n**Date:** 2026-09-03  \n**Author:** research-feedback (Kelyra)  \n**Status:** Complete for handoff to PM child (t_7215b83e)  \n**Citations:** Kelyra source (ChromeProvider, HamburgerDrawer, FloatingTabTray, AppHeader, class/[id]/*, inbox, capture, ask, todo, admin/*, student/*); competitor IA patterns from Canvas (course nav), Google Classroom (stream + classwork), PowerSchool (teacher gradebook/home); prior Kelyra research (class-landing, avg-specs).\n\n## Executive Summary\n\nCEO observation: Teacher chrome feels cluttered/overwhelming; Superintendent office and Student views are relatively clean and focused. Root causes identified via code walk: high navigation density (global drawer + floating tab tray + per-class tabs + role-specific CTAs), competing primary actions (Capture vs Ask vs Inbox vs Desk tabs), altitude bleed (office People/Matrix mixed into teacher flows), duplicate nav surfaces, and Ask living at global level instead of class-scoped. \n\nTeacher must remain a **class-desk product** (capture \u2192 match \u2192 desk \u2192 assign/grade) without office bleed or student-skin duplication. Superintendent is matrix/people/school; Student is todo/work only.\n\n**Key findings (inventory below):**\n- Teacher home/class desk: 8+ nav surfaces, competing CTAs (capture global, ask global, inbox unassigned, todo personal, class tabs for feed/assignments/gradebook/syllabus).\n- Superintendent: Cleaner tabbed office (Feed/Classes/People/Manage) + matrix focus.\n- Student: Minimal (todo + work + grades).\n- Pain: Density, duplicate paths (drawer search vs tray vs class tabs), Ask vs desk vs inbox confusion, no clear \"this class\" primary surface.\n- Needed vs desired: Consolidate teacher nav to 4-5 surfaces max (Home desk list \u2192 Class desk with scoped tabs \u2192 Capture contextual \u2192 Inbox/Assign/Grade unified under desk). Hide office tools from teacher hat. Group Ask into class context or desk shelf. Move non-core (people-from-class, full syllabus) behind desk or secondary.\n\n**v1 Recommendation (IA cut, no visual restyle):**\n- Teacher: Home = class list (auto-redirect if 1 class). Class desk = primary surface with tabs (Feed/Assignments/Gradebook/Syllabus/Students) + contextual Capture/Ask/Assign from within desk. Inbox = unassigned only, surfaced from desk. Todo = personal queue. Hide global Ask, global People, office Matrix from teacher role.\n- Superintendent: Keep office tabs + matrix/people/school; no class desk bleed.\n- Student: Keep minimal todo/work.\n- Non-goals: No student skin on teacher, no office People on class desk, no new global nav.\n- Cite overlaps with U1/U2 if any (none started per constraints).\n\n**Gaps noted:** Exact runtime badge counts, live screenshot inventory (code-only audit), parent hat overlap, mobile vs web differences in tray/drawer.\n\n## 1. Structured Inventory (Route, Purpose, Primary Action, Noise)\n\n### Teacher Role Chrome (core walk)\n- **Home (/)**: Role switcher + class list or tabs (classes/feed/new/people/manage for multi). Primary: pick class or create (but teachers don't create). Noise: admin tabs bleed for super+teacher, lesson rollup, school feed. (src/app/index.tsx:77 auto-redirect if 1 class)\n- **Class Desk (/class/[id]/index + _layout + feed/assignments/gradebook/syllabus/assign/student/[id])**: Primary surface. Tabs via ClassTabs (feed, assignments, gradebook, syllabus, students?). Work shelf (inbox/turned/week), roster avatars, phase banners. Primary actions: review captures, assign practice, grade. Noise: multiple sub-tabs + global chrome + pushed title. (src/app/class/[id]/* : 15+ screens)\n- **Inbox (/inbox)**: Unassigned captures. List + attach to roster + note-only. Primary: match/assign. Noise: filter, pending sheets, drafting. Global but class-scoped internally. (src/app/inbox.tsx)\n- **Capture (/capture)**: Phone/web camera + audio + spoken name. Primary: record/snap \u2192 match. High visual density (device picker, pager, transcript). Global entry. (src/app/capture.tsx)\n- **Todo (/todo + /[submissionId])**: Personal work queue (assigned practice). Primary: submit/review. Minimal. (src/app/todo.tsx)\n- **Ask (/ask)**: Global AI chat (agent, history, attachments). Primary: query gaps/assign. Noise: lives outside class context; competing with desk actions. Teacher-only guard. (src/app/ask.tsx:101)\n- **People-from-class (/class/[id]/student/[id] or admin/people)**: Roster drill + parent links. Noise: bleeds into admin/people for super.\n- **Assign (/class/[id]/assign)**: From gap to practice set. Primary: generate/assign. Scoped to class.\n- **Gradebook/Syllabus (/class/[id]/gradebook, syllabus)**: Grid + policy view. Primary: approve/score. Syllabus read/edit if present.\n\n**Chrome surfaces (shared):**\n- HamburgerDrawer: Staff (teacher/admin/super) profile + Feed/Classes/People/Manage/Kelyra/Ask + search. Super sees extra office items. (HamburgerDrawer.tsx:227,283)\n- FloatingTabTray: Role-gated tabs (super/admin vs teacher/student). (FloatingTabTray.tsx:186)\n- AppHeader: Search/mail/capture/mail badges, role-aware title. (AppHeader.tsx:32)\n- ChromeProvider: role, headerChrome toggles, badges (capture needs, alerts, messages). (ChromeProvider.tsx:258+)\n\n**Density issues:** 3+ nav layers (drawer + tray + class tabs) + 5+ CTAs (capture, ask, inbox, todo, desk tabs) on teacher paths. Competing \"primary\" (desk vs ask vs capture).\n\n### Superintendent Office\n- **Admin routes (/admin/matrix, /admin/class/[id], /admin/people, /?tab=manage/school/people)**: Matrix, school classes/people, feed. Primary: oversight, edit roles, school identity. Clean tabbed IA. No class-desk clutter. (src/app/admin/*, index tabs)\n- Role: 'superintendent' gates office tools; hides some teacher CTAs.\n- Noise low: focused on People/Matrix/School.\n\n### Student\n- **Todo/Work (/todo, /student/*, /student/feed, /student/grades, /student/people, /student/class)**: Assigned work, grades view, class feed. Primary: do/submit. Minimal chrome, no office or teacher tools. (src/app/student/*)\n- Role: 'student' redirects from home, simple tray.\n\n**Comparison table (density/altitude):**\n| Role | Nav layers | Primary surfaces | Competing CTAs | Altitude bleed | Overall feel |\n|------|------------|------------------|----------------|----------------|--------------|\n| Teacher | 4+ (drawer+tray+class tabs+global) | Class desk, Capture, Ask, Inbox, Todo | Capture/Ask/Inbox/Desk tabs high | Office people/matrix bleed via shared drawer | Cluttered |\n| Superintendent | 2-3 (office tabs + drawer) | Matrix, People, School, Feed | Low (focused) | None (teacher desk hidden) | Clean |\n| Student | 1-2 (todo + tray) | Todo/Work | None | None | Clean |\n\n## 2. Pain Points & Root Causes\n- **Density**: Multiple overlapping nav (Hamburger search vs tray vs class tabs vs header capture/ask). Every screen adds badges/CTAs.\n- **Competing CTAs**: Ask global vs desk actions; Capture global entry vs contextual in desk; Inbox as unassigned vs desk inbox shelf.\n- **Altitude bleed**: Shared drawer exposes office (People, Manage) to teachers; admin/matrix accessible; people-from-class mixes with admin/people.\n- **Duplicate nav**: Class desk reinvents tabs that overlap global tray/drawer.\n- **Ask vs desk vs inbox**: Ask feels like separate \"AI desk\"; inbox unassigned feels orphaned; desk is the real work surface but buried.\n- **Teacher constraints**: Teachers do not create classes (home auto-redirects); no office creation tools.\n\n## 3. Competitor IA Patterns (for reference only \u2014 Kelyra-specific)\n- **Canvas teacher home**: Course nav (home/syllabus/assignments/grades/people) + global dashboard. Stream vs modules; above-fold focus on due/ announcements. Low global CTAs.\n- **Google Classroom teacher**: Classwork/Stream/Grades/People tabs per class; global \"Classes\" list + create. Minimal drawer; capture/assign inside class.\n- **PowerSchool teacher**: Gradebook-centric + roster/assignments; office reports separate. Clean separation of class vs district office.\nPattern: Class-scoped tabs primary; global office/district separate; capture/ask inside context; 3-4 surfaces max per role.\n\n## 4. Needed vs Desired (What to hide, group, or move)\n- **Hide (from teacher role)**: Office Matrix/People/Manage/School tabs, global Ask (move scoped), full admin people, super-only fields.\n- **Group/Move**: Capture + Ask + Assign into class desk shelf/contextual (not global floating). Inbox unassigned \u2192 desk secondary tab or shelf. Todo personal \u2192 home or desk. Syllabus/gradebook stay under desk tabs.\n- **Keep/Primary**: Class desk as #1 surface (roster + work shelf + tabs). Home = lightweight class list only. Capture remains fast global but context-aware.\n- **Non-goals (cite for PM)**: Student skin on teacher, office People on class desk, new global chrome, visual redesign (this is IA/altitude only).\n- **v1 vs later**: v1 = consolidate to desk-centric (4 surfaces); later = advanced parent matrix, full syllabus AI.\n\n## 5. Recommended IA (handoff for PM plan)\n- Teacher flow: Home (class list) \u2192 Class desk (tabs: Feed/Work/Gradebook/Syllabus/Students + contextual Capture/Ask/Assign/Inbox) \u2192 Todo (personal) as secondary.\n- Role gates strict in ChromeProvider + Drawer + Tray.\n- Unassigned inbox surfaced only from desk.\n- Ask scoped to current classId or global only for super.\n- Result: Teacher stays \"class desk product\"; super/student remain clean.\n\n**Next**: PM child (t_7215b83e) can now produce teacher-ux-plan.md with before/after IA, v1 scope, phased tasks. CoS ARM-grant after this note.\n\n**OPEN ISSUES**: None for this research; ready for review/handoff. No U1/U2 cards started."}, {"label": "Plan (P1)", "name": "teacher-ux-plan.md", "text": "# TEACH-UX-P1: Teacher layout proposal + implementation plan\n\n**Date:** 2026-09-03  \n**Author:** product-manager (Kelyra)  \n**Card:** `t_7215b83e` \u00b7 Parent research: `t_fc536da0`  \n**Status:** Spec / plan only \u2014 **no app code**, no SQL, no migrations, no `IconName`, no kelyra-qa-loop, no git push.  \n**Depends on:** `notes/company/teacher-ux-research.md` (TEACH-UX-R1, 2026-09-03)  \n**Also grounded in:** `docs/mvp.md` (M2\u2013M10 loop), `docs/ui-design.md` \u00a73 / \u00a732.7 / \u00a734 / \u00a736, live chrome (`FloatingTabTray`, `ClassTabs`, `HamburgerDrawer`, `AppHeader`, `ChromeProvider`), AVG teacher UI placement (`avg-spec-teacher-ui.md` \u2014 Class desk, not Office).\n\n**Audience:** CEO / Chief of Staff review. **Not** an implementation ticket. Do not staff `senior-developer` until Chuck says send.\n\n---\n\n## 0. One-line product law\n\n| Role | Job of the product | What it is not |\n|---|---|---|\n| **Teacher** | **Class desk** \u2014 capture \u2192 match \u2192 review drafts \u2192 assign practice \u2192 Approve grade | Not a school office, not a student worksheet skin, not a second Ask app |\n| **Superintendent / admin** | **Office** \u2014 Feed \u00b7 Classes \u00b7 People \u00b7 Manage \u00b7 matrix | Not the teacher grade loop |\n| **Student** | **Work** \u2014 todo / submit / own grades | Not teacher tools |\n| **Parent** | **One child note** \u2014 progress + messages | Not the grade book |\n\n**CEO bar (from TEACH-UX-R1):** Superintendent and Student feel clear; Teacher must reach that clarity **without** becoming Office or Student.\n\n---\n\n## 1. Problem statement (grounded)\n\nLive teacher chrome stacks **four navigation layers** and **five+ competing primaries**:\n\n| Layer | Live surfaces (teacher) | Noise |\n|---|---|---|\n| Header | Camera \u00b7 Search \u00b7 Messages \u00b7 \u2630 | Capture **also** in tray \u2192 double shutter path |\n| Floating tray | House \u00b7 Capture \u00b7 Inbox \u00b7 Class \u00b7 Ask | Five peers; Ask global; Inbox orphaned from desk |\n| Class desk tabs | Feed \u00b7 Today \u00b7 Week \u00b7 Needs you \u00b7 Students \u00b7 Parents \u00b7 Gradebook \u00b7 Heatmap \u00b7 Assignments \u00b7 Family | **10** PersonTabs on one class |\n| Hamburger | Class switch \u00b7 Grade book \u00b7 Parents \u00b7 Family \u00b7 Feed (+ office rows if dual-hat / admin bleed) | Duplicates tray + desk |\n\n**Core loop (MVP)** is still right: phone captures; web reviews, assigns, grades. The UI no longer *reads* as that loop \u2014 it reads as \u201cmany apps sharing one chrome.\u201d\n\nSuperintendent office tray (Feed \u00b7 Classes \u00b7 People \u00b7 Manage \u00b7 Ask) and Student work surfaces stay comparatively single-purpose. Teacher is the outlier.\n\n---\n\n## 2. Before / after IA\n\n### 2.1 BEFORE \u2014 Teacher (as shipped)\n\n```\nTeacher signed in\n\u251c\u2500\u2500 AppHeader\n\u2502   \u251c\u2500\u2500 camera (global capture entry)\n\u2502   \u251c\u2500\u2500 search\n\u2502   \u251c\u2500\u2500 messages (badge = alerts)\n\u2502   \u2514\u2500\u2500 hamburger\n\u251c\u2500\u2500 FloatingTabTray (5)\n\u2502   \u251c\u2500\u2500 House  \u2192 /class/{id} desk OR / class list\n\u2502   \u251c\u2500\u2500 Capture \u2192 /capture\n\u2502   \u251c\u2500\u2500 Inbox   \u2192 /inbox (unassigned + review queues)\n\u2502   \u251c\u2500\u2500 Class   \u2192 /class/{id}/gradebook (records cluster)\n\u2502   \u2514\u2500\u2500 Ask     \u2192 /ask (global agent)\n\u2514\u2500\u2500 When on class desk \u2014 ClassTabs (10)\n    Feed \u00b7 Today \u00b7 This week \u00b7 Needs you \u00b7 Students \u00b7 Parents\n    \u00b7 Gradebook \u00b7 Heatmap \u00b7 Assignments \u00b7 Family\n```\n\n**Mental model today:** \u201cWhere do I work?\u201d has five answers (House, Inbox, Class, Ask, Capture).  \n**Altitude bleed:** shared staff drawer patterns + dual-hat paths can surface office People / Activity / matrix near teacher flows (see research inventory). Pure teacher must not own Office nouns.\n\n### 2.2 AFTER \u2014 Teacher v1 target IA\n\n```\nTeacher signed in\n\u251c\u2500\u2500 AppHeader (unchanged recipe; see \u00a75)\n\u2502   \u251c\u2500\u2500 camera  \u2192 still proposes only (ui-design law); primary shutter remains tray Capture on phone\n\u2502   \u251c\u2500\u2500 search \u00b7 messages \u00b7 \u2630\n\u251c\u2500\u2500 FloatingTabTray (still 5 \u2014 no sixth tab)\n\u2502   \u251c\u2500\u2500 Desk     \u2192 active class work surface (Today default)\n\u2502   \u251c\u2500\u2500 Capture  \u2192 /capture (class-aware; stay-on-Capture after save)\n\u2502   \u251c\u2500\u2500 Needs    \u2192 unassigned + drafts waiting Approve (was Inbox; same routes OK)\n\u2502   \u251c\u2500\u2500 Class    \u2192 records cluster home (Students default \u2014 not Gradebook-first)\n\u2502   \u2514\u2500\u2500 Ask      \u2192 /ask with classId context when a class is active\n\u2514\u2500\u2500 Class desk body \u2014 ClassTabs reduced to two altitudes\n    Work row (primary):  Today \u00b7 Needs \u00b7 Feed\n    Class row (records): Students \u00b7 Assignments \u00b7 Gradebook \u00b7 Parents\n    Secondary (not default chrome): This week (filter on Today), Heatmap (Gradebook pane),\n                                    Family (drawer or Class overflow), Syllabus (AVG path)\n```\n\n**Mental model after:**  \n1. **Desk** = this class\u2019s work this week.  \n2. **Capture** = put work in.  \n3. **Needs** = things without a home or waiting you.  \n4. **Class** = roster / book / assignments structure.  \n5. **Ask** = help *inside* that class (not a parallel desk).\n\n### 2.3 AFTER \u2014 leave other hats alone\n\n| Role | v1 change |\n|---|---|\n| **Superintendent / admin** | **No change** to office tray or matrix. Office class card stays Feed \u00b7 Teacher \u00b7 Parents \u00b7 Students \u2014 **not** teacher ClassTabs. |\n| **Student** | **No change** in this epic. Do not \u201cfix\u201d student by copying teacher density. |\n| **Parent** | **No change** in this epic. |\n| **Dual-hat** (teacher+admin, teacher+parent) | Seat switch remains; when seat = teacher, **office tray nouns hide**. Parent \u201cMy children\u201d stays drawer-only. |\n\n### 2.4 Before / after comparison table\n\n| Concern | Before | After (v1) |\n|---|---|---|\n| Primary surface | Split: House vs Inbox vs Class vs Ask | **Desk** owns the week; others are tools |\n| ClassTabs count | 10 always-visible | **\u22647** default icons; rest demoted |\n| Inbox vs Needs you | Two queues, two names | One teacher noun: **Needs** (badge once) |\n| Ask | Global peer of Desk | Class-scoped context; still tray-last |\n| Office People | Reachable near teacher chrome | **Hidden** on pure teacher seat |\n| Capture | Header + tray | Keep both for muscle memory; **one** product rule (propose vs file) unchanged |\n| Student skin | Risk if we \u201csimplify\u201d by copying todo UI | **Forbidden** |\n| Rewrite | \u2014 | **Forbidden** \u2014 gate chrome + tabs + copy |\n\n---\n\n## 3. Workflow (teacher day) \u2014 target story\n\n### 3.1 Phone (capture-heavy)\n\n1. Open app \u2192 **Desk** (single class auto-lands; multi-class picks then lands).  \n2. Tap **Capture** \u2192 photo/voice \u2192 spoken name \u2192 match or park.  \n3. Stay on Capture for the stack (existing law).  \n4. Badge on **Needs** when unassigned or drafts ready.  \n5. Optional: open Needs on phone to attach a name; **Approve / assign still prefer web** (MVP M10 / S7).\n\n### 3.2 Web (review-heavy)\n\n1. **Desk \u2192 Today**: drafts waiting, who has a gap, light rollup \u2014 not a KPI dashboard.  \n2. Open student \u2192 Approve gaps \u2192 Assign practice.  \n3. **Class \u2192 Gradebook** for grid Approve/score.  \n4. **Class \u2192 Students** for roster / setup / (later) syllabus entry cards.  \n5. **Ask** from desk or tray with **this class** already bound (syllabus import drafts, gap questions) \u2014 never auto-publishes grades.\n\n### 3.3 What \u201cclean like Super/Student\u201d means here\n\n- Super is clean because **one altitude** (school).  \n- Student is clean because **one job** (my work).  \n- Teacher becomes clean by **one altitude per moment** (this class\u2019s desk), not by deleting Capture or the grade book.\n\n---\n\n## 4. v1 scope vs later\n\n### 4.1 Ships in TEACH-UX v1 (IA / chrome only)\n\n| ID | Change | Why |\n|---|---|---|\n| **T-UX-1** | Strict **role gates** on drawer + tray + home tabs: pure teacher never sees Office People / Manage / Matrix / school-wide Activity as primary chrome | Removes altitude bleed |\n| **T-UX-2** | Rename / unify teacher mental model: tray **Inbox \u2192 Needs** (route may stay `/inbox`); Desk **Needs you** is the same queue family, not a third product | One noun |\n| **T-UX-3** | **ClassTabs default set** cut to Work + Class rows in \u00a72.2; Heatmap only under Gradebook; Family not in default 7 | Density |\n| **T-UX-4** | Tray **Class** default target = **Students/setup** (or Class hub), not Gradebook-first | Records \u2260 \u201copen the book first\u201d |\n| **T-UX-5** | **Ask** receives active `classId` when teacher is on a class path; empty state explains \u201cworking in {class}\u201d | Stops parallel-desk feel |\n| **T-UX-6** | House/Desk label + header wordmark rules clarified: on desk panes wordmark = **class name**; tray label **Desk** or keep House icon with \u201cDesk\u201d accessibility string | Clarity without new glyphs if needed |\n| **T-UX-7** | Hamburger teacher cluster: class list \u00b7 switch class \u00b7 Profile \u00b7 Appearance \u00b7 Sign out; deep links to Gradebook/Parents only as **secondary**, not competing primaries | Kill duplicate nav |\n| **T-UX-8** | Dual-hat: explicit seat; teacher seat chrome === pure teacher | No silent office bleed |\n| **T-UX-9** | Copy pass only: phase banners / empty states speak capture \u2192 needs \u2192 desk \u2192 class | No new features |\n| **T-UX-10** | Web \u2265720: same five destinations in top bar; labels visible (**Desk \u00b7 Capture \u00b7 Needs \u00b7 Class \u00b7 Ask**) | Mobile/web parity of IA |\n\n### 4.2 Explicitly later (not v1)\n\n| Item | Why later |\n|---|---|\n| Visual restyle / new design system | This epic is **IA + altitude**, not paint |\n| New tray icon count (6+) or Profile-in-tray | ui-design \u00a734 forbids Profile tab |\n| Merge Capture into Desk-only (remove tray Capture) | Breaks hallway speed; MVP phone capture |\n| Full phone Approve/assign (S7) | Separate should-have |\n| AVG Syllabus tab icon | Own AVG tickets; entry via setup card / gradebook banner first |\n| Diary / Ledger chrome | Own DIARY epic; drawer only |\n| Class landing / public page | Own research track |\n| Student tray simplification | Out of teacher epic |\n| \u201cSmart\u201d home that mixes diary + desk + office | DR-8 / diary non-goal |\n| Global nav rewrite / new shell package | No rewrite |\n\n### 4.3 v1 vs later \u2014 one table\n\n| Surface | v1 | Later |\n|---|---|---|\n| Desk tabs | \u22647 defaults | Syllabus tab icon; optional Week chip |\n| Needs / Inbox | One noun, existing routes | Smarter triage, phone Approve |\n| Ask | Class context binding + copy | Tool-calling depth (product separate) |\n| Capture | Unchanged loop | Split recording (S2), offline (L5) |\n| Office on teacher | Hidden | Never on class desk |\n| Motion / glass | Keep hide-on-scroll | No Liquid Glass project |\n\n---\n\n## 5. Mobile vs web\n\n| | **Phone** | **Web / tablet (\u2265720)** |\n|---|---|---|\n| **Primary job** | Capture stack + glance Needs | Desk review, assign, grade book |\n| **Tray** | Floating 5 icons, hide-on-scroll | Top bar under header, same 5, **labels on** |\n| **Capture** | Tray primary; header camera = propose only | Header camera optional; keyboard flows OK |\n| **Desk** | Today + Needs enough | Full ClassTabs + student pages |\n| **Approve / generate assign** | Not required on phone in v1 | Required path |\n| **Ask** | Tray last; class-bound when possible | Same; large transcript comfortable |\n| **Class records** | Light roster fix OK | Gradebook + assignments home |\n| **Non-goal** | Do not ship a separate \u201cmobile IA\u201d | Do not ship a left rail / desktop-only shell |\n\n**Invariant:** same routes and permissions; presentation density differs, not product law.\n\n---\n\n## 6. Explicit non-goals\n\n| Non-goal | Why |\n|---|---|\n| **Student skin on teacher** | Different job; copying todo chrome would hide Capture/Inbox/Gradebook |\n| **Office People / Matrix on class desk** | Wrong altitude; Office owns school directory |\n| **Teachers create classes from Desk** (pure teacher) | Office assigns classes; home may list/switch only |\n| **Rewrite the app / new navigation framework** | Phased gates on existing `FloatingTabTray`, `ClassTabs`, drawer |\n| **New global chrome destinations** | No sixth tray tab; no header Profile |\n| **Deleting Ask** | Keep tray-last; fix scope, don\u2019t remove agent |\n| **Deleting Capture or matcher rules** | MVP core; matcher still never inserts students |\n| **Auto-grade or Ask auto-publish** | Approve remains last click |\n| **Visual redesign pass** | Separate; CEO asked clutter/IA |\n| **Parent twin merge / multi-child teacher hacks** | Unrelated |\n| **Competitor clone (Canvas/Classroom layout)** | Patterns are reference only (research \u00a73) |\n| **Staffing implementation before Chuck \u201csend\u201d** | Card law |\n\n---\n\n## 7. Implementation plan (phased; no rewrite)\n\n> Spec only. Each phase becomes its **own** implementation card later. Prefer small PRs. Touch chrome components first; avoid route renames unless cheap.\n\n### Phase A \u2014 Altitude locks (lowest risk, highest clarity)\n\n**Goal:** Teacher seat cannot see Office primary chrome.\n\n| Task | Area | Acceptance |\n|---|---|---|\n| A1 | `FloatingTabTray.tabsFor` | Pure `teacher` never gets office tray keys |\n| A2 | `HamburgerDrawer` staff branch | Teacher-only: no People / Activity / Responsibilities / Manage; keep class list + profile + sign out |\n| A3 | `index` home for teacher | No office PersonTabs (feed/people/manage) unless seat is office; multi-class = list only |\n| A4 | Dual-hat | Documented seat switch; teacher seat === A1\u2013A3 |\n| A5 | QA matrix | Teacher / admin / super / dual screenshots or route checklist |\n\n**Out of phase A:** ClassTabs count, Ask binding, copy.\n\n### Phase B \u2014 Desk density (ClassTabs + Class tray target)\n\n**Goal:** Open a class \u2192 readable work surface.\n\n| Task | Area | Acceptance |\n|---|---|---|\n| B1 | `CLASS_TABS` default ordered set | Default visible: Today \u00b7 Needs \u00b7 Feed \u00b7 Students \u00b7 Assignments \u00b7 Gradebook \u00b7 Parents (\u22647) |\n| B2 | Demote | Heatmap only via gradebook `?tab=`; Week as Today filter or overflow; Family via drawer or Class overflow menu \u2014 **not** default tenth icon |\n| B3 | Tray Class href | Lands Students/setup or neutral Class hub \u2014 **not** forced Gradebook |\n| B4 | Wordmark | Class panes keep **class name** (ui-design \u00a732.7) |\n| B5 | AVG compatibility | Syllabus stays Class-desk altitude; no Office syllabus; entry cards per `avg-spec-teacher-ui` still valid |\n\n### Phase C \u2014 Needs unification + Ask context\n\n**Goal:** One waiting queue; Ask is not a second desk.\n\n| Task | Area | Acceptance |\n|---|---|---|\n| C1 | Tray label/a11y | Inbox \u2192 **Needs** (user-facing); `/inbox` route OK |\n| C2 | Badge single source | Unassigned + draft-ready count; Desk Needs and tray Needs do not double-count differently |\n| C3 | Empty states | Copy ties Capture \u2192 Needs \u2192 student Approve on web |\n| C4 | Ask | Pass/read `classId` from chrome when on `/class/*`; UI shows class name chip; super/office Ask unchanged |\n| C5 | Drawer | Remove or demote duplicate \u201cGrade book / Parents\u201d if Class tray covers them (keep searchability via Search) |\n\n### Phase D \u2014 Polish & web parity (still no restyle)\n\n| Task | Area | Acceptance |\n|---|---|---|\n| D1 | Web top bar labels | Desk \u00b7 Capture \u00b7 Needs \u00b7 Class \u00b7 Ask |\n| D2 | Header camera vs tray Capture | Tooltips/copy: header proposes; tray Capture files |\n| D3 | Teacher switch-class | `/?switch=1` or drawer only; no office classes tab |\n| D4 | Regression | Student + Office trays golden-path unchanged |\n| D5 | Docs delta | Short patch note to `docs/ui-design.md` \u00a73.4 / \u00a734 **after** Chuck approves plan (separate docs card OK) |\n\n### Phase dependency graph\n\n```\nA (altitude) \u2500\u2500\u25ba B (desk tabs) \u2500\u2500\u25ba C (Needs + Ask) \u2500\u2500\u25ba D (polish)\n                     \u2502\n                     \u2514\u2500\u2500 AVG syllabus UI may land in parallel on Class desk\n                         but must not restore 10-tab default\n```\n\n**Estimated shape (for CoS planning, not a promise):**  \nA = 1 small PR \u00b7 B = 1 PR \u00b7 C = 1\u20132 PRs \u00b7 D = 1 PR.  \nNo migration. No new packages. Icon renames only if copy requires existing `IconName` (prefer a11y label change over new glyphs).\n\n---\n\n## 8. Suggested future kanban decomposition (do not create until Chuck sends)\n\n| Order | Title | Assignee (suggested) | Parents |\n|---|---|---|---|\n| 1 | [TEACH-UX-A] Teacher altitude locks (drawer/tray/home) | via kelyra-qa-loop / implementer | this plan approved |\n| 2 | [TEACH-UX-B] ClassTabs default cut + Class tray landing | same | A |\n| 3 | [TEACH-UX-C] Needs noun + Ask class context | same | B |\n| 4 | [TEACH-UX-D] Web labels + capture copy + regression | same | C |\n| 5 | [TEACH-UX-DOC] ui-design \u00a7 patch to match shipped IA | product-manager or designer | D done |\n\n**Do not** open these cards from this ticket. CEO/CoS gate first.\n\n---\n\n## 9. Risks & open questions (for CEO)\n\n| # | Question | PM recommendation if no answer |\n|---|---|---|\n| Q1 | Tray label **Desk** vs keep **Home/House** icon with new a11y string? | Keep `today` glyph; accessibilityLabel/tooltip **Desk**; avoid new IconName |\n| Q2 | Family pane: drawer-only vs Class overflow? | Drawer + keep route; remove from default ClassTabs |\n| Q3 | Is `/inbox` rename to `/needs` worth churn? | **No** in v1 \u2014 label only |\n| Q4 | Dual-hat teachers who want Office + Desk same hour | Seat switch only; never merge trays |\n| Q5 | Student tray also grew dense (research gap) | **Separate** card later; not this epic |\n| Q6 | Header camera redundant with tray Capture? | Keep both; clarify propose vs file (Amazon Lens pattern already in ui-design) |\n\n**Gaps carried from research (honest):** no live badge telemetry, no screenshot dogfood pack in R1. Phase A/B should include a short dogfood checklist on real teacher seat.\n\n---\n\n## 10. Acceptance checklist (this plan document)\n\n- [x] Before/after IA  \n- [x] Workflow phone vs web  \n- [x] v1 vs later  \n- [x] Mobile vs web  \n- [x] Phased implementation tasks (A\u2013D), no rewrite  \n- [x] Explicit non-goals (student skin, office People on desk, \u2026)  \n- [x] Grounded in TEACH-UX-R1 + live chrome + MVP + ui-design  \n- [x] No code, no SQL, no qa-loop  \n- [x] Ready for CEO/CoS review; implementation not staffed  \n\n---\n\n## 11. Handoff\n\n| Field | Content |\n|---|---|\n| **OBJECTIVE** | Teacher IA proposal + sequenced plan for CEO review |\n| **CONTEXT** | Teacher chrome denser than Super/Student; class-desk product law |\n| **REQUIREMENTS** | Before/after, v1/later, mobile/web, phases, non-goals |\n| **CONSTRAINTS** | No code; no rewrite; no student skin; no office on desk |\n| **FILES** | `notes/company/teacher-ux-plan.md` (this file); research `notes/company/teacher-ux-research.md` |\n| **WORK PERFORMED** | PM synthesis of R1 + live tray/tabs/drawer + MVP/ui-design into reviewable plan |\n| **VERIFICATION** | File exists; sections map 1:1 to card acceptance |\n| **RESULT** | Plan ready for CEO/CoS |\n| **OPEN ISSUES** | Q1\u2013Q6 above; student-tray density deferred |\n| **ESCALATION NEEDED** | None for writing; **implementation blocked on Chuck \u201csend\u201d** |\n| **RECOMMENDED NEXT ACTION** | CEO/CoS review. If approved, CoS staffs Phase A only. Do not staff senior-developer until Chuck says send. |\n\n---\n\n## 12. Decision summary (PM)\n\n1. **Teacher = class desk product.** Desk is the home; Capture/Needs/Class/Ask are tools.  \n2. **Fix altitude before paint.** Hide Office from teacher seat first.  \n3. **Cut ClassTabs defaults**, don\u2019t build a new shell.  \n4. **One Needs queue** (noun), keep `/inbox` route.  \n5. **Ask stays**, but class-bound.  \n6. **Non-goals are hard:** no student skin, no office People on desk, no rewrite, no implementation without Chuck.\n"}, {"label": "Architecture (A1)", "name": "teacher-ux-architecture.md", "text": "# TEACH-UX-A1: Architecture \u2014 teacher chrome\n\n**Date:** 2026-09-04\n**Author:** software-architect (Kelyra)\n**Card:** TEACH-UX-A1 `t_c8b70d0e` \u00b7 Plan: `notes/company/teacher-ux-plan.md` \u00b7 Research: `notes/company/teacher-ux-research.md`\n**Status:** Architecture only \u2014 **no SQL**, no app code, no kelyra-qa-loop, no git push.\n**Live ground:** `FloatingTabTray.tabsFor`, `CLASS_TABS` / `OFFICE_CLASS_TABS`, `HamburgerDrawer` staff branch, `ChromeProvider` role, `AppHeader`, `docs/ui-design.md` \u00a73 / \u00a734 / \u00a736, `docs/mvp.md` phone capture / web review.\n\n**Gate:** Do not staff `senior-developer` / `kelyra-qa-loop` until Chuck says send.\n\n---\n\n## 0. Law\n\nTeacher = **class desk** (capture \u2192 match \u2192 review drafts \u2192 assign practice \u2192 Approve). Not Office. Not Student. Not a second Ask app.\n\n| Role | Job of the product | Chrome altitude |\n|---|---|---|\n| **Teacher** | This class\u2019s work loop | Class desk + Capture + Needs |\n| **Superintendent / admin** | School directory / matrix | Office tray (Feed \u00b7 Classes \u00b7 People \u00b7 Manage \u00b7 Ask) |\n| **Student** | My work | Todo / work \u2014 **do not copy onto Teacher** |\n\n**CEO bar:** Teacher must match Super/Student *clarity* without becoming Office or Student.\n\n| Question | Answer |\n|---|---|\n| New shell / rewrite? | **No.** Gate existing tray, tabs, drawer, header. |\n| Sixth tray tab / Profile-in-tray? | **No.** ui-design \u00a734. |\n| Extra Ask surface? | **No.** One `/ask`. Bind `classId`; do not add Ask to ClassTabs or header. |\n| Class-create on Teacher? | **No.** Office owns `canCreateClass`. |\n| Capture loop? | **Primary.** Stay-on-Capture after save. Matcher never inserts students. |\n| SQL / schema? | **None.** Chrome + seat only. |\n| Implementation ready? | **NO until CEO yes.** |\n\n## 1. Current chrome (problem)\n\nFour stacked nav layers. Five competing primaries. Dual-hat altitude bleed.\n\n### 1.1 Live teacher stack (code)\n\n| Layer | File | Teacher today |\n|---|---|---|\n| Header | `AppHeader` | Camera \u00b7 Search \u00b7 Messages \u00b7 \u2630. Camera **proposes** (ui-design). |\n| Tray | `FloatingTabTray.tabsFor` (fallback after office/student/parent) | Home (`today` \u2192 `/class/{id}`) \u00b7 **Capture** \u00b7 **Inbox** \u00b7 **Class** (`/gradebook`) \u00b7 Ask (`Kelyra` \u2192 `/ask`) |\n| Class desk | `CLASS_TABS` (10) | Feed \u00b7 Today \u00b7 This week \u00b7 Needs you \u00b7 Students \u00b7 Parents \u00b7 Gradebook \u00b7 Heatmap \u00b7 Assignments \u00b7 Family |\n| Drawer | `HamburgerDrawer` `staff` union | Class list \u00b7 Another class \u00b7 Grade book \u00b7 Parents \u00b7 Family update \u00b7 Feed (non-super) \u00b7 dual-hat parent \u00b7 Sign out |\n\nOffice class card is a **different** set (`OFFICE_CLASS_TABS`: Feed \u00b7 Teacher \u00b7 Parents \u00b7 Students). Do not merge.\n\n### 1.2 Why it fails the CEO bar\n\n- Super is one altitude (school). Student is one job (my work). Teacher answers \u201cwhere do I work?\u201d five ways (House, Inbox, Class, Ask, Capture) **plus** ten desk icons.\n- Capture is duplicated (header + tray) without a spoken rule in chrome copy.\n- Inbox (tray) vs Needs you (desk) are two nouns for one waiting family.\n- Tray **Class** hard-lands Gradebook (`href: .../gradebook`), so records = \u201copen the book.\u201d\n- `ChromeProvider` sets `role: 'teacher'` whenever `isTeacherRole(profile)` (includes `also_teacher`). Dual-hat **cannot sit in Office** \u2014 teacher tray wins. That is the altitude bug.\n- Drawer `staff = teacher \\|\\| administrator \\|\\| superintendent`, then `isAdminRole` injects People / Activity / Responsibilities. Pure teacher must never own those nouns.\n\n### 1.3 What is *not* the problem\n\nCapture itself. Matcher. Approve-as-last-click. Five-slot tray. Hamburger identity row. Office tray for office seats. Student tray. Those stay.\n\n## 2. Target IA\n\nTeacher seat (v1). Same five tray slots. Same routes unless noted. Clarity = **one altitude per moment**.\n\n```\nTeacher signed in (seat = teacher)\n\u251c\u2500\u2500 AppHeader (recipe unchanged)\n\u2502   \u251c\u2500\u2500 camera  \u2192 propose only\n\u2502   \u251c\u2500\u2500 search \u00b7 messages \u00b7 \u2630\n\u251c\u2500\u2500 FloatingTabTray (still 5 \u2014 no sixth)\n\u2502   \u251c\u2500\u2500 Desk     \u2192 active class work (Today default)\n\u2502   \u251c\u2500\u2500 Capture  \u2192 /capture (class-aware; stay-on-Capture after save)\n\u2502   \u251c\u2500\u2500 Needs    \u2192 unassigned + drafts waiting Approve (label; /inbox OK)\n\u2502   \u251c\u2500\u2500 Class    \u2192 records cluster (Students/setup default \u2014 not Gradebook-first)\n\u2502   \u2514\u2500\u2500 Ask      \u2192 /ask with classId when a class is active (tray-last)\n\u2514\u2500\u2500 Class desk \u2014 two altitudes, \u22647 default PersonTabs\n    Work:  Today \u00b7 Needs \u00b7 Feed\n    Class: Students \u00b7 Assignments \u00b7 Gradebook \u00b7 Parents\n    Not default chrome: This week (Today filter), Heatmap (Gradebook pane),\n                        Family (drawer / Class overflow), Syllabus (AVG path)\n```\n\nMental model: **Desk** = this class\u2019s week. **Capture** = put work in. **Needs** = waiting you. **Class** = roster / book / structure. **Ask** = help inside that class.\n\n| Other hats | v1 |\n|---|---|\n| Super / admin | **No change** to office tray or `OFFICE_CLASS_TABS`. |\n| Student / Parent | **No change** in this epic. |\n| Dual-hat | **Seat switch.** Teacher seat chrome === pure teacher. Office nouns hide. Parent \u201cMy children\u201d stays drawer-only. |\n\nPhone: Capture stack + glance Needs. Web \u2265720: same five destinations, **labels on** (Desk \u00b7 Capture \u00b7 Needs \u00b7 Class \u00b7 Ask). Approve / assign remain web-primary (MVP). Same routes and permissions; density differs, not product law. No left rail. No second mobile IA.\n\n## 3. What to delete vs keep\n\nThis is the chrome contract. **Keep the components.** Change *who sees what* and *which keys are default*.\n\n### 3.1 Keep (do not remove)\n\n| Surface | Keep | Rule |\n|---|---|---|\n| `AppHeader` | Camera \u00b7 Search \u00b7 Messages \u00b7 \u2630 | Camera proposes; tray Capture files. Copy/tooltip only in polish. |\n| `FloatingTabTray` | **Five** teacher slots | Desk \u00b7 Capture \u00b7 Needs \u00b7 Class \u00b7 Ask last. No sixth. No Profile tab. |\n| Capture loop | `/capture`, stay-on-Capture, spoken name, matcher | Phone primary. Matcher **never** inserts a student. |\n| Needs / Inbox | `/inbox` route | User-facing noun **Needs**. Do not rename route in v1. |\n| `ClassTabs` / `PersonTabs` | Component + class routes | Cut **default set**, not the widget. |\n| Gradebook, Assignments, Students/setup, Parents | Destinations | Reachable from Class cluster / remaining tabs. |\n| Hamburger | Identity, class switch, Profile, Appearance, Sign out | Facebook chrome law. |\n| Office tray | Super/admin five | Untouched when seat = office. |\n| `OFFICE_CLASS_TABS` | Feed \u00b7 Teacher \u00b7 Parents \u00b7 Students | Never teacher ClassTabs. |\n| Ask | One `/ask` | Tray-last. Class-bound when `classId` set. |\n\n### 3.2 Remove from *teacher seat chrome* (hide / demote \u2014 do not delete routes)\n\n| Item | From | How |\n|---|---|---|\n| Office People / Manage / Matrix / school Activity | Tray, home PersonTabs, drawer | Role/seat gate. Pure teacher never sees as primary. |\n| Tray Class \u2192 Gradebook-first | `tabsFor` class href | Land Students/setup or Class hub. |\n| ClassTabs: This week, Heatmap, Family as default icons | `CLASS_TABS` visible set | Week = Today filter; Heatmap = gradebook `?tab=`; Family = drawer/overflow. Routes stay. |\n| Drawer competing primaries | Grade book / Parents / Family update as peers of tray | Demote. Search still finds them. |\n| Drawer Feed for pure teacher | `HamburgerDrawer` non-super Feed row | Desk Feed tab is enough. |\n| Class-create / New class | Home, drawer, Ask, Capture | `canCreateClass` stays `isOfficeRole`. No \u201cAnother class\u201d that *creates*. Switch-class (`/?switch=1`) only. |\n| Extra Ask | ClassTabs, header, second tray key, desk FAB | Forbidden. Bind context on existing `/ask`. |\n| Student-skin chrome | Teacher tray/desk | Forbidden. Do not copy `/todo` IA. |\n\n### 3.3 Tray / tabs / hamburger \u2014 one line each\n\n- **Tray:** keep the five-slot teacher tray. Relabel Home\u2192Desk (a11y; keep `today` glyph unless Chuck wants a new IconName). Relabel Inbox\u2192Needs. Retarget Class. Bind Ask. Hide office keys on teacher seat.\n- **Tabs:** keep PersonTabs. Default \u22647: Today \u00b7 Needs \u00b7 Feed \u00b7 Students \u00b7 Assignments \u00b7 Gradebook \u00b7 Parents. AVG Syllabus is **not** a v1 default icon (setup card / gradebook banner first).\n- **Hamburger:** keep. Teacher cluster = who I am \u00b7 classes I teach \u00b7 switch class \u00b7 Profile \u00b7 Appearance \u00b7 Sign out. No Office People. No Create class. Dual-hat parent row OK.\n\n## 4. Constraints\n\n**Product**\n\n- Phone captures; web reviews, assigns, grades. Nothing is a grade until Approve.\n- Capture loop stays primary. Do not merge Capture into Desk-only. Do not delete tray Capture.\n- No class-create on Teacher (home, drawer, Ask, Capture, syllabus, diary).\n- No extra Ask surface. Do not hide Ask either \u2014 research \u201cdrop global Ask\u201d is **overruled**: keep tray-last, class-scoped.\n- Teachers do not become Office (no People/Matrix on desk) and do not become Student (no todo skin).\n\n**Engineering (when Chuck sends \u2014 not this ticket)**\n\n- Touch: `FloatingTabTray.tabsFor`, `CLASS_TABS` default order, `HamburgerDrawer` staff branch, `ChromeProvider` **seat vs `isTeacherRole`**, teacher `index` home tabs, Ask `classId` chip. Prefer a11y/label over new `IconName`.\n- **Seat:** chrome.role must follow explicit seat, not `also_teacher`. Dual-hat: teacher seat === A1 gates; office seat === office tray. Never merge trays.\n- No SQL. No migrations. No new packages. No route rename `/inbox` \u2192 `/needs` in v1.\n- AVG syllabus stays Class-desk altitude (not Office, not a tray key). Diary/Ledger stay hamburger, not tray (DIARY-A1).\n- Icon pipeline: if a new glyph is ever required, `scripts/build-icons.mjs` then `npm run icons`. Prefer not.\n\n**Phasing (plan TEACH-UX-P1; do not staff here)**\n\nA altitude locks \u2192 B ClassTabs + Class landing \u2192 C Needs noun + Ask context \u2192 D web labels + capture copy. AVG may land in parallel on Class desk but must not restore 10-tab default.\n\n## 5. Acceptance\n\n- [x] Chrome remove vs keep (tray, tabs, hamburger) stated.\n- [x] Capture loop primary; no class-create; no extra Ask.\n- [x] Teacher \u2260 Office \u2260 Student.\n- [x] Grounded in live files + TEACH-UX-P1 / R1.\n- [x] No SQL, no app code, no kelyra-qa-loop, no git push.\n- [ ] CEO/CoS review. **No senior-developer until Chuck says send.**\n\n### Handoff\n\n| Field | Content |\n|---|---|\n| **OBJECTIVE** | Teacher chrome architecture for CEO/CoS |\n| **CONTEXT** | TEACH-UX-P1 + R1; live tray/tabs/drawer; dual-hat `isTeacherRole` bleed |\n| **REQUIREMENTS** | Remove vs keep; capture primary; no class-create; no extra Ask |\n| **CONSTRAINTS** | No SQL; no impl; no rewrite; no student skin |\n| **FILES** | `notes/company/teacher-ux-architecture.md` |\n| **WORK PERFORMED** | Architecture note from live chrome + plan |\n| **VERIFICATION** | File fills skeleton \u00a7\u00a70\u20135; no src/ or supabase edits |\n| **RESULT** | Ready for CEO/CoS |\n| **OPEN ISSUES** | PM Q1 (Desk vs House a11y), Q2 (Family drawer vs overflow) \u2014 Architect: keep `today` glyph; Family drawer-only in v1 |\n| **ESCALATION NEEDED** | None for writing. Impl blocked on Chuck \u201csend\u201d |\n| **RECOMMENDED NEXT ACTION** | CEO/CoS review. If yes, CoS staffs Phase A only. |\n"}, {"label": "Security (S1)", "name": "teacher-ux-security.md", "text": "# TEACH-UX-S1: Security \u2014 teacher chrome\n\n**Date:** 2026-09-04\n**Author:** security (Kelyra)\n**Ticket:** t_f9588698 (TEACH-UX-S1)\n**Status:** Review only \u2014 no SQL, no app code, no migrations, no Edge handlers, no kelyra-qa-loop, no git push.\n**Depends on:** `notes/company/teacher-ux-architecture.md` (TEACH-UX-A1); plan `teacher-ux-plan.md`; research `teacher-ux-research.md`.\n**Live ground:** `ChromeProvider` (`isTeacherRole` first), `FloatingTabTray.tabsFor`, `CLASS_TABS` / `OFFICE_CLASS_TABS`, `HamburgerDrawer` staff + `isAdminRole` inject, `src/lib/school/roles.ts`, `src/app/search.tsx`, `askToolPolicy.ts`, `createClass.security.test.ts`.\n**Legal posture:** Engineering threat model and implementation gates. Not a legal opinion and not a claim of FERPA \u201cschool official\u201d status. Soft FERPA still applies (`docs/architecture.md`, `docs/mvp.md`).\n\n**Non-goals:** Implementation, Architect SQL, QA plan, staffing `senior-developer`. This epic adds **no tables, no columns, no RPCs, no new PII fields.**\n\n---\n\n## 0. Verdict\n\nTEACH-UX-A1 product law is sound: chrome-only; five tray slots; no sixth / Profile-in-tray; Capture stays primary; matcher never inserts students; no class-create on Teacher; one `/ask` with a class context chip; Teacher \u2260 Office \u2260 Student; dual-hat is a **seat switch**, not a merged tray; demote tabs (do not delete routes); Office tray and `OFFICE_CLASS_TABS` untouched.\n\nThis epic does **not** create a new PII surface. Relabel Inbox\u2192Needs, retarget Class away from Gradebook-first, cut default ClassTabs, hide office nouns on teacher seat \u2014 those are IA. Education records (roster, captures, drafts, scores, family updates, directory) already live behind existing routes and RLS.\n\n**Chrome is not security.** Hiding People / Activity / Matrix / Family from teacher chrome does not revoke JWT capabilities. Client chips, a11y labels, and tab order are not FERPA controls. Dual-hat office+teacher still has an office JWT; dual-hat teacher+parent still has `parent_id`. Server walls stay: `class_teacher_of` for taught-class writes; `isOfficeRole` for class-create / family-link; `teacherSeatOnly` must not weaken to \u201coffice if they also teach\u201d; Ask tools filtered after `getUser` + profile \u2014 never `body.role`.\n\n**Do not implement** until CEO says send **and** the v1 must-fix list in \u00a72.4 is copied into any future qa-loop. Security does not authorize staffing.\n\nReady for CEO/CoS.\n\n## 1. Threats\n\nAttacker profiles: curious student JWT; parent JWT (incl. invite token); teacher of class A on class B; office seat; dual-hat admin+teacher (`also_teacher`); dual-hat teacher+parent (`parent_id`); modified Expo client; typed/deep-link URLs to demoted routes; Ask tool-loop with stuffed `classId`; Search treating `isStaffRole` as school directory.\n\n### 1.1 Data classes (unchanged \u2014 chrome does not add rows)\n\n| Data | FERPA / sensitivity | Where it already lives | Chrome change |\n|---|---|---|---|\n| Class feed / teacher copy | Directory-ish / class comms | posts, landing (other epics) | Desk Feed tab stays; drawer Feed demoted for pure teacher |\n| Roster names, photos, setup | Education records | `/class/{id}/setup`, `listRoster` | Tray Class may land here first \u2014 **same** teacher read, not a new audience |\n| Captures / inbox / drafts | Education records + work product | `/capture`, `/inbox`, matcher | Relabel Needs; same queues; badge = count not names |\n| Gradebook scores / heatmap | Education records | gradebook routes | Demote Heatmap from default icons; route stays; nothing is a grade until Approve |\n| Family update drafts | Education records / comms | `/class/{id}/family` | Not default ClassTab; drawer/search still reach; **not** family-visible from this epic |\n| School directory / People / Activity / matrix | Staff PII + student directory | office tabs, `/activity`, `/admin/matrix` | **Hide on teacher seat.** Dual-hat office sees them only on **office seat** |\n| Parent \u201cMy children\u201d | Other-family education records | `/parent` | Drawer-only; not teacher tray |\n| Ask prompts | Third-party processing | Edge / `ai:dev` | Bind `classId` chip only; no extra Ask surface; no roster dump because chrome changed |\n\n**Product law (unchanged):** Phone captures; web reviews. Matcher never inserts a student. Teachers do not create classes. Nothing is a grade until Approve. Twins never mix. Model keys stay server-side.\n\n### 1.2 T1 \u2014 Treating chrome hide as RLS\n\n**Severity: P0 if implementers ship UI-only gates**\n\nA1 \u201cpure teacher never sees Office People / Manage / Matrix / school Activity as primary chrome\u201d is correct IA. It is **not** a revoke. A modified client, deep link (`/?tab=people`, `/activity`, `/admin/matrix`), or Ask `open_screen` still hits the route. If RLS/matrix already deny pure teacher, good. If any of those routes key off `isStaffRole` / `isTeacherRole` / `chrome.role` instead of `isOfficeRole`, hiding the tab is theater.\n\n**Must-fix:** Do not add client-only `if chrome.role === teacher return []` as the People/Activity/matrix **data** gate. Existing office RPCs stay `isOfficeRole` / `is_school_admin`. This epic must not widen those helpers to `also_teacher`. Tests: pure teacher JWT 403/empty on directory firehose, activity, matrix \u2014 independent of tray.\n\n### 1.3 T2 \u2014 Dual-hat: `isTeacherRole` wins chrome (live)\n\n**Severity: P0 for altitude; P1 for FERPA if trays merge**\n\nLive `ChromeProvider`: `if (isTeacherRole(profile)) return 'teacher'` **before** staff/office. `isTeacherRole` is `role === 'teacher' || also_teacher`. Superintendent/administrator with `also_teacher` **cannot sit in Office** \u2014 teacher tray wins. That is the A1 altitude bug.\n\nWrong \u201cfixes\u201d:\n- Merge office + teacher trays (People next to Capture) \u2014 **forbidden**. New incidental PII surface on the class desk.\n- Offer office Ask tools while chrome.role is teacher (or vice versa) because `also_teacher`.\n- Weaken `teacherSeatOnly` (`isOfficeRole` \u2192 false) so dual-hat office can draft syllabus from office JWT.\n\n**Must-fix:** Explicit **seat**, not hat-OR. Teacher seat chrome === pure teacher (A1 \u00a73). Office seat chrome === live office tray / `OFFICE_CLASS_TABS`. Never merge. Parent \u201cMy children\u201d stays drawer-only. Seat is client chrome state (AsyncStorage OK). **v1: do not add a `current_seat()` table** (same as DIARY-S1). JWT/RLS still by profile + `class_teacher_of` / `isOfficeRole`. Product seat does not grant extra SQL.\n\nOffice JWT on teacher seat: they may still *be able* to call office RPCs (same uid). Product must not *offer* office Ask tools or People chrome until they switch seat. Do not pretend RLS can hide their own office capabilities without a real seat in the token \u2014 accept same-uid residual (DIARY-S1). Cross-user leaks remain P0.\n\n### 1.4 T3 \u2014 Drawer `isAdminRole` inject on teacher chrome (live)\n\n**Severity: P1 (P0 if matrix/activity become teacher-primary)**\n\nLive `HamburgerDrawer`: `staff = chrome.role teacher|administrator|superintendent`, then `isAdminRole(profile)` injects People / Activity / Messages / Responsibilities. `isAdminRole` ORs `also_administrator`. A teacher primary with `also_administrator` sees office nouns while chrome.role is teacher. Super drawer is a separate branch (`profile.role === 'superintendent'`).\n\nA1: teacher hamburger = who I am \u00b7 classes I teach \u00b7 switch class \u00b7 Profile \u00b7 Appearance \u00b7 Sign out. No Office People. No Create class.\n\n**Must-fix:** Gate drawer office nouns on **office seat** (or `isOfficeRole` **and** seat=office), not `isAdminRole` while seat=teacher. Do not delete `/activity` for office seat. Dual-hat parent row OK (`isAlsoParent`). Do not add class-create. Existing class **delete** trailing on the list is out of scope \u2014 do not expand it.\n\n### 1.5 T4 \u2014 Search as school directory (live)\n\n**Severity: P0 if teacher seat lists school People**\n\nLive `search.tsx`: `listDirectory()` when `office || (staff && !chrome.classId)`. `isStaffRole` includes teacher. A teacher with no active class (or after switch-class) can pull **school directory** into Search. A1 says demoted drawer items remain searchable \u2014 meaning Gradebook/Parents/Family **of the taught class**, not Office People.\n\n**Must-fix:** Teacher-seat search = active class roster / inbox / assignments / class parents (existing class-scoped calls). School `listDirectory` stays **office seat**. Do not key directory on `isStaffRole`. Recents in AsyncStorage: no scores, no other-class rosters. This epic\u2019s \u201cSearch still finds them\u201d must not be implemented as a directory firehose.\n\n### 1.6 T5 \u2014 Ask `classId` chip as security\n\n**Severity: P0 if chip replaces SQL**\n\nA1: one `/ask`; bind `classId` when a class is active; no extra Ask on ClassTabs/header/FAB. Binding a chip is UX. `class_id` in Ask args is attacker-controlled (modified client).\n\n**Must-fix:** No new Ask tools in this epic. Existing `officeOnly` (`create_class`, `add_student`, `link_parent_student`) stay office. Existing `teacherSeatOnly` stays false for `isOfficeRole`. Tools that write a class still `class_teacher_of` in SQL. Unknown tool names denied. `filterAskToolDefs` after `getUser` + profile \u2014 never `body.role`. Do not inject homework first names because chrome now \u201chas a class.\u201d Prompts: class name + id; no roster dump, no sibling names, no scores. Server-side keys only. Never `EXPO_PUBLIC_*`.\n\n### 1.7 T6 \u2014 Class-create, matcher insert, extra Ask, student skin\n\n**Severity: P0 if any ship**\n\nA1 forbids class-create on Teacher (home, drawer, Ask, Capture). Live `canCreateClass = isOfficeRole`. \u201cAnother class\u201d is `/?switch=1` only. Matcher never inserts students. No student `/todo` IA on teacher tray.\n\n**Must-fix:** Chrome PR must not touch `create_class` tools, `canCreateClass`, or matcher insert paths. No sixth tray tab. No Profile-in-tray. No new capture PII (header camera remains propose; tray Capture files). AVG syllabus not a default ClassTab (own epic). Diary/Ledger stay hamburger (DIARY-A1).\n\n### 1.8 T7 \u2014 Demoted routes / deep links / client filters\n\n**Severity: P1 (P0 if family DTO shared)**\n\nHiding This week / Heatmap / Family from default ClassTabs does not unpublish routes. Teacher of that class may still open them (OK). Student/parent must not gain them because a tab was demoted or because tray Class now lands on setup.\n\nLanding Class on Students/setup instead of Gradebook-first does **not** authorize family or student to SELECT setup. Two serializers remain: teacher DTO vs family DTO \u2014 never \u201chide in UI.\u201d\n\n**Must-fix:** No change to family/student RLS. Needs badge = numeric count, not student names or draft scores. Do not put JWT in query string on any retargeted href.\n\n### 1.9 T8 \u2014 Dual-hat parent / twins\n\n**Severity: P0 for sibling mash-up; P1 for same-uid**\n\nDrawer \u201cMy children\u201d \u2192 `/parent` is a seat change. Teacher desk queries must not UNION `parent_students`. Parent seat must not SELECT taught-class drafts/gradebook because they teach.\n\nTwins: unchanged. This epic adds no parent payload. Cache keys that include classId must not drop child id on parent surfaces. Missing/invalid child id \u2192 empty, not a blend.\n\n### 1.10 T9 \u2014 New persistence (seat table, claims, logs)\n\n**Severity: P1**\n\nDo not mint `current_seat()` SQL, JWT custom claims, or audit rows \u201cswitched to teacher seat\u201d on Office `/activity` (existence theater). Logs: profile id + class id \u2014 not roster bodies. Vendor/Ask: unchanged soft FERPA.\n\n## 2. Controls\n\nA1\u2019s chrome contract is IA. Server must keep enforcing today\u2019s walls. UI hiding is not FERPA control.\n\n### 2.1 What chrome may change vs must not\n\n| May (IA) | Must not |\n|---|---|\n| Relabel Home\u2192Desk (a11y), Inbox\u2192Needs | Rename `/inbox` route in v1 |\n| Retarget tray Class href to setup/hub | New routes that SELECT extra tables |\n| Cut default `CLASS_TABS` to \u22647 | Delete Heatmap/Family **routes**; merge `OFFICE_CLASS_TABS` |\n| Hide office nouns on **teacher seat** | Hide as the only People/Activity/matrix control |\n| Bind Ask `classId` chip | Extra Ask surface; client-only tool allow-list |\n| Explicit seat switch UI | Seat table; merged tray; `isTeacherRole` as chrome.role |\n\n### 2.2 Dual-hat seat (lock)\n\n| Seat | Chrome | Ask tools offered | SQL |\n|---|---|---|---|\n| Teacher | A1 teacher tray + ClassTabs | Teacher tools; **not** officeOnly | `class_teacher_of` writes; no `create_class` |\n| Office | Live office tray; `OFFICE_CLASS_TABS` | Office tools; **not** teacherSeatOnly | `isOfficeRole` / admin helpers; not homework firehose |\n| Parent (drawer) | Parent chrome | Family read tools only | `parent_students`; twins fail closed |\n\n`also_teacher` / `also_administrator` / `parent_id` are hats, not chrome.role.\n\n### 2.3 Surfaces this epic must not widen\n\n- `listDirectory` / People / matrix / `/activity`\n- `listSchoolClasses` vs `listClasses`\n- Capture matcher, inbox SELECT, gradebook, family update\n- Ask policy map (no new names; do not copy `assignments.manage`)\n- Student / parent trays\n\n### 2.4 v1 must-fix (copy into qa-loop if Chuck sends)\n\n1. Chrome.role = explicit seat, not `isTeacherRole` first. Never merge trays.\n2. Teacher-seat drawer: no People / Activity / Responsibilities / class-create. Parent row OK.\n3. Teacher-seat Search: class-scoped only; not `listDirectory` via `isStaffRole && !classId`.\n4. Ask: one `/ask`; chip \u2260 SQL; do not weaken `teacherSeatOnly` / `officeOnly`.\n5. No matcher insert, no `canCreateClass` change, no sixth tab, no student skin.\n6. Demoted tabs \u2260 revoked data for the teacher of that class; \u2260 new data for family/student.\n7. Badge counts not names/scores. No JWT in query string.\n8. No `current_seat()` table. No Office `/activity` for seat switches.\n9. Client hide is not RLS. Tests use JWT, not screenshots of the tray.\n\n## 3. Acceptance\n\n- [x] No new PII surfaces from TEACH-UX-A1 (chrome/IA only).\n- [x] Dual-hat seat vs live `isTeacherRole` / `isAdminRole` bleed named as gates.\n- [x] Search, Ask classId, drawer office nouns, class-create, matcher called out.\n- [x] Chrome \u2260 RLS; \u00a72.4 must-fix list for future qa-loop.\n- [x] No SQL, no app code, no kelyra-qa-loop, no git push.\n- [ ] CEO/CoS review. **No senior-developer until Chuck says send.**\n\n### Handoff\n\n| Field | Content |\n|---|---|\n| **OBJECTIVE** | Security review of teacher chrome (no new PII surfaces) |\n| **CONTEXT** | TEACH-UX-A1; live `ChromeProvider` / tray / drawer / search / Ask policy |\n| **REQUIREMENTS** | notes/company/teacher-ux-security.md for CEO/CoS |\n| **CONSTRAINTS** | No SQL; no app code; chrome is not RLS |\n| **FILES** | `notes/company/teacher-ux-security.md` |\n| **WORK PERFORMED** | FERPA/security note: A1 law sound; dual-hat seat + Search directory + Ask chip gates |\n| **VERIFICATION** | File fills \u00a7\u00a70\u20133; no src/ or supabase edits |\n| **RESULT** | Ready for CEO/CoS |\n| **OPEN ISSUES** | Live T2/T3/T4 already in production chrome \u2014 fix only if Chuck sends TEACH-UX |\n| **ESCALATION NEEDED** | None for writing. Impl blocked on Chuck \u201csend\u201d |\n| **RECOMMENDED NEXT ACTION** | CEO/CoS review. If yes, CoS staffs Phase A only; copy \u00a72.4 into qa-loop. |\n\n"}, {"label": "Acceptance (Q1)", "name": "teacher-ux-acceptance.md", "text": "# TEACH-UX-Q1: Acceptance plan \u2014 teacher chrome (not a Build send)\n\n**Date:** 2026-09-04\n**Author:** qa-supervisor\n**Ticket:** t_f6884e78\n**Status:** **PLAN ONLY** \u2014 not a Build send, not a release cert, not kelyra-qa-loop.\n**Gate:** Implementation remains forbidden until Chuck later says **send**. Developers will not self-certify.\n\n**Depends on (read-only pack):**\n\n| Artifact | Role in this plan |\n|---|---|\n| `notes/company/teacher-ux-plan.md` (TEACH-UX-P1) | Before/after IA, phases A\u2013D, v1 vs later, non-goals |\n| `notes/company/teacher-ux-architecture.md` (TEACH-UX-A1) | Chrome keep/remove contract; seat vs hat; capture primary |\n| `notes/company/teacher-ux-security.md` (TEACH-UX-S1) | Must-fix \u00a72.4 (T1\u2013T9); chrome \u2260 RLS |\n| `notes/company/teacher-ux-research.md` (TEACH-UX-R1) | Problem framing (context only) |\n\n**Non-goals of this ticket**\n\n- No app code, migrations, Edge, IconName pipeline, or SQL apply.\n- No `kelyra-qa-loop` / `author-qa-loop`.\n- No release sign-off and no eng staffing authorization.\n- No inventing sixth tray tab, student skin, office People on desk, seat SQL table, or `/inbox` \u2192 `/needs` route rename.\n\n---\n\n## 0. Scope \u2014 what \"good\" means later\n\nWhen Chuck authorizes implementation, a **future** build loop is accepted only if:\n\n1. Every **P0** row in this matrix has **evidence** (automated test, JWT fixture, or scripted UI check with artifact).\n2. Every **TEACH-UX-S1 \u00a72.4 must-fix** is covered (see \u00a73.1).\n3. Explicit **non-acceptance** items (\u00a74.2) are regression-guarded.\n4. CoS does **not** treat green typecheck / screenshot-of-tray alone as product release; dual-hat seat, Search directory, Ask chip, and altitude walls need named evidence.\n5. Developers do **not** self-certify the epic \u2014 CEO send + this plan + loop evidence.\n\nUntil then: this file is the contract for that future loop.\n\n### 0.1 Product laws (always fail closed)\n\n| ID | Law | Source |\n|---|---|---|\n| L1 | Teacher = **class desk** product (capture \u2192 match \u2192 review drafts \u2192 assign \u2192 Approve). Not Office. Not Student. Not a second Ask app. | P1 \u00a70, A1 \u00a70 |\n| L2 | **One altitude per moment.** Teacher seat chrome === pure teacher. Never merge office + teacher trays. | A1 \u00a72, S1 T2 |\n| L3 | **Chrome is not security.** Hiding People / Activity / Matrix does not revoke JWT. Server walls stay (`class_teacher_of`, `isOfficeRole`, Ask after `getUser`). | S1 \u00a70, T1 |\n| L4 | Capture loop stays **primary**. Stay-on-Capture after save. Header camera **proposes**; tray Capture **files**. Matcher never inserts a student. | A1 \u00a70/\u00a73, MVP |\n| L5 | **No class-create** on Teacher (home, drawer, Ask, Capture). `canCreateClass` stays `isOfficeRole`. Switch-class only. | A1 \u00a73.2, S1 T6 |\n| L6 | **One `/ask`**, tray-last. Bind `classId` chip when on class path. Chip \u2260 SQL. No extra Ask on ClassTabs/header/FAB. | A1 \u00a70, S1 T5 |\n| L7 | Tray stays **five slots**. No sixth. No Profile-in-tray (ui-design \u00a734). | A1 \u00a70, P1 T-UX-10 |\n| L8 | ClassTabs default **\u22647**: Today \u00b7 Needs \u00b7 Feed \u00b7 Students \u00b7 Assignments \u00b7 Gradebook \u00b7 Parents. Demote Week/Heatmap/Family \u2014 do not delete routes. | P1 T-UX-3, A1 \u00a72 |\n| L9 | One waiting noun: tray **Needs** (label; `/inbox` route OK). Badge = **count**, not names/scores. | P1 T-UX-2, S1 T7 |\n| L10 | Tray **Class** lands Students/setup or Class hub \u2014 **not** Gradebook-first. | P1 T-UX-4, A1 \u00a73.2 |\n| L11 | `chrome.role` = **explicit seat**, not `isTeacherRole` first (`also_teacher` must not force teacher tray). | A1 \u00a74, S1 T2 |\n| L12 | Nothing is a grade until Approve. Model keys server-side only. No `EXPO_PUBLIC_*`. No rewrite / new shell. | AGENTS + A1 \u00a70 |\n\n### 0.2 In scope vs out of scope\n\n**In scope (must prove after CEO send):** Phase A\u2013D chrome gates on existing `FloatingTabTray`, `CLASS_TABS`, `HamburgerDrawer`, `ChromeProvider` seat, teacher home, Ask class chip, web top-bar labels, dual-hat seat switch, Search class-scoped on teacher seat, S1 must-fix, Office/Student trays unchanged.\n\n**Out of scope (do not fail v1 for missing):** visual restyle; sixth tray tab; `/inbox` route rename; full phone Approve/assign (S7); AVG Syllabus default ClassTab; Diary/Ledger tray keys; student tray simplification; left rail / new shell; seat SQL table / JWT claims; Liquid Glass.\n\n## 1. Tray / tabs / capture loop\n\n**Legend**\n\n| Sev | Meaning |\n|---|---|\n| **P0** | Blocks CEO-authorized ship / loop pass |\n| **P1** | Must fix before teacher-facing release |\n| **P2** | Track; may defer with CoS note |\n\n| Type | How to evidence later |\n|---|---|\n| **U** | Unit (tabsFor keys, CLASS_TABS order, policy pure fns) |\n| **I** | Integration / route fixtures with JWT + profile hats |\n| **UI** | Scripted or dogfood UI on phone tray + web \u2265720 |\n| **S** | Security static + seat JWT matrix (chrome \u2260 RLS) |\n| **R** | Regression vs frozen Office / Student / Capture / Approve |\n\n### 1.1 Floating tray (teacher seat)\n\n| ID | Sev | Type | Scenario | Expected |\n|---|---|---|---|---|\n| TR-01 | P0 | U/UI | Teacher seat tray keys | Exactly **five**: Desk \u00b7 Capture \u00b7 Needs \u00b7 Class \u00b7 Ask (last). No sixth. No Profile. |\n| TR-02 | P0 | U | Pure teacher never gets office tray keys | No Feed/Classes/People/Manage office set on teacher seat |\n| TR-03 | P0 | UI | Desk / House destination | Active class work surface; Today default when a class is active |\n| TR-04 | P0 | UI | Multi-class teacher | Desk
