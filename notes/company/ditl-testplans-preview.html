const TABS = [{"id": "Index", "title": "Index", "md": "# Kelyra DITL Test Plans (plans only) \u2014 REFINE-2 2026-09-10\n\n**Date:** 2026-09-10  \n**Author:** qa-supervisor (t_d9c91d8c refine-2; prior t_e3aecb51, t_fbf77e9a)  \n**SoT research:** `notes/company/ditl-role-research.md`  \n**CEO gate parent:** t_7ebea568  \n**Cases:** deferred until CEO restamp APPROVE \u2014 no QA Engineer yet\n\n---\n\n## CEO APPROVAL BLOCK\n\n```\nCEO STAMP (Chuck) \u2014 DITL test plans\nStatus:    PENDING\nDate:\nNotes:     REFINE-2 2026-09-10 (teardown every mutating plan; F-ARTIFACTS diversity + DB assert;\n           DITL-T-05 student data card photo; DITL-O-07 office bio attach; prior dual-path UI+Ask kept).\n           Awaiting restamp.\nNext:      After APPROVED, CoS staffs qa-engineer for cases + update-rerun matrix.\nDo not:    staff Engineering; invent features; treat NOT IN PRODUCT as fail steps.\n```\n\n---\n\n## How to read this pack\n\n- **Plans only** \u2014 ordered beats + surfaces + tags. No T-xx case scripts.\n- **Dual path (mandatory):** every in-app activity has **(A) Chrome UI** and **(B) Ask** (`/ask`, role-correct tools). Physical-only beats (camera capture, car-ahead photo) stay UI-primary with Ask noted if product allows a related action; else **PHYSICAL-ONLY**.\n- If Ask cannot do a UI task yet: mark Ask beat **PARTIAL / GAP** + name the UI surface that works. Do **not** invent Ask tools.\n- Beats exercise **SUPPORTED** or **PARTIAL** (gap called out). **NOT IN PRODUCT** lives in Non-goals / OPEN ISSUES \u2014 still listed so QE can fail honestly after stamp.\n- **Teardown (mandatory on mutating plans):** every plan that writes durable state has **Teardown / cleanup** \u2014 what was created, UI + Ask delete paths (GAP if missing), DB leftover check against **data-model tables only**, isolation (`ditl-` / fixture IDs), reverse-create order, idempotent if mid-plan fail. See **Global teardown contract**.\n- **Artifacts + DB assert:** ingest plans name fixture nistrator/superintendent | Comms blast |\n| DITL-O-07 | Office bio attach existing student (card fields) | administrator/superintendent | People Details bio |\n| DITL-X-01 | Author Studio pack emit | author (studio) | Studio-only day |\n\n**Count:** 21 plans (kept prior 19 + T-05 + O-07).\n\n---\n\n## Role coverage / exclusions\n\n| Role | Plans | Exclusion reason if none |\n|------|-------|--------------------------|\n| Parent | P-01, P-02, P-03 | \u2014 |\n| Teacher | T-01, T-02, T-03, T-04, T-05 | \u2014 |\n| Student | S-01, S-02, S-03 | \u2014 |\n| Dual-hat | DH-01, DH-02 | superintendent+teacher multi-school day NOT IN PRODUCT |\n| Administrator/office | O-01..O-07 | Attendance/SIS/reports NOT IN PRODUCT |\n| Superintendent | O-01..O-07 (super-only beats called out) | Multi-school district dashboard NOT IN PRODUCT (mvp L13). Same plans run under both office hats where both can act. |\n| Author studio | X-01 | Separate repo; not class-app daily role |\n\n**Superintendent vs Office:** Where both can act (people link, restrict, create class, feed/alert, bio update), plans run once as administrator and once as superintendent. Super-only: school name/logo (`school.identity`), Ride day photo archive (`ride.archive`), capability matrix edit (`school.matrix`).\n\n---\n\n## Dual-path law (all class-app plans)\n\n| Path | Meaning |\n|------|---------|\n| **UI** | Named tray tab / hamburger / route / control (chrome SoT `docs/ui-design.md`, `trayTabs.ts`) |\n| **Ask** | Same actor + outcome from `/ask` using **listed** tools in `askToolPolicy.ts` / `askTools.ts` only |\n| **PARTIAL / GAP** | Ask cannot perform UI task yet \u2014 record tool missing; keep UI beat |\n| **PHYSICAL-ONLY** | Requires camera/mic hardware path; Ask may only navigate or post-process if tool exists |\n| **NOT IN PRODUCT** | CEO story beat retained as plan expectation; QE fails honestly; do not invent tables |\n\nConfirm/undo: if product shows ConfirmSheet / destructive \u201ccannot be undone\u201d, both UI and Ask paths must exercise that gate (Ask may return confirm proposal before write).\n\n---\n\n## Global teardown contract (refine-2)\n\nShared rules so QE can later implement one cleanup harness:\n\n1. **Scope:** only rows/files/assets/events **this run created or mutated**, tagged `ditl-` in titles/bodies/QE log or recorded fixture IDs. Never school-wide wipe of seed the plan did not create.\n2. **Every mutating plan** ends with section **Teardown / cleanup** listing: created objects \u2192 UI delete/archive \u2192 Ask delete (or **GAP**) \u2192 DB leftover check naming **data-model** tables/RPCs only.\n3. **Order:** reverse of create (examples: unlink before delete person; leave Ride before delete vehicle; unban before delete parent; unpublish syllabus before delete class; revert metadata before delete student).\n4. **Idempotent:** safe if a beat failed mid-plan (skip missing; no error storms).\n5. **Destructive plans (O-03):** teardown is often **re-seed**, not undo.\n6. **Studio (X-01):** filesystem emit dirs only; no class-app DB.\n7. **Harness hooks (future QE):** collect `created[]` during run; call plan teardown; assert empty leftover query per plan checklist.\n8. **Ask gaps:** missing delete/leave/restrict/feed-create tools stay PARTIAL/GAP \u2014 UI cleanup still required.\n\n---\n\n## Shared fixtures (class-app)\n\n| Fixture ID | Contents |\n|------------|----------|\n| F-SCHOOL | One school; logo optional; feed icon set |\n| F-TEACHER-A | Teacher A; class Math; roster \u22655 including near-duplicate names |\n| F-TEACHER-B | Teacher B; other class; dual-hat child not in own class |\n| F-TEACHER-C | Extra teacher for reassignment / delete-from-school beats |\n| F-STUDENTS | S1\u2026S5 enrolled; S1\u2013S2 twins |\n| F-PARENT-1 | Parent linked to S1+S2; two vehicles; messaging to Teacher A |\n| F-PARENT-2 | Second parent on S1 (allowed pickup); used with ban on F-PARENT-1 |\n| F-DRAFTS | Captures: matched draft gaps + one Unassigned |\n| F-ASSI ps\n- Requiring OCR name-off-page for homework matcher (spoken name is mvp)\n\nPARTIAL call-outs stay inside plan non-goals / beat Support column.\n\n---\n\n## OPEN ISSUES (CEO / research \u2014 do not invent)\n\n1. **Attendance archive (CEO story 2):** Attendance **NOT IN PRODUCT**. Plan O-03 keeps the beat as PARTIAL/GAP expectation \u2014 QE fails honestly; do not invent attendance rows.\n2. **\u201cArchived\u201d people/grades remain:** Product delete/unenroll is largely **hard-delete**. Soft \u201cinactive but history retained\u201d is **PARTIAL/GAP** vs CEO wording.\n3. **Banned-parent office notification (CEO story 3):** Restriction + fail-closed check-in **SUPPORTED**. Proactive office notify of banned attempt may be **PARTIAL/GAP**. O-04 tags both.\n4. **Delete teacher from school (CEO story 4):** `remove_teacher_from_class` SUPPORTED. Whole-school teacher delete may be **PARTIAL**.\n5. **Ask create feed/alert:** UI create feed SUPPORTED. Ask has `list_feed` but **no** create tool \u2192 O-06/T-04 Ask create = **PARTIAL/GAP**.\n6. **Ask pickup restriction:** UI restrict SUPPORTED. No Ask tool \u2192 O-04 Ask ban = **PARTIAL/GAP**.\n7. **Focus exercise product shape:** Map to practice-on-focus; not invented chrome.\n8. **Author studio in class-app device farm?** X-01 studio-only.\n9. **Parent full grades book (AVG P-G*):** if still open, P-01/P-02 PARTIAL.\n10. **Student Ride:** no student Ride tab \u2014 intentional.\n11. **FERPA:** banned-parent and archive beats must not leak co-parent data or unpublished grades.\n12. **Student-card extraction support:** T-05 relies on shipped `student_card` classify + Details write (ui-design \u00a714.2 D). If a build lacks extract/confirm write, QE fails PARTIAL/GAP honestly \u2014 do not invent Document AI. O-07 office photo extract = **GAP** (no office Capture); field attach via Details/`update_student` SUPPORTED.\n13. **Teardown Ask gaps:** leave Ride, delete capture, delete message, create/delete feed, set/clear pickup restriction often UI-only \u2014 plans already GAP-tag; shared harness must not assume Ask cleanup exists.\n\n---\n\n## Plan files\n\n| ID | Path |\n|----|------|\n| DITL-P-01 | `notes/company/ditl-plans/DITL-P-01.md` |\n| DITL-P-02 | `notes/company/ditl-plans/DITL-P-02.md` |\n| DITL-P-03 | `notes/company/ditl-plans/DITL-P-03.md` |\n| DITL-T-01 | `notes/company/ditl-plans/DITL-T-01.md` |\n| DITL-T-02 | `notes/company/ditl-plans/DITL-T-02.md` |\n| DITL-T-03 | `notes/company/ditl-plans/DITL-T-03.md` |\n| DITL-T-04 | `notes/company/ditl-plans/DITL-T-04.md` |\n| DITL-T-05 | `notes/company/ditl-plans/DITL-T-05.md` |\n| DITL-S-01 | `notes/company/ditl-plans/DITL-S-01.md` |\n| DITL-S-02 | `notes/company/ditl-plans/DITL-S-02.md` |\n| DITL-S-03 | `notes/company/ditl-plans/DITL-S-03.md` |\n| DITL-DH-01 | `notes/company/ditl-plans/DITL-DH-01.md` |\n| DITL-DH-02 | `notes/company/ditl-plans/DITL-DH-02.md` |\n| DITL-O-01 | `notes/company/ditl-plans/DITL-O-01.md` |\n| DITL-O-02 | `notes/company/ditl-plans/DITL-O-02.md` |\n| DITL-O-03 | `notes/company/ditl-plans/DITL-O-03.md` |\n| DITL-O-04 | `notes/company/ditl-plans/DITL-O-04.md` |\n| DITL-O-05 | `notes/company/ditl-plans/DITL-O-05.md` |\n| DITL-O-06 | `notes/company/ditl-plans/DITL-O-06.md` |\n| DITL-O-07 | `notes/company/ditl-plans/DITL-O-07.md` |\n| DITL-X-01 | `notes/company/ditl-plans/DITL-X-01.md` |\n\n**Research SoT:** `notes/company/ditl-role-research.md`  \n**Chrome SoT:** `docs/ui-design.md` \u00a73 / \u00a714.2 / \u00a731 / `src/lib/chrome/trayTabs.ts`  \n**Ask tools SoT:** `src/lib/ai/askToolPolicy.ts`, `askTools.ts`  \n**Data model:** `docs/data-model.md` (teardown table names; metadata keys)  \n**MVP flows:** `docs/mvp.md` M1\u2013M11  \n**Messaging/feed:** `docs/messaging-v1.md`\n\n---\n\n## Handoff\n\n- Refine-2 pack ready for **CEO restamp on t_7ebea568** (APPROVE | REFINE | REJECT).\n- Do **not** staff QA Engineer until APPROVE.\n- After APPROVE: CoS creates qa-engineer card for cases + per-update rerun matrix using tags + coverage matrix above (include teardown harness).\n- Parent card stays sticky blocked until Chuck stamps.\n"}, {"id": "DITL-DH-01", "title": "DITL-DH-01", "md": "# DITL-DH-01 \u2014 Dual-hat Teacher+Parent mixed day\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-DH-01 |\n| Title | Dual-hat: AM teacher capture, PM Parent seat Ride + child grades |\n| Primary hat | teacher (job of record) + parent_id hat |\n| Other hats | switches to parent seat |\n| Support | SUPPORTED hats / seat switch (ui-design \u00a731.4b) |\n| Regression tags | `dual-hat`, `seat-switch`, `capture`, `ride`, `grades`, `chrome-teacher`, `chrome-parent`, `ask-dual` |\n\n## Goal / story\n\nSame login is a teacher and a parent of a student (not necessarily own class). Morning: teach on teacher seat (capture). Afternoon: **altitude switch to Parent seat** (not merely My children deep-link) so tray becomes Home \u00b7 Ride \u00b7 Ask, check child grades, Ride pickup, then switch back to Teach and sign out.\n\n## Preconditions / fixtures\n\n- Profile: `role=teacher` with `parent_id` linked to \u22651 child (prefer child in another teacher\u2019s class to stress walls).\n- Teacher class roster + capture-ready work.\n- Parent vehicles + Ride lines.\n- `canChooseSeat` / drawer rows **Parent** and **Teach** per ui-design.\n\n## Beat list\n\n| # | Beat | Surface |\n|---|------|---------|\n| 1 | Sign in; land teacher seat | `/sign-in` \u2192 teacher tray |\n| 2 | Drawer: both **My children** (deep-link) and **Parent** (seat switch) visible as designed | hamburger |\n| 3 | Capture one file on own class | `/capture` |\n| 4 | **My children** deep-link: opens `/parent` **without** flipping tray to parent (no Ride tab under teacher chrome) | `/parent` under staff chrome |\n| 5 | Back; confirm still teacher tray (Desk\u2026Ask) | tray |\n| 6 | Drawer **Parent** altitude switch \u2192 atomic rebuild tray Home\u00b7Ride\u00b7Ask | seat switch |\n| 7 | Parent Home: own children only; no teacher gradebook write | `/parent` |\n| 8 | Ride check-in for linked child | `/parent/ride` |\n| 9 | Leave line | `/parent/ride` |\n| 10 | Ask on parent seat (parent context) | `/ask` |\n| 11 | Drawer **Teach** switch back; tray teacher 5; wordmark from new seat only | seat switch |\n| 12 | Confirm no concatenated trays / no Ride on teacher | tray |\n| 13 | Sign out | hamburger |\n\n## Lifecycle\n\nTeacher session \u2192 parent seat enter/leave Ride \u2192 return Teach \u2192 sign-out. Seat switch is full lifecycle both directions.\n\n## Multiplicity\n\nOwn class students vs own children; must not blend.\n\n## Reverse / cancel\n\nMy children without seat flip; leave Ride; switch back Teach.\n\n## Dual-hat\n\nCore of this plan. Office not required.\n\n## Functions exercised\n\nSeat switch atomic; dual drawer paths; capture; parent Home; Ride; Ask per seat.\n\n## Explicit non-goals\n\nTeacher editing own child\u2019s official grades via parent seat; office Manage; inventing dual chrome mash.\n\n## Dual path (UI + Ask) \u2014 refine 2026-09-10\n\n| Activity | UI | Ask |\n|----------|----|-----|\n| Capture on Teach seat | `/capture` | PHYSICAL-ONLY |\n| My children deep-link | drawer My children \u2192 `/parent` staff chrome | Ask must not flip seat |\n| Parent seat switch | drawer **Parent** | no Ask seat-switch tool \u2014 **UI-primary** altitude |\n| Parent grades / Ride | `/parent`, `/parent/ride` | Ask parent tools only **after** Parent seat; Ride PHYSICAL |\n| Ask per seat | tray Ask | teacher ops vs parent co-teacher walls |\n| Teach switch back | drawer Teach | UI-primary |\n\n## Suggested QE themes\n\nP-06 tray rebuild; Ride requires Parent seat; My children \u2260 Ride menu; Ask walls follow seat.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 teacher captures + parent Ride.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Teacher-seat captures | delete captures (T-01 rules) | PARTIAL | captures/assets clean for run |\n| Parent-seat Ride events | leave line | GAP | no live trip |\n| Seat switch | return Teach seat then sign out | \u2014 | profile seats unchanged |\n\n**Order:** leave Ride \u2192 switch Teach \u2192 delete captures \u2192 sign out.\n**Isolation:** dual-hat fixture F-DH-TP not deleted.\n"}, {"id": "DITL-DH-02", "title": "DITL-DH-02", "md": "# DITL-DH-02 \u2014 Dual-hat Office+Parent\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-DH-02 |\n| Title | Dual-hat: office People/Manage then Parent seat Ride |\n| Primary hat | administrator (or superintendent with also_ flags) |\n| Other hats | parent seat |\n| Support | SUPPORTED office chrome + parent hat; duty Ride under Manage not tray |\n| Regression tags | `dual-hat`, `seat-switch`, `office`, `ride`, `people`, `chrome-office`, `chrome-parent`, `ask-dual` |\n\n## Goal / story\n\nOffice staff who is also a parent: morning on office seat (Feed/Classes/People/Manage/Ask), links or views people as allowed, opens staff Ride duty via **Manage** altitude (no office Ride tray tab). Later switches to Parent seat for own children\u2019s Ride check-in, then returns to Office.\n\n## Preconditions / fixtures\n\n- `role=administrator` (or superintendent) with `parent_id`.\n- Optional `also_teacher` off unless testing Teach row.\n- School people directory; Ride admin routes exist (`/admin/ride` or `/ride` \u2192 Manage active).\n- Parent vehicles for own children.\n\n## Beat list\n\n| # | Beat | Surface |\n|---|------|---------|\n| 1 | Sign in office seat | `/sign-in` |\n| 2 | Tray: Feed \u00b7 Classes \u00b7 People \u00b7 Manage \u00b7 Ask (no Ride tab) | office tray |\n| 3 | People: directory / admin people | `/?tab=people`, `/admin/people` |\n| 4 | Manage pane; open staff Ride/duty wall | `/?tab=manage`, `/admin/ride`, `/ride` |\n| 5 | Confirm Manage tab active for duty routes | tray |\n| 6 | **Do not** expect parent leave control on duty wall | duty UI |\n| 7 | Drawer **Parent** seat switch | hamburger |\n| 8 | Parent tray Home\u00b7Ride\u00b7Ask only | parent tray |\n| 9 | Own child Ride check-in + leave | `/parent/ride` |\n| 10 | Parent Home children isolation | `/parent` |\n| 11 | Switch **Office** back; tray office 5 | seat switch |\n| 12 | If `also_teacher`: optional Teach switch smoke (not full T-01) | drawer |\n| 13 | Sign out | hamburger |\n\n## Lifecycle\n\nOffice \u2192 Parent (Ride in+leave) \u2192 Office \u2192 sign-out.\n\n## Multiplicity\n\nSchool people vs own children; staff lines vs parent trip children.\n\n## Reverse / cancel\n\nSeat switch reverse; leave parent line; abandon duty without release if testing read-only.\n\n## Dual-hat\n\nOffice+Parent primary; optional Teach row.\n\n## Functions exercised\n\nOffice tray; Manage-altitude Ride; people; parent seat Ride; atomic seat switch.\n\n## Explicit non-goals\n\nAttendance SIS; multi-school super dashboard; parent mint released; office syllabus edit.\n\n## Dual path (UI + Ask) \u2014 refine 2026-09-10\n\n| Activity | UI | Ask |\n|----------|----|-----|\n| People directory | `/?tab=people` | `list_people` office seat |\n| Manage duty Ride | Manage / `/admin/ride` | `open_screen`; no parent leave on duty |\n| Parent seat Ride | drawer Parent \u2192 `/parent/ride` | PHYSICAL check-in after seat UI switch |\n| Ask office vs parent | `/ask` each seat | office people tools vs parent `my_children_progress` only |\n\n## Suggested QE themes\n\nNo office Ride tab; duty\u2260parent leave; seat rebuild; Ask tool set follows seat.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Maybe light people link; parent Ride.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Any people link made in run | unlink | `unlink_parent_student` | parent_students only run links |\n| Parent Ride | leave | GAP | no live trip |\n| Office duty session | end duty | \u2014 | no sticky duty |\n\n**Order:** unlink test links \u2192 leave Ride \u2192 office seat \u2192 sign out. Do not delete F-DH-OP persons.\n"}, {"id": "DITL-O-01", "title": "DITL-O-01", "md": "# DITL-O-01 \u2014 Office People/Manage (partial day)\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-O-01 |\n| Title | Administrator/office supported surfaces only |\n| Primary hat | administrator (superintendent notes called out) |\n| Other hats | optional also_teacher / parent_id \u2192 see DH-* not duplicated |\n| Support | PARTIAL \u2014 people/activity/manage/identity; attendance NOT |\n| Regression tags | `office`, `people`, `manage`, `auth`, `school-identity`, `ride-duty`, `ask-dual` |\n\n## Goal / story\n\nOffice user runs a **supported** slice of a school day in Kelyra: sign in, scan Feed/Classes, manage people links within role rules, school manage settings they can touch, staff Ride duty wall if on duty, Ask for ops question. Explicitly does **not** attempt attendance, behavior, SIS, or district multi-school reports.\n\n## Preconditions / fixtures\n\n- Administrator login (separate pass: superintendent for logo/name/archive-only beats).\n- Classes exist; parents/students to link per permissions.\n- Super-only: school logo/name; Ride day photo archive if shipped.\n\n## Beat list\n\n| # | Beat | Surface |\n|---|------|---------|\n| 1 | Sign in office | `/sign-in` |\n| 2 | Feed tab glance | `/?tab=feed` |\n| 3 | Classes tab / admin class | `/?tab=classes`, `/admin/class\u2026` |\n| 4 | People: view directory; link parent\u2194student if administrator allowed | `/?tab=people`, `/admin/people` |\n| 5 | **Reverse:** unlink parent-student without deleting persons | people UI |\n| 6 | Manage: school settings available to role | `/?tab=manage` |\n| 7 | Super-only: set school name/logo if superintendent | manage / identity |\n| 8 | Staff Ride duty under Manage (order/curb as shipped) | `/admin/ride`, `/ride` |\n| 9 | Activity / audit skim if exposed | `/activity` |\n| 10 | Matrix if present (admin) | `/admin/matrix` |\n| 11 | Ask | `/ask` |\n| 12 | Confirm **no** attendance UI; **no** syllabus.manage as office | negative checks |\n| 13 | Sign out | hamburger |\n\n## Lifecycle\n\nSign-in \u2192 office loop \u2192 sign-out. Duty enter/exit if applicable without parent leave controls.\n\n## Multiplicity\n\nMany people/classes; role edit walls (admin cannot edit other admins/super per data-model).\n\n## Reverse / cancel\n\nUnlink; abandon manage edit; leave duty view.\n\n## Dual-hat\n\nDefer full switch to DH-02.\n\n## Functions exercised\n\nOffice chrome; people link; manage; duty Ride; activity; auth walls.\n\n## Explicit non-goals\n\nAttendance, behavior, SIS, CSV district reports, multi-school, becoming grade-of-record, office AVG policy editor.\n\n## Superintendent\n\nNo separate DITL plan. Super may run O-01 plus identity + Ride archive beats. Multi-school oversight **NOT IN PRODUCT**.\n\n## Dual path (UI + Ask) \u2014 refine 2026-09-10\n\n| Activity | UI | Ask |\n|----------|----|-----|\n| Feed/Classes glance | office tray tabs | `list_feed` / `list_classes` |\n| People link/unlink | people admin | `link_parent_student` / `unlink_parent_student` |\n| Manage settings | `/?tab=manage` | limited; identity super-only via `set_school_name`/`set_school_logo` |\n| Staff Ride duty | Manage altitude | open_screen; no restrict tool (see O-04) |\n| Activity/audit | `/activity` | `search_audit` |\n| Matrix | `/admin/matrix` | `set_capability_grant` super |\n| Ask ops | `/ask` | office tools; no syllabus.manage |\n\nDeep people/class/ban/feed days: **O-02..O-06**.\n\n## Suggested QE themes\n\nRole edit matrix; no attendance; Manage owns duty Ride; super-only archive; Ask dual on link.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Light \u2014 identity/settings only if changed.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| School name/logo if super changed | restore fixture logo/name | identity tools if any else UI | school identity baseline |\n| People link if touched | unlink | unlink tool | parent_students |\n| Ride duty | end | \u2014 | \u2014 |\n| Attendance attempts | N/A NOT IN PRODUCT | \u2014 | **no** invented attendance tables |\n\n**Order:** restore identity \u2192 unlink test \u2192 sign out.\n"}, {"id": "DITL-O-02", "title": "DITL-O-02", "md": "# DITL-O-02 \u2014 Roster + family link + bio + class assign\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-O-02 |\n| Title | Office/Super: add students/parents, link family, edit bio, assign classes |\n| Primary hat | administrator **and** superintendent (run both) |\n| Other hats | none (dual-hat \u2192 DH-02) |\n| Support | SUPPORTED people/link/enroll; bio via profile details |\n| Regression tags | `office`, `people`, `roster`, `family-link`, `bio`, `enroll`, `ask-dual`, `auth` |\n| CEO story | 1 \u2014 Roster + family link + bio + class assign |\n\n## Goal / story\n\nSuperintendent/Office adds students and parents, associates them, edits bio/contact, assigns students to classes. Every write runs **UI then Ask** (or Ask then UI on a second person) so both paths produce the same durable outcome.\n\n## Preconditions / fixtures\n\n- F-OFFICE, F-SCHOOL, F-TEACHER-A class empty slots, F-STUDENTS room for new names\n- Twins multiplicity: two new siblings optional\n- Run pass A as administrator; pass B as superintendent\n\n## Dual-path beat list\n\n| # | Activity | Support | UI path | Ask path |\n|---|----------|---------|---------|----------|\n| 1 | Sign in office seat | SUPPORTED | `/sign-in` \u2192 office tray Feed\u00b7Classes\u00b7People\u00b7Manage\u00b7Ask | \u2014 (auth) |\n| 2 | Add student person | SUPPORTED | People / admin people \u2192 add student | `/ask` `add_student` (officeOnly) |\n| 3 | Edit student bio (name/contact/notes as allowed) | SUPPORTED | `/profile?person=\u2026` or student person Details | `/ask` `update_student` |\n| 4 | Create parent person | SUPPORTED | People \u2192 add parent | `/ask` `create_parent` |\n| 5 | Edit parent bio | SUPPORTED | parent person Details / profile | `/ask` `update_parent` |\n| 6 | Link parent \u2194 student (family) | SUPPORTED | People link UI / admin_set_parent_link | `/ask` `link_parent_student` (officeOnly) |\n| 7 | Second parent on same child (multiplicity) | SUPPORTED | link F-PARENT-2 style | Ask `link_parent_student` second parent |\n| 8 | Enroll student into class | SUPPORTED | class roster add / admin class | `/ask` `enroll_student` |\n| 9 | Enroll same student second class | SUPPORTED | second class roster | Ask enroll other class |\n| 10 | Optional avatar | SUPPORTED | photo UI | `/ask` `set_avatar` |\n| 11 | Provision logins if needed | SUPPORTED | people provision | Ask `provision_student_login` / `provision_parent_login` / `admin_create_login` |\n| 12 | Reverse: unlink one parent (keep persons) | SUPPORTED | unlink control | `/ask` `unlink_parent_student` |\n| 13 | Verify directory lists + FERPA walls | SUPPORTED | `/?tab=people` | Ask `list_people` / `search_students` / `get_parent` |\n| 14 | Sign out | SUPPORTED | hamburger | \u2014 |\n\n## Lifecycle / reverse / multiplicity / dual-hat / non-goals\n\n- Lifecycle: create persons \u2192 link \u2192 bio edit \u2192 enroll \u2192 unlink \u2192 sign-out\n- Multiplicity: twins/siblings; two parents; two classes\n- Reverse: unlink without delete; do not hard-delete in this plan (see O-03)\n- Dual-hat: not required\n- Non-goals: attendance SIS; teacher minting family link (`link_parent_student` officeOnly); inventing fields; office syllabus\n\n## Suggested QE themes\n\nOffice vs super same outcomes; Ask+UI parity on link/enroll; unlink keeps persons; no cross-family bleed.\n\n## Artifacts + DB assert (refine-2)\n\nBio edits use canonical `students.metadata` / `parents.metadata` keys only (data-model). After `update_student` / Details save: assert `preferred_name`, `phone`, `email`, `address`, `birthday` (and parent keys) match typed values. New persons: `students.display_name`, `enrollments`, `parent_students` rows. **Photo student-card ingest is T-05** (teacher capture intent); O-02 is manual/Ask field path.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 persons, links, enrollments, bios, logins.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| New students `ditl-*` names | remove enrollment(s); delete student if test-only | remove enroll; `delete_student` if allowed | `students`, `enrollments` \u2014 no ditl test students left |\n| New parents | unlink all children; delete parent | `unlink_parent_student`; delete parent UI/RPC | `parents`, `parent_students` |\n| Bio edits on **fixture** persons | revert metadata keys to baseline | `update_student` / `update_parent` | `students.metadata` / `parents.metadata` canonical keys only |\n| Logins provisioned | revoke/disable if UI | provision reverse GAP/UI | `profiles` test logins gone |\n| Avatars set | clear profile photo | clear if tool | `photo_asset_id` null + asset unref |\n\n**Order:** revoke logins \u2192 clear photos \u2192 unlink parents \u2192 remove enrollments \u2192 delete test persons (not shared F-* seed) \u2192 revert fixture bios \u2192 sign out.\n**Idempotent:** skip already-deleted. **Do not** wipe entire school roster.\n"}, {"id": "DITL-O-03", "title": "DITL-O-03", "md": "# DITL-O-03 \u2014 Remove + archive (history must remain)\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-O-03 |\n| Title | Office/Super: remove from class; deactivate people; history preserved |\n| Primary hat | administrator **and** superintendent |\n| Support | PARTIAL \u2014 detach/delete shipped as hard-delete; soft archive GAP; attendance NOT IN PRODUCT |\n| Regression tags | `office`, `roster`, `archive`, `grades-history`, `delete`, `ask-dual`, `ferpa` |\n| CEO story | 2 \u2014 Remove + archive (do not lose history) |\n\n## Goal / story\n\nOffice removes a student from a class; removes students/parents from being active; **CEO expects** archived grade and attendance records to remain. Product today is largely hard-delete on person/class work \u2014 plan records honest Support tags so QE fails GAP without inventing tables.\n\n## Preconditions / fixtures\n\n- F-GRADES-HIST: student with approved grades in Class A and Class B\n- Student with two enrollments (remove-from-one-class path available)\n- F-OFFICE both hats\n\n## Dual-path beat list\n\n| # | Activity | Support | UI path | Ask path |\n|---|----------|---------|---------|----------|\n| 1 | Sign in office | SUPPORTED | `/sign-in` | \u2014 |\n| 2 | Baseline: note grade cells / submissions IDs for Sx in Class A+B | SUPPORTED | gradebook / student record read | Ask `list_grade_cells` if allowed else UI-only note |\n| 3 | Remove student from Class A only (still in B) | SUPPORTED (hard detach) | Student Details **Remove from {class}** (ui-design destructive) | Ask: no dedicated `unenroll` tool \u2192 **PARTIAL/GAP** (`delete_student` is full person \u2014 do not use as unenroll) |\n| 4 | CEO check: grades/attendance for Class A still archived | PARTIAL/GAP | Inspect remaining DB/UI history | Same. Product copy says class work **deleted** on remove \u2014 expect fail vs CEO \u201cremain\u201d unless product changed |\n| 5 | Attendance archive remains | NOT IN PRODUCT | Negative: no attendance UI | Ask must not invent attendance |\n| 6 | Deactivate student \u201cnot active\u201d without losing history | PARTIAL/GAP | If only hard-delete person exists, document; do not soft-invent | Ask `delete_student` = hard-delete \u2014 **not** soft archive |\n| 7 | Deactivate parent similarly | PARTIAL/GAP | parent delete UI | Ask `delete_parent` hard-delete |\n| 8 | If hard-delete used on disposable fixture only | SUPPORTED destructive | ConfirmSheet \u201ccannot be undone\u201d | Ask confirm before delete tools |\n| 9 | FERPA: co-parent must not see other family\u2019s unpublished | SUPPORTED | parent Home walls | Ask parent tools walls |\n| 10 | Reverse desire: restore active / undelete | PARTIAL/GAP explicit non-goal if no undelete | \u2014 | \u2014 |\n| 11 | Sign out | SUPPORTED | hamburger | \u2014 |\n\n## Lifecycle / reverse / multiplicity / non-goals\n\n- Lifecycle: baseline \u2192 detach \u2192 history assert \u2192 optional delete fixture \u2192 sign-out\n- Reverse: undelete/reactivate **non-goal** unless product ships it\n- Multiplicity: two-class student; two parents\n- Non-goals: invent archive tables; SIS; treating hard-delete success as CEO archive pass\n\n## OPEN (plan-local)\n\nMap to index OPEN #1\u20132. QE severity after stamp: missing soft-archive vs CEO = product defect disposition by PM, not silent plan skip.\n\n## Suggested QE themes\n\nRemove-from-class last-class refuse; history IDs; GAP tickets not false greens.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 detach/delete (destructive by design).\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Removed enrollment | already removed \u2014 **re-seed** fixture if shared env needs student | enroll again only if restoring seed | enrollment absent for removed class; other-class grades per product |\n| Hard-deleted person | cannot undelete \u2014 **re-seed** F-GRADES-HIST after run | `delete_student` | person gone; history PARTIAL/GAP vs CEO archive story |\n| Attendance archive beat | NOT IN PRODUCT \u2014 no rows | \u2014 | do not invent tables |\n\n**Order:** complete destructive beats \u2192 **re-seed fixtures** for next run \u2192 sign out.\n**Note:** teardown here is often **re-seed**, not undo. Isolation: only tagged victims.\n"}, {"id": "DITL-O-04", "title": "DITL-O-04", "md": "# DITL-O-04 \u2014 Banned pickup / messy divorce\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-O-04 |\n| Title | Office bans one parent pickup; banned tries Ride; office notified |\n| Primary hat | administrator **and** superintendent |\n| Other hats | banned parent + allowed co-parent (separate sessions) |\n| Support | SUPPORTED restrict + fail-closed check-in; PARTIAL office notify + Ask restrict tool |\n| Regression tags | `office`, `ride`, `pickup-ban`, `ferpa`, `messages`, `ask-dual`, `multiplicity` |\n| CEO story | 3 \u2014 Banned pickup / messy divorce |\n\n## Goal / story\n\nMessy divorce: two parents on one child. Office blocks Parent-1 from pickup. Parent-1 tries car rider check-in \u2192 fail closed (\u201cCheck in failed\u201d, no reason). Parent-2 still can pick up. Office/super gets **notification** of banned attempt (CEO). UI and Ask paths for ban set/clear and notify.\n\n## Preconditions / fixtures\n\n- F-PARENT-1 + F-PARENT-2 both linked to S1; vehicles each\n- F-RIDE lines; empty restrictions initially\n- F-OFFICE\n\n## Dual-path beat list\n\n| # | Activity | Support | UI path | Ask path |\n|---|----------|---------|---------|----------|\n| 1 | Sign in office | SUPPORTED | `/sign-in` | \u2014 |\n| 2 | Set pickup restriction Parent-1 \u2194 S1 | SUPPORTED | `/admin/ride` Pickup restriction + Save (`office_set_pickup_restriction`) | **PARTIAL/GAP** \u2014 no Ask restrict tool; `open_screen` to admin ride only |\n| 3 | Confirm restriction saved (duty/office view) | SUPPORTED | admin ride UI | Ask cannot list restrictions \u2192 GAP or UI verify |\n| 4 | Sign out office; sign in Parent-1 | SUPPORTED | auth | \u2014 |\n| 5 | Parent-1 Ride check-in attempt | SUPPORTED | `/parent/ride` check-in | Ask: no check-in tool \u2192 PHYSICAL/UI primary; Ask may only explain |\n| 6 | Observe fail closed opaque message | SUPPORTED | \u201cCheck in failed\u201d no reason/blacklist copy | \u2014 |\n| 7 | Parent-1 leave if stuck waiting state | SUPPORTED | Leave line | \u2014 |\n| 8 | Parent-2 check-in succeeds (allowed) | SUPPORTED | Parent-2 `/parent/ride` | \u2014 |\n| 9 | Parent-2 leave | SUPPORTED | leave | \u2014 |\n| 10 | Office notification of banned attempt | PARTIAL/GAP | Messages/Alerts / notifications / activity / duty wall | Ask: \u201cnotify office banned parent tried Ride\u201d via `send_message` or alert \u2014 if no auto-notify, manual + tag GAP for missing auto fan-out |\n| 11 | FERPA: Parent-2 never sees Parent-1 ban reason or unpublished grades | SUPPORTED | parent Home/messages | Ask parent seat |\n| 12 | Reverse: clear/unban restriction | SUPPORTED | admin ride clear/update restriction | Ask GAP same as set |\n| 13 | Parent-1 re-check-in after unban works | SUPPORTED | `/parent/ride` | \u2014 |\n| 14 | Sign out | SUPPORTED | hamburger | \u2014 |\n\n## Lifecycle / reverse / multiplicity / non-goals\n\n- Lifecycle: ban \u2192 denied attempt \u2192 allowed parent success \u2192 notify \u2192 unban \u2192 re-allow\n- Multiplicity: two parents opposite rights; one child\n- Reverse: unban\n- Non-goals: reason strings to parent; LPR inserts; inventing notify chrome; student Ride tab\n\n## Suggested QE themes\n\nL-restriction fail-closed; co-parent isolation; notify GAP filing; unban restore.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 pickup restrictions; Ride attempts.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Pickup restriction ban on F-PARENT-1 | clear/unban UI | **PARTIAL/GAP** no Ask restrict tool | restriction row gone for parent/student pair |\n| Banned check-in attempts | none required | \u2014 | no sticky fail blocking allowed parent |\n| Notify messages if sent | residual OK | GAP | optional |\n| Allowed parent trip | leave line | GAP | no live trip |\n\n**Order:** leave any live Ride \u2192 **unban before** any parent delete \u2192 sign out. Idempotent clear.\n"}, {"id": "DITL-O-05", "title": "DITL-O-05", "md": "# DITL-O-05 \u2014 Class + teacher assignment lifecycle\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-O-05 |\n| Title | Office/Super: create class, assign teacher, roster, change teacher, delete teacher |\n| Primary hat | administrator **and** superintendent |\n| Support | SUPPORTED create_class / add|remove teacher / enroll; PARTIAL whole-school teacher delete |\n| Regression tags | `office`, `classes`, `teachers`, `roster`, `ask-dual`, `lifecycle` |\n| CEO story | 4 \u2014 Class + teacher assignment lifecycle |\n\n## Goal / story\n\nOffice creates a class, assigns a teacher, assigns student roster, **changes** the teacher, then **deletes** a teacher from the school (CEO). Dual path UI+Ask. Teacher deletion while class has roster must not orphan silently.\n\n## Preconditions / fixtures\n\n- F-TEACHER-A, F-TEACHER-B/C available\n- Students to enroll; F-OFFICE\n\n## Dual-path beat list\n\n| # | Activity | Support | UI path | Ask path |\n|---|----------|---------|---------|----------|\n| 1 | Sign in office | SUPPORTED | `/sign-in` | \u2014 |\n| 2 | Create class | SUPPORTED | Classes tab / admin create | `/ask` `create_class` (officeOnly) |\n| 3 | Assign teacher A | SUPPORTED | `/admin/class/{id}` add teacher | `/ask` `add_teacher_to_class` |\n| 4 | List teachers on class | SUPPORTED | admin class card | `/ask` `list_class_teachers` |\n| 5 | Assign roster students | SUPPORTED | roster UI | `/ask` `enroll_student` / `add_student` |\n| 6 | Change teacher: add B, remove A | SUPPORTED | admin class remove/add | Ask `add_teacher_to_class` + `remove_teacher_from_class` |\n| 7 | Confirm class still has roster after teacher change | SUPPORTED | roster | `list_roster` |\n| 8 | Delete teacher from school (person/login) | PARTIAL/GAP | If no school-wide teacher delete RPC, document; removing from all classes \u2260 delete person | Ask: no `delete_teacher` tool \u2014 GAP |\n| 9 | Multiplicity: second class independent teachers | SUPPORTED | create second class | Ask create_class |\n| 10 | Reverse: re-add teacher A to a class | SUPPORTED | add teacher | Ask add_teacher |\n| 11 | Optional delete empty class | SUPPORTED destructive | delete class ConfirmSheet | Ask `delete_class` with confirm |\n| 12 | Super-only smoke: matrix/identity not required here | \u2014 | \u2014 | \u2014 |\n| 13 | Sign out | SUPPORTED | hamburger | \u2014 |\n\n## Lifecycle / reverse / multiplicity / non-goals\n\n- Lifecycle: create \u2192 staff \u2192 roster \u2192 restaff \u2192 delete-teacher attempt \u2192 sign-out\n- Reverse: re-add teacher; class delete only when intentional\n- Multiplicity: two classes; roster present during teacher swap\n- Non-goals: teacher self-create class; office teaching desk; multi-school\n\n## Suggested QE themes\n\nOffice-only create_class; teacher swap with live roster; honest GAP on school teacher delete.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 classes, teacher assigns, roster.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Class created `ditl-*` | delete class (cascades class work) | delete_class tool else UI | `classes` no ditl class; class enrollments/assignments gone |\n| Teacher assigned/reassigned | remove_teacher_from_class | tools if listed | class_teachers baseline |\n| Whole-school teacher delete attempt | PARTIAL \u2014 re-seed F-TEACHER-C if deleted | may GAP | teachers/profiles seed restored |\n| Enrollments on test class | deleted with class | \u2014 | clean |\n\n**Order:** remove roster \u2192 remove teachers from class \u2192 delete class \u2192 re-seed any deleted shared teacher \u2192 sign out.\n**Do not:** delete F-TEACHER-A home class unless run created a disposable copy.\n"}, {"id": "DITL-O-06", "title": "DITL-O-06", "md": "# DITL-O-06 \u2014 Alerts + school feed\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-O-06 |\n| Title | Office/Super: send alert notification + school feed message |\n| Primary hat | administrator **and** superintendent |\n| Support | SUPPORTED UI create_feed_post kind alert|post; Ask create PARTIAL/GAP |\n| Regression tags | `office`, `alerts`, `feeds`, `messages`, `ask-dual`, `ferpa` |\n| CEO story | 5 \u2014 Alerts + school feed |\n\n## Goal / story\n\nOffice sends an **alert** notification and a **school feed** post. Recipients see alert vs ordinary post per messaging-v1. Dual path: UI composer required; Ask create tagged GAP if no tool.\n\n## Preconditions / fixtures\n\n- F-FEED, F-OFFICE, families/teachers who can see school audience\n- Prefer one class feed contrast optional\n\n## Dual-path beat list\n\n| # | Activity | Support | UI path | Ask path |\n|---|----------|---------|---------|----------|\n| 1 | Sign in office | SUPPORTED | `/sign-in` | \u2014 |\n| 2 | Open Feed tab | SUPPORTED | `/?tab=feed` or `/feed` | Ask `open_screen` / `list_feed` |\n| 3 | Compose **alert** (kind=alert) | SUPPORTED | FeedPane kind Alert + publish `create_feed_post` | **PARTIAL/GAP** no create_feed tool; may draft text only |\n| 4 | Verify alert surfaces in Messages/Alerts / notifications | SUPPORTED | header mail Alerts tab / `/notifications` | Ask `my_unread_messages` / list threads \u2014 may not equal alert fan-out |\n| 5 | Compose school **feed post** (kind=post) | SUPPORTED | Feed composer post | Ask create GAP; `list_feed` readback after UI post |\n| 6 | Optional reply under post (not alert) | SUPPORTED | feed reply composer | Ask GAP |\n| 7 | Reverse: discard unsent composer | SUPPORTED | back without send | Ask abandon turn |\n| 8 | Multiplicity: second alert does not mash threads | SUPPORTED | feed | list_feed |\n| 9 | FERPA: no student grade PII in blast | SUPPORTED | body review | Ask must refuse grade blast |\n| 10 | Sign out | SUPPORTED | hamburger | \u2014 |\n\n## Lifecycle / reverse / multiplicity / non-goals\n\n- Lifecycle: alert \u2192 post \u2192 verify \u2192 sign-out\n- Reverse: discard draft; no requirement to unsend if product has none\n- Non-goals: SMS/email digest; class-sized chat; inventing Ask post tool\n\n## Suggested QE themes\n\nAlert\u2260post; office author; Ask GAP filed; no grade leak in body.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 feed posts / alerts.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| School feed / alert posts `ditl-` | delete/archive if UI | create **GAP**; delete **GAP** | feed/alert rows with ditl body gone |\n\n**Order:** delete test posts \u2192 sign out. Idempotent.\n"}, {"id": "DITL-O-07", "title": "DITL-O-07", "md": "# DITL-O-07 \u2014 Office bio attach for existing student (card fields)\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-O-07 |\n| Title | Office/Super: attach contact/bio fields to existing student (card data); no invent roster |\n| Primary hat | administrator **and** superintendent (run both) |\n| Support | SUPPORTED Details + `update_student`; photo extract **PARTIAL/GAP** (no office Capture tray) |\n| Regression tags | `office`, `bio`, `student-card`, `people`, `ask-dual`, `ferpa`, `teardown` |\n| CEO story | Associate student data-card fields to existing DB record (office hat) |\n\n## Goal / story\n\nOffice attaches the **same contact/bio field set** as the handwritten student data card onto an **already-existing** student (F-STUDENTS S1). Photo OCR/extract lives on teacher Capture (`DITL-T-05`). Office path: open existing person \u2192 edit canonical metadata (UI + Ask) \u2192 DB assert \u2192 revert. Do not invent Document AI for office chrome.\n\n## Preconditions / fixtures\n\n- F-OFFICE both hats; existing S1 with known baseline `students.metadata`\n- Card field values from `F-ART-CARD-STUDENT-HW` transcribed for QE (same expected DB values as T-05)\n- Prefer run **after or independent of** T-05 with fresh baseline snapshot\n\n## Dual-path beat list\n\n| # | Activity | Support | UI path | Ask path |\n|---|----------|---------|---------|----------|\n| 1 | Sign in office/super | SUPPORTED | `/sign-in` office tray | \u2014 |\n| 2 | Open existing student (search/directory) | SUPPORTED | People / student person | `search_students` / `list_people` |\n| 3 | Edit bio fields from card values | SUPPORTED | Details / profile | `update_student` |\n| 4 | **DB assert** each canonical key | SUPPORTED | read-back Details | Ask get student if available |\n| 5 | Photo-from-card extract on office seat | **PARTIAL/GAP** | no Capture tray on office | no office scan-card tool \u2014 do not invent |\n| 6 | Reverse: revert metadata to baseline | SUPPORTED | Details | `update_student` |\n| 7 | FERPA: no IEP/504 columns | SUPPORTED | Details keys only | same |\n| 8 | Sign out | SUPPORTED | hamburger | \u2014 |\n\n## Lifecycle / reverse / multiplicity / dual-hat / non-goals\n\n- Lifecycle: find existing student \u2192 write fields \u2192 assert \u2192 revert \u2192 sign-out\n- Multiplicity: twins \u2014 pick correct S1 only\n- Dual-hat: not required (DH-02 separate)\n- Non-goals: invent student; office camera student_card pipeline; IEP/504; teacher Capture (T-05)\n\n## Artifacts + DB assert\n\nSame targets as T-05: `preferred_name`, `birthday`, `phone`, `email`, `address`, `emergency_*`, optional `grade_or_age`, unrecognized \u2192 `notes`. Assert exact values; parent must not see teacher-only keys.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 metadata only on existing student.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| `students.metadata` / aliases | revert baseline | `update_student` | baseline match; student row remains |\n\n**Order:** revert \u2192 sign out. Never delete S1.\n**Isolation:** fixture person only.\n\n## Suggested QE themes\n\nOffice vs super parity on update_student; GAP honest on office photo extract; teardown baseline; pairs with T-05.\n"}, {"id": "DITL-P-01", "title": "DITL-P-01", "md": "# DITL-P-01 \u2014 Parent AM grades + car line\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-P-01 |\n| Title | Parent morning: grades per child + Ride check-in |\n| Primary hat | parent |\n| Other hats | none (pure parent seat) |\n| Support | SUPPORTED grades thin Home + PARTIAL Ride check-in |\n| Regression tags | `auth`, `grades`, `avg`, `ride`, `multiplicity`, `chrome-parent`, `ask-dual` |\n\n## Goal / story\n\nBefore school, a parent with two children opens Kelyra, checks each child\u2019s published progress on Parent Home, then uses Ride to check into the car rider line for drop-off with the correct vehicle and children. Day ends (for this plan) after successful check-in status is visible and parent can leave the line or complete the drop-off wait without staff release powers.\n\n## Preconditions / fixtures\n\n- Parent login linked to **two** students (twins or siblings) via `parent_students`.\n- Each child enrolled in at least one class with **published** family-visible grades/syllabus where AVG applies; one child with focus skill.\n- At least one vehicle on parent record (valid plate / today-or-indefinite window).\n- Ride lines configured for school day; parent seat chrome available.\n- No staff duty session on this device.\n\n## Beat list (ordered)\n\n| # | Beat | Surface / chrome |\n|---|------|------------------|\n| 1 | Sign in as parent | `/sign-in` \u2192 lands parent seat |\n| 2 | Confirm tray **Home \u00b7 Ride \u00b7 Ask** (3 tabs; no camera; no staff tabs) | Parent tray |\n| 3 | Open **Home**; see child chips / list for both children | `/parent` |\n| 4 | Select child A; review thin grades / class cards / focus (P-H2 style) | `/parent` (+ `/parent/grades` if present) |\n| 5 | Switch to child B; confirm A state clears (sibling isolation) | `/parent` |\n| 6 | Open upcoming/assigned work cues if shown on Home | `/parent` |\n| 7 | Tray **Ride** \u2192 Ride hub | `/parent/ride` |\n| 8 | Select vehicle (if multi-car fixture present; else single car) | `/parent/ride` or `/parent/vehicles` |\n| 9 | Select trip children for this drop-off (not auto-mix twins) | `/parent/ride` |\n| 10 | Check in (photo of car ahead **or** I\u2019m first) for chosen line | `/parent/ride` |\n| 11 | See own position XX only (no \u201cof N\u201d, no neighbor plates) | `/parent/ride` |\n| 12 | **Reverse:** Leave this line while waiting \u2192 event `left` (parent cannot mint `released`) | `/parent/ride` |\n| 13 | Optional re-check-in same line or stop | `/parent/ride` |\n| 14 | Sign out | Hamburger \u2192 Sign out |\n\n## Lifecycle\n\nStart: sign-in \u2192 parent seat. Finish: leave line (or documented end wait) + sign-out.\n\n## Multiplicity\n\nTwo children; sibling switch must not blend grades. Vehicle pick if multi-car (else note single-car). One device.\n\n## Reverse / cancel / already-in-flow\n\nLeave line while waiting (L-08). Fail closed on restricted child (no reason string). Already checked-in: no double-mint chaos \u2014 observe product behavior; do not invent.\n\n## Dual-hat\n\nNone. Do not use My children deep-link from staff seat in this plan (see DH-*).\n\n## Functions exercised\n\nAuth parent; parent tray chrome; family grade Home; sibling isolation; Ride check-in/leave; vehicle+child pick; FERPA thin parent view.\n\n## Explicit non-goals\n\nFull parent grades book (P-G* if still open defect \u2014 call PARTIAL, do not fail plan for missing book if research/AVG notes gap). Full line management / staff curb release. Attendance. SMS. GPS/placard-only check-in. Neighbor queue visibility.\n\n## Dual path (UI + Ask) \u2014 refine 2026-09-10\n\n| Activity | UI | Ask |\n|----------|----|-----|\n| Sign-in / tray confirm | `/sign-in` \u2192 Home\u00b7Ride\u00b7Ask | \u2014 |\n| Review child grades / focus | `/parent` (+ `/parent/grades`) | `/ask` `my_children_progress`; `explain_my_class_average` / `get_published_class_syllabus` if offered |\n| Sibling switch isolation | child chips on Home | Ask ground must follow selected child; no mash |\n| Vehicle pick | `/parent/ride` or `/parent/vehicles` | **PARTIAL/GAP** \u2014 no vehicle CRUD Ask tool |\n| Ride check-in (photo / I\u2019m first) | `/parent/ride` | **PHYSICAL-ONLY** shutter; Ask may not mint check-in |\n| Leave line | Leave control \u2192 `left` | **PARTIAL/GAP** no leave tool |\n| Restricted fail-closed | UI message opaque | Ask must not leak restriction reason |\n| Sign out | hamburger | \u2014 |\n\nAsk must not publish/mutate grades. Physical camera beats stay UI-primary.\n\n## Suggested QE case themes (not cases)\n\nSibling clear; check-in success XX; leave\u2192left; restricted fail; tray = 3 only after parent login; Ask dual-path grades read without grade write.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 Ride check-in / leave events (fixtures pre-exist).\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check (data-model only) |\n|--------------------|------------|-------------|--------------------------------------|\n| Ride trip / queue events for this parent run | Leave line if still waiting; end session | **PARTIAL/GAP** \u2014 no leave/check-in Ask tool | Live ride session for fixture parent only; no parent-minted `released` |\n| Car-ahead photo asset if stored | Product discard if any | PHYSICAL-ONLY | Orphan `assets` only if this run wrote them |\n| Session | Sign out | \u2014 | No leftover auth session on device |\n\n**Isolation:** this parent\u2019s trip only (`ditl-` in QE log). Do not wipe school Ride lines or other vehicles.\n**Order:** leave line \u2192 sign out. Idempotent if already left.\n**Do not:** delete shared F-PARENT vehicles/students unless this run created them.\n"}, {"id": "DITL-P-02", "title": "DITL-P-02", "md": "# DITL-P-02 \u2014 Parent PM homework Ask + message\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-P-02 |\n| Title | Parent evening: review work, Ask help strategy, message teacher |\n| Primary hat | parent |\n| Other hats | none |\n| Support | SUPPORTED Ask + messaging; SUPPORTED/PARTIAL assignment visibility on parent |\n| Regression tags | `auth`, `ask`, `messages`, `grades`, `assignments`, `chrome-parent`, `ask-dual` |\n\n## Goal / story\n\nAfter school, a parent helps with homework: opens Parent Home for the child who has work due, reviews what is assigned/focus, uses Ask (parent context) to get a help strategy (not a grade), messages the teacher about one concern, then signs out. No Ride required in this plan.\n\n## Preconditions / fixtures\n\n- Parent with \u22651 linked child; child has at least one assigned practice or visible upcoming work and a teacher-approved focus skill when available.\n- Messaging v1 enabled; parent can open a 1:1 thread with the child\u2019s teacher (directory RLS as shipped).\n- Ask available on parent tray.\n- Prefer evening fixture: assignment not yet submitted or recently graded.\n\n## Beat list\n\n| # | Beat | Surface |\n|---|------|---------|\n| 1 | Sign in parent | `/sign-in` |\n| 2 | Home \u2192 select child with homework | `/parent` |\n| 3 | Review progress / assignments cues / focus one-liner | `/parent` |\n| 4 | If grades drill-down exists, open it; else stay Home (PARTIAL note) | `/parent` or `/parent/grades` |\n| 5 | Tray **Ask** \u2014 ask how to help child on named skill/assignment ground | `/ask` |\n| 6 | Confirm Ask does not publish grades; new chat / history behaves | `/ask` |\n| 7 | Header **Messages** \u2192 open or start teacher thread | `/messages`, `/messages/{id}` |\n| 8 | Send one message; optional attach if UI offers (photo of worksheet) | thread composer |\n| 9 | **Reverse:** discard unsent composer draft / back without send | `/messages/{id}` |\n| 10 | Return Home; switch child if multi; confirm no cross-child message bleed | `/parent` |\n| 11 | Sign out | hamburger |\n\n## Lifecycle\n\nLogin \u2192 help loop \u2192 sign-out. No Ride enter/leave.\n\n## Multiplicity\n\nIf two children, switch chips between Ask/message contexts; threads stay person-scoped.\n\n## Reverse / cancel\n\nAbandon Ask turn; discard message draft; back from thread list.\n\n## Dual-hat\n\nNone.\n\n## Functions exercised\n\nParent Home; Ask parent; Messages 1:1; assignment/focus read; auth.\n\n## Explicit non-goals\n\nRide. Teacher Approve. Student submit. Tutor chat product. Weekly email digest. Parent editing teacher academic fields.\n\n## Dual path (UI + Ask) \u2014 refine 2026-09-10\n\n| Activity | UI | Ask |\n|----------|----|-----|\n| Home child + homework cues | `/parent` | `my_children_progress` |\n| Grades drill-down | `/parent` or `/parent/grades` | `explain_my_class_average` / published syllabus read |\n| Help strategy on skill/assignment | tray **Ask** (already primary) | same `/ask` \u2014 dual means still verify header Messages path separately |\n| Message teacher | `/messages` composer | `list_threads` + `send_message` |\n| Discard draft | UI back | abandon Ask turn / new chat |\n| Sibling isolation | chips | Ask child ground walls |\n\nThis plan already centers Ask; refine requires **explicit UI message path** and **Ask message tools** both pass.\n\n## Suggested QE themes\n\nAsk ground with assignment; message send UI+tool; sibling isolation; no grade mutation via Ask.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 messages; Ask thread history.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Parent\u2192teacher message(s) | Tag body `ditl-`; delete if UI exists | `send_message` only; delete **GAP** | message/thread rows with `ditl-` for this parent |\n| Ask chat turns | **New chat** archives open thread | same | `ask_threads` / `ask_messages` \u2014 archive OK |\n\n**Isolation:** `ditl-` message prefix. Do not delete real family threads outside run.\n**Order:** finish sends \u2192 New chat \u2192 sign out. Idempotent.\n"}, {"id": "DITL-P-03", "title": "DITL-P-03", "md": "# DITL-P-03 \u2014 Parent Ride multi-child multi-car\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-P-03 |\n| Title | Parent Ride: twins, two cars, staggered lines, leave + re-enter |\n| Primary hat | parent |\n| Other hats | none |\n| Support | PARTIAL Ride (check-in/leave SUPPORTED; full line mgmt NOT) |\n| Regression tags | `ride`, `multiplicity`, `vehicles`, `auth`, `chrome-parent`, `ask-dual` |\n\n## Goal / story\n\nA parent with twins and two authorized vehicles runs a realistic pickup: check into line A with child 1 + car 1, leave line A, then check into line B with child 2 + car 2 (staggered). Verifies twins never auto-mix and parent cannot mint curb `released`.\n\n## Preconditions / fixtures\n\n- Parent \u2194 two children (twins preferred).\n- Two vehicles on parent (e.g. primary + nanny/grandma car); one may be today-only window.\n- Two independent Ride lines (A/B) for the school day.\n- Restrictions fixture optional: one child restricted \u2192 fail closed.\n- Parent seat only (not staff duty wall).\n\n## Beat list\n\n| # | Beat | Surface |\n|---|------|---------|\n| 1 | Sign in parent | `/sign-in` |\n| 2 | Ride hub | `/parent/ride` |\n| 3 | Manage vehicles: confirm both cars listed; open vehicles surface | `/parent/vehicles` |\n| 4 | **Reverse vehicle:** void/remove or note today-only expiry path if UI allows | `/parent/vehicles` |\n| 5 | Restore/ensure two valid cars for rest of plan | `/parent/vehicles` |\n| 6 | Line A: pick car 1 + child 1 only (not both twins) | `/parent/ride` |\n| 7 | Check in line A (photo ahead or I\u2019m first) | `/parent/ride` |\n| 8 | Observe own XX; no total queue | `/parent/ride` |\n| 9 | Leave line A \u2192 `left` (not `released`) | `/parent/ride` |\n| 10 | Line B: pick car 2 + child 2 | `/parent/ride` |\n| 11 | Check in line B | `/parent/ride` |\n| 12 | Optional: restricted-child attempt \u2192 \u201cCheck in failed\u201d no reason | `/parent/ride` |\n| 13 | Leave line B or end wait | `/parent/ride` |\n| 14 | Confirm staff `released` not available on parent chrome | `/parent/ride` |\n| 15 | Sign out | hamburger |\n\n## Lifecycle\n\nEnter line A \u2192 leave A \u2192 enter B \u2192 leave/end B \u2192 sign-out.\n\n## Multiplicity\n\nTwo children, two cars, two lines; no auto-mix twins (L-08a).\n\n## Reverse / cancel\n\nLeave while waiting; vehicle void; abandon check-in before commit if UI has cancel.\n\n## Dual-hat\n\nNone. Leave control only on parent-seat Ride (L-08b).\n\n## Functions exercised\n\nRide check-in/leave; vehicles CRUD windows; multi line independence; child trip selection.\n\n## Explicit non-goals\n\nStaff duty wall / order_fix / curb release. LPR inserting people. GPS. Placard-only. Office Ride tray tab. Anon token parent.\n\n## Dual path (UI + Ask) \u2014 refine 2026-09-10\n\n| Activity | UI | Ask |\n|----------|----|-----|\n| Vehicles list/CRUD windows | `/parent/vehicles` | **PARTIAL/GAP** no vehicle tools |\n| Line A/B check-in + child/car pick | `/parent/ride` | **PHYSICAL-ONLY** check-in; Ask cannot pick car/line |\n| Leave A/B | Leave \u2192 `left` | **PARTIAL/GAP** |\n| Restricted child attempt | fail closed UI | Ask must not explain ban reason |\n| Confirm no parent `released` | chrome absence | Ask must refuse mint released |\n\nPhysical Ride stays UI-primary; Ask dual documents GAP honestly.\n\n## Suggested QE themes\n\nL-08/L-08a/L-08b; V multi-car; twin isolation; two-line independence; Ask GAP tags not false greens.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 multi-line Ride events.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Line A/B trips + leave | Leave any waiting line | GAP leave tool | No live waiting trip for fixture parent |\n| Vehicle selection | none (fixtures stay) | GAP vehicle CRUD | Do not delete F-PARENT vehicles |\n\n**Order:** leave any live line \u2192 sign out. Idempotent.\n**Isolation:** this parent only; do not clear school lines.\n"}, {"id": "DITL-S-01", "title": "DITL-S-01", "md": "# DITL-S-01 \u2014 Student assignments submit\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-S-01 |\n| Title | Student: see to-do, open practice/lesson, submit, multi-class |\n| Primary hat | student |\n| Other hats | none (students cannot wear staff/parent hats) |\n| Support | SUPPORTED M8 student to-do / submit |\n| Regression tags | `auth`, `todo`, `submit`, `assignments`, `chrome-student`, `lessons`, `ask-dual` |\n\n## Goal / story\n\nA student signs in, uses the 6-tab student tray, opens Assignments, completes an assigned practice (and optional lesson pack), submits, checks Done, and if enrolled in two classes confirms work does not mash.\n\n## Preconditions / fixtures\n\n- Student login enrolled in \u22651 class (prefer 2).\n- \u22651 assigned practice set awaiting submit; optional lesson assignment.\n- No teacher chrome on this login.\n\n## Beat list\n\n| # | Beat | Surface |\n|---|------|---------|\n| 1 | Sign in student | `/sign-in` |\n| 2 | Confirm tray 6: Assignments \u00b7 Feeds \u00b7 Classes \u00b7 Grades \u00b7 People \u00b7 Ask | student tray |\n| 3 | Assignments Home To Do | `/todo` |\n| 4 | Open assigned set; answer items | `/todo` or assignment route |\n| 5 | Submit; confirm leaves To Do \u2192 Done path | `/todo` Done tab |\n| 6 | **Reverse:** abandon in-progress without submit if allowed | assignment |\n| 7 | Classes tab: open class landing / assignments | `/student/class` |\n| 8 | Optional lesson Open \u2192 metrics as evidence not grade until teacher Approve | lesson routes |\n| 9 | Feeds glance (class + school feed) | `/student/feed` |\n| 10 | People directory read-only | `/student/people` |\n| 11 | Second class: switch context; no cross-class submission | `/student/class` |\n| 12 | Sign out (ends session; does not unenroll) | hamburger |\n\n## Lifecycle\n\nSign-in \u2192 work \u2192 submit \u2192 sign-out.\n\n## Multiplicity\n\nMultiple assignments; two classes isolation.\n\n## Reverse / cancel\n\nLeave assignment mid-way; do not submit blank if product blocks.\n\n## Dual-hat\n\nN/A for student role.\n\n## Functions exercised\n\nStudent auth; tray; to-do/submit; class landing; feeds; people read.\n\n## Explicit non-goals\n\nCapture camera; grade Approve; Ride tab; parent seat; editing roster.\n\n## Dual path (UI + Ask) \u2014 refine 2026-09-10\n\n| Activity | UI | Ask |\n|----------|----|-----|\n| To Do list | `/todo` | `list_my_practice` |\n| Open/submit practice | assignment UI submit | Ask `open_screen` to practice; **UI-primary submit**; Ask refuses graded solve |\n| Classes landing | `/student/class` | `open_screen` / list classes if allowed |\n| Feeds glance | `/student/feed` | `list_feed` |\n| People read-only | `/student/people` | `list_people` read walls |\n| Multi-class isolation | class switch | Ask ground per class |\n\n## Suggested QE themes\n\nOwn work only; Done state; multi-class; sign-out \u2260 leave class; Ask not solver.\n\n## Artifacts + DB assert (refine-2)\n\nConsumer of teacher-authored work: open assignments created under T-04 / F-ASSIGN (diverse subjects). After submit: `submissions.status` progressed/completed for **own** student_id only; no cross-class mash. Does not re-ingest photos.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 submission status on assigned work.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| `submissions` progress/completed | Teacher/seed reset or delete test submission if RPC exists | Student Ask must not wipe gradebook | `submissions.status` for S1 on ditl assignments \u2192 `assigned` or row removed |\n| In-progress abandon | leave without submit | \u2014 | no half-grade |\n\n**Isolation:** only this student submission; do not delete teacher assignment column unless run created it.\n**Order:** reset submission \u2192 sign out.\n"}, {"id": "DITL-S-02", "title": "DITL-S-02", "md": "# DITL-S-02 \u2014 Student grades Diary Ask\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-S-02 |\n| Title | Student: grades book, how-averages, Diary/ledger, Ask tutor-brief |\n| Primary hat | student |\n| Other hats | none |\n| Support | SUPPORTED grades + Ask; SUPPORTED Diary journal/ledger |\n| Regression tags | `grades`, `avg`, `diary`, `ask`, `chrome-student`, `auth`, `ask-dual` |\n\n## Goal / story\n\nStudent reviews own grades (All + per-class), understands how grades/why average when published, writes a diary entry with optional photo, opens ledger deep-link if present, uses Ask for help on a focus skill, signs out.\n\n## Preconditions / fixtures\n\n- Student with graded cells and/or published syllabus family/student visibility.\n- Diary feature available to student (`/diary`).\n- Focus skill or assignment ground for Ask.\n\n## Beat list\n\n| # | Beat | Surface |\n|---|------|---------|\n| 1 | Sign in student | `/sign-in` |\n| 2 | Grades \u2192 All classes grid (own column only) | `/student/grades` |\n| 3 | Filter one class; open how-grades / why average if offered | `/student/grades` |\n| 4 | Assignment row detail if shipped (S-G4); else note PARTIAL | grades |\n| 5 | Hamburger or entry \u2192 Diary / Journal | `/diary` |\n| 6 | Create entry; optional camera attach; filters/sort if present | `/diary` |\n| 7 | Ledger view / deep-link from entry if present | `/diary` ledger UI |\n| 8 | **Reverse:** delete or cancel draft entry | `/diary` |\n| 9 | Ask with assignment/skill ground | `/ask` |\n| 10 | New chat archives prior thread behavior | `/ask` |\n| 11 | Confirm no classmate scores visible | grades/people |\n| 12 | Sign out | hamburger |\n\n## Lifecycle\n\nSign-in \u2192 review/write/ask \u2192 sign-out. Diary entry create\u2192optional delete.\n\n## Multiplicity\n\nMultiple class grade chips; multiple diary entries; Ask history threads.\n\n## Reverse / cancel\n\nCancel diary draft; clear Ask thread (new chat); back from grade detail.\n\n## Dual-hat\n\nN/A.\n\n## Functions exercised\n\nStudent grades; AVG explainers; Diary; Ask; FERPA own-only.\n\n## Explicit non-goals\n\nTeacher gradebook edit; parent Ride; publishing own grades; tutor infinite chat product.\n\n## Dual path (UI + Ask) \u2014 refine 2026-09-10\n\n| Activity | UI | Ask |\n|----------|----|-----|\n| Grades All / class filter | `/student/grades` | explain average / published syllabus read tools |\n| Diary create + photo | `/diary` | **Note:** `draft_diary_entry` policy student=`none` \u2192 diary Ask **PARTIAL/GAP**; UI diary remains P |\n| Ledger deep-link | diary ledger UI | GAP if no tool |\n| Ask tutor-brief on focus | tray Ask | primary Ask path; refuse graded finals |\n| New chat archive thread | Ask UI | same |\n\n## Suggested QE themes\n\nNo classmates in grades; diary photo UI; student diary Ask GAP honest; Ask not a grade.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 diary entries; Ask thread.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Diary journal entry + optional photo | delete entry / discard draft `/diary` | draft then Save \u2014 delete via UI; student diary Ask may be GAP | diary rows for student run; photo unref |\n| Ask turns | New chat | same | ask_messages archived OK |\n| Grades views | read-only | read tools | no grade writes |\n\n**Order:** delete diary test entries \u2192 New chat \u2192 sign out.\n"}, {"id": "DITL-S-03", "title": "DITL-S-03", "md": "# DITL-S-03 \u2014 Student messages + focus\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-S-03 |\n| Title | Student: send/reply messages; complete focus exercise |\n| Primary hat | student |\n| Support | SUPPORTED messages.use student; focus via assigned practice / to-do |\n| Regression tags | `student`, `messages`, `focus`, `todo`, `ask-dual`, `chrome-student`, `auth` |\n| CEO story | 7 \u2014 Student messages + focus |\n\n## Goal / story\n\nStudent sends and replies to messages, and completes a focus exercise (shipped as focus-linked practice / assigned set \u2014 not a separate invented module). Dual path UI + Ask.\n\n## Preconditions / fixtures\n\n- F-STUDENT-LOGIN S1; messaging thread with teacher or allowed peer per v1 rules\n- F-FOCUS: assigned practice tied to current_focus_skill or labeled focus work\n- Second class optional\n\n## Dual-path beat list\n\n| # | Activity | Support | UI path | Ask path |\n|---|----------|---------|---------|----------|\n| 1 | Sign in student | SUPPORTED | `/sign-in` tray 6 | \u2014 |\n| 2 | Open Messages | SUPPORTED | header mail / `/messages` | `/ask` `list_threads` / `my_unread_messages` |\n| 3 | Send new message (allowed counterparty) | SUPPORTED | thread composer | `/ask` `send_message` |\n| 4 | Reply on existing thread | SUPPORTED | `/messages/{id}` | Ask `list_thread_messages` + `send_message` |\n| 5 | Reverse: discard unsent draft | SUPPORTED | back without send | abandon Ask turn |\n| 6 | Open focus work / practice | SUPPORTED | `/todo` or assignment; focus cue on grades/Home if shown | `/ask` `list_my_practice`; `open_screen` to assigned practice only |\n| 7 | Complete + submit focus exercise | SUPPORTED | practice items \u2192 submit | Ask cannot fill answers as solver \u2014 **UI-primary submit**; Ask may hint only if practice-help path, never graded final answers |\n| 8 | Confirm Done / completion state | SUPPORTED | To Do Done | Ask `list_my_practice` status |\n| 9 | FERPA: no classmate scores via messages/Ask | SUPPORTED | \u2014 | student Ask refuse walls |\n| 10 | Multiplicity: second thread; second assignment isolation | SUPPORTED | UI | Ask |\n| 11 | Sign out (does not unenroll) | SUPPORTED | hamburger | \u2014 |\n\n## Lifecycle / reverse / multiplicity / non-goals\n\n- Lifecycle: message send/reply \u2192 focus complete \u2192 sign-out\n- Reverse: discard drafts; abandon practice mid-way\n- Dual-hat: N/A\n- Non-goals: student Ride; student create class; Ask solving graded quiz; diary required (see S-02)\n\n## Suggested QE themes\n\nsend_message RLS; focus submit Done; Ask not a homework solver; dual-path message parity.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 messages; focus practice submit.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Student messages `ditl-` | residual if no delete | send | threads marked |\n| Focus practice submission | reset like S-01 | UI-primary | submissions baseline |\n\n**Order:** reset submission \u2192 sign out.\n"}, {"id": "DITL-T-01", "title": "DITL-T-01", "md": "# DITL-T-01 \u2014 Teacher Capture morning\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-T-01 |\n| Title | Teacher morning: roster-ready class, phone capture, unassigned, drafts |\n| Primary hat | teacher |\n| Other hats | none |\n| Support | SUPPORTED M1\u2013M4 capture/match/inbox |\n| Regression tags | `auth`, `capture`, `matcher`, `inbox`, `chrome-teacher`, `mobile`, `ask-dual` |\n\n## Goal / story\n\nBefore/during morning blocks, the teacher uses phone chrome: confirms active class, captures exit-ticket photos with spoken names, handles a no-match Unassigned, skims Needs for drafts, and does **not** Approve grades on phone (web is T-02). Signs out or leaves session cleanly.\n\n## Preconditions / fixtures\n\n- Teacher login; \u22651 class with roster (\u22653 students including similar names if possible).\n- `active_class_id` set; second class optional for multiplicity.\n- Camera/mic permissions; network on.\n- Empty or seeded Unassigned for contrast.\n\n## Beat list\n\n| # | Beat | Surface |\n|---|------|---------|\n| 1 | Sign in teacher | `/sign-in` |\n| 2 | Confirm tray **Desk \u00b7 Capture \u00b7 Needs \u00b7 Class \u00b7 Ask** (5; no Ride) | Teacher tray |\n| 3 | Desk / class home: active class visible | `/` or `/class/{id}` |\n| 4 | If needed: Class setup glance roster | `/class/{id}/setup` |\n| 5 | Tray **Capture** | `/capture` |\n| 6 | Photo + speak name \u2192 high-confidence file to student | `/capture` |\n| 7 | Photo + ambiguous/no name \u2192 Unassigned | `/capture` |\n| 8 | Voice-only observation note on named student | `/capture` |\n| 9 | **Reverse:** discard/cancel a capture before save if UI allows | `/capture` |\n| 10 | Needs/Inbox: see Unassigned + draft-ready items (Approve not required here) | `/inbox` |\n| 11 | Assign Unassigned item to correct student (one tap file) | `/inbox` |\n| 12 | Optional class switch: capture goes to active class only | class switcher / Desk |\n| 13 | Sign out | hamburger |\n\n## Lifecycle\n\nSign-in \u2192 capture loop \u2192 inbox triage \u2192 sign-out. No Approve/grade finish (T-02).\n\n## Multiplicity\n\nMultiple captures; optional two classes \u2014 active class isolation. Matcher never inserts student.\n\n## Reverse / cancel\n\nCancel capture; reassign from Unassigned; change suggested name chip when shown.\n\n## Dual-hat\n\nNone (see DH-01).\n\n## Functions exercised\n\nCapture photo/voice; matcher; Unassigned inbox; active class; teacher chrome.\n\n## Explicit non-goals\n\nApprove gaps; generate practice; parent messaging; Ride duty; face match/OCR names; multi-student page split.\n\n## Dual path (UI + Ask) \u2014 refine 2026-09-10\n\n| Activity | UI | Ask |\n|----------|----|-----|\n| Tray / active class | Desk \u00b7 Capture \u00b7 Needs \u00b7 Class \u00b7 Ask | `get_app_state` / `list_classes` |\n| Photo+voice capture | `/capture` | **PHYSICAL-ONLY** camera/mic |\n| Unassigned + file to student | `/inbox` | `list_inbox`; assign may be UI-primary if no file tool |\n| Voice observation note | `/capture` | PHYSICAL-ONLY |\n| Cancel capture | UI discard | \u2014 |\n| Class isolation | class switcher | Ask class ground; switch clears assignment ground |\n| Desk summarize | Desk | `summarize_class_desk` |\n\n## Suggested QE themes\n\nMatch confidence; Unassigned never invents roster; active class boundary; physical capture not faked via Ask.\n\n## Artifacts + DB assert (refine-2)\n\n| Beat | Fixture artifact | Format / subject | DB fields to assert after ingest |\n|------|------------------|------------------|----------------------------------|\n| 6 matched capture | `F-ART-HW-MATH-HW` | handwritten photo; math homework | `captures.student_id` = spoken-name match (not OCR-required); `photo_asset_id` set; status draft/inbox per product |\n| 7 Unassigned | `F-ART-HW-ENG-TYPED` | typed/print photo; English | `captures.student_id` null; Unassigned inbox row |\n| 8 voice note | no page | voice-only | capture note path; no invented student |\n\n**Matcher law:** spoken name + photo for student match (mvp). Written name on page is optional realism \u2014 **do not fail** if OCR name is unused.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 captures, assets, inbox filings.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Homework captures + photo/audio `assets` | Needs discard or teacher delete capture | `delete_gap` if gap; capture delete **PARTIAL** if no tool \u2014 use UI | `captures` for this run gone; no leftover Unassigned from run |\n| Filed Unassigned \u2192 student | delete capture if test-only | same | capture row gone |\n| Voice observation note | delete capture | PARTIAL | no orphan note capture |\n\n**Isolation:** delete only captures/assets created this run. Never delete roster students.\n**Order:** discard drafts \u2192 delete captures (gaps cascade) \u2192 unref assets \u2192 sign out. Idempotent.\n"}, {"id": "DITL-T-02", "title": "DITL-T-02", "md": "# DITL-T-02 \u2014 Teacher Grade and Assign (web)\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-T-02 |\n| Title | Teacher afternoon web: Approve gaps, assign practice, grade book, syllabus |\n| Primary hat | teacher |\n| Other hats | none |\n| Support | SUPPORTED M6\u2013M9; AVG syllabus teacher path |\n| Regression tags | `approve`, `assign`, `gradebook`, `avg`, `syllabus`, `chrome-teacher`, `web`, `ask-dual` |\n\n## Goal / story\n\nAfter class, on web/tablet width, teacher clears Needs drafts: opens student work, Approves named gaps (nothing is a grade before Approve), generates/assigns short practice, scores a submission, checks grade book and published syllabus weights. Ends with sign-out.\n\n## Preconditions / fixtures\n\n- Teacher; class with drafts waiting Approve; \u22651 student with capture analyzed.\n- \u22651 student submission ready to score optional.\n- Syllabus: draft or published fixture (weights sum rules).\n- Prefer width \u2265720 for top tab chrome.\n\n## Beat list\n\n| # | Beat | Surface |\n|---|------|---------|\n| 1 | Sign in teacher (web) | `/sign-in` |\n| 2 | Desk shows draft/Unassigned counts | `/` or class desk |\n| 3 | Needs \u2192 open draft item | `/inbox` |\n| 4 | Student record: review gaps photo | `/class/{id}/student/{sid}` |\n| 5 | Approve gap (or edit then Approve); confirm pre-Approve hidden from family | student + gradebook |\n| 6 | Generate practice from approved gap; tweak/discard regenerate as allowed | assign flow |\n| 7 | Assign set to that student | assignment form |\n| 8 | Grade book: score/mark after Approve path | `/class/{id}/gradebook` |\n| 9 | Class setup / syllabus card: open syllabus editor | `/class/{id}/setup`, `/class/{id}/syllabus` |\n| 10 | Publish only when weights valid; or unpublish (lifecycle) | syllabus |\n| 11 | **Reverse:** dismiss/delete draft gap; confirm focus retarget rules | student record |\n| 12 | Second student same class \u2014 no cross-file | student B |\n| 13 | Optional second class independence | class switch |\n| 14 | Sign out | hamburger |\n\n## Lifecycle\n\nDraft \u2192 Approve \u2192 assign \u2192 score; syllabus draft \u2192 publish/unpublish; sign-out.\n\n## Multiplicity\n\nMultiple students; optional two classes independent syllabus/gradebook.\n\n## Reverse / cancel\n\nDiscard generated set; unpublish syllabus; delete draft gap; navigate away before Approve.\n\n## Dual-hat\n\nNone. syllabus.manage teacher seat only.\n\n## Functions exercised\n\nApprove gate; practice generate/assign; gradebook; syllabus AVG; Needs; student person page.\n\n## Explicit non-goals\n\nSIS passback; weighted district report; office syllabus policy; auto-publish AI grades; rewards.\n\n## Dual path (UI + Ask) \u2014 refine 2026-09-10\n\n| Activity | UI | Ask |\n|----------|----|-----|\n| Needs open draft | `/inbox` | `list_inbox` |\n| Approve gap | student record Approve | `approve_capture` (capability) |\n| Generate/assign practice | assign UI | `create_assignment` / revise_practice_page |\n| Gradebook score | `/class/{id}/gradebook` | `list_grade_cells`; score write **PARTIAL** if no write tool |\n| Syllabus publish/unpublish | `/class/{id}/syllabus` | `scan_class_syllabus` / draft get/discard / published get |\n| Delete draft gap | UI | `delete_gap` |\n| Second student isolation | student B | Ask must not cross-file |\n\nDeep authoring day expansion lives in **DITL-T-04**; T-02 remains Approve/assign/syllabus core.\n\n## Suggested QE themes\n\nApprove-before-visible; assignment 3\u20138 items; syllabus sum 100; class isolation; Ask approve parity.\n\n## Artifacts + DB assert (refine-2)\n\nConsumes captures from T-01 / F-DRAFTS. After Approve: `skill_gaps.status` approved; optional `students.current_focus_skill_id`; assignment/submission cells only after teacher score. Syllabus weights sum 100 when published.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 approvals, gaps, practice, scores, syllabus state.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|--------
