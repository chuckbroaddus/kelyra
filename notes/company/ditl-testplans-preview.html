-----------|\n| Approved gaps / focus | delete gap or retarget focus | `delete_gap` | `skill_gaps`; `students.current_focus_skill_id` \u2192 fixture baseline |\n| practice_sets + assignments `ditl-*` | delete assignment / discard practice | tools if listed else UI | `assignments`, `practice_sets`, `submissions` for ditl titles |\n| Graded cells on test work | prefer delete test assignment | PARTIAL Ask score | no graded cell on ditl-only assignment |\n| Syllabus draft/publish | unpublish / discard draft | `discard_class_syllabus_draft` | published weights = fixture baseline |\n| Captures consumed | delete if test-only | PARTIAL | `captures` clean |\n\n**Order:** unpublish syllabus \u2192 delete assignments/submissions \u2192 delete practice \u2192 delete gaps \u2192 restore focus \u2192 delete leftover captures.\n**Isolation:** titles/prefix `ditl-`; never wipe whole class gradebook seed outside run.\n"}, {"id": "DITL-T-03", "title": "DITL-T-03", "md": "# DITL-T-03 \u2014 Teacher Messages + Needs\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-T-03 |\n| Title | Teacher: messages, alerts, search, parent person, Needs triage |\n| Primary hat | teacher |\n| Other hats | none |\n| Support | SUPPORTED messaging v1 + Needs inbox |\n| Regression tags | `messages`, `inbox`, `search`, `parents`, `chrome-teacher`, `auth`, `ask-dual` |\n\n## Goal / story\n\nBetween blocks, teacher clears communication and filing debt: reads alerts via Messages center, replies to a parent, finds a student via Search, opens parent directory on class, triages Needs without full Approve session (pointer to T-02).\n\n## Preconditions / fixtures\n\n- Teacher; class with parents linked to students.\n- Unread alert and/or existing message thread.\n- \u22651 Needs item (Unassigned or draft).\n\n## Beat list\n\n| # | Beat | Surface |\n|---|------|---------|\n| 1 | Sign in teacher | `/sign-in` |\n| 2 | Header messages badge \u2192 `/messages` | header mail |\n| 3 | PersonTabs: Messages / Alerts (and feed tabs if present) | `/messages` |\n| 4 | Open alert detail if any | `/notifications/{id}` or alerts tab |\n| 5 | Open 1:1 parent thread; reply | `/messages/{id}` |\n| 6 | **Reverse:** back without send; draft discard | composer |\n| 7 | Search glass \u2192 find student by name | `/search` |\n| 8 | Open student record from search | `/class/{id}/student/{sid}` |\n| 9 | Class \u2192 Parents directory | `/class/{id}/parents` |\n| 10 | Open parent person page | `/class/{id}/parent/{pid}` |\n| 11 | Needs triage list only (no full Approve mandatory) | `/inbox` |\n| 12 | Ask optional quick question about class (not grade write) | `/ask` |\n| 13 | Sign out | hamburger |\n\n## Lifecycle\n\nSign-in \u2192 comms/search/people \u2192 sign-out.\n\n## Multiplicity\n\nMultiple threads; class-scoped parents list.\n\n## Reverse / cancel\n\nDiscard message; close search; leave Needs unapproved.\n\n## Dual-hat\n\nNone.\n\n## Functions exercised\n\nMessages; alerts badge; search; class parents; Needs; Ask.\n\n## Explicit non-goals\n\nGroup chat product expansion; SMS; email digest; SIS contacts import.\n\n## Dual path (UI + Ask) \u2014 refine 2026-09-10\n\n| Activity | UI | Ask |\n|----------|----|-----|\n| Messages / Alerts tabs | header \u2192 `/messages` | `list_threads` / `my_unread_messages` |\n| Reply parent | composer | `send_message` |\n| Search student | `/search` | `search_students` / `list_roster` |\n| Class parents directory | `/class/{id}/parents` | `search_parents` / `get_parent` |\n| Needs triage | `/inbox` | `list_inbox` |\n| Ask class question | tray Ask | same \u2014 no grade write |\n\n## Suggested QE themes\n\nBadge=alerts not DM count; parent thread RLS; search does not invent students; Ask send_message parity.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 messages; optional inbox file.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Teacher\u2194parent messages (`ditl-` body) | delete if UI allows else residual OK | send only; delete GAP | threads with ditl marker |\n| Needs refile Unassigned | leave filed or delete capture | `list_inbox` | no extra Unassigned from run |\n\n**Order:** optional capture delete \u2192 sign out.\n"}, {"id": "DITL-T-04", "title": "DITL-T-04", "md": "# DITL-T-04 \u2014 Teacher academic day (authoring + grade + comms)\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-T-04 |\n| Title | Teacher: syllabus, assignment, quiz, keys, focus, grade, parent msg, diary, class feed |\n| Primary hat | teacher |\n| Support | SUPPORTED teacher desk/AVG/assign/key/grade/msg; diary draft Ask; feed UI; Ask feed create GAP |\n| Regression tags | `teacher`, `syllabus`, `assignment`, `quiz`, `answer-key`, `focus`, `gradebook`, `messages`, `diary`, `feeds`, `ask-dual`, `web` |\n| CEO story | 6 \u2014 Teacher academic day |\n\n## Goal / story\n\nFull teacher academic day on shipped surfaces: apply syllabus to class; create assignment; create quiz (category); answer key \u2192 assignment; answer key \u2192 quiz; focus exercise for a student; grade assignment + quiz; message a student\u2019s parent; multiple diary entry types; multiple class feed entries. **Every** in-app write has UI + Ask dual path (GAP where tools missing).\n\n## Preconditions / fixtures\n\n- F-TEACHER-A, F-AVG, F-QUIZ key photo, F-DRAFTS, F-FOCUS candidate student, F-PARENT linked, F-DIARY, F-FEED class\n- Web width \u2265720 preferred for desk\n\n## Dual-path beat list\n\n| # | Activity | Support | UI path | Ask path |\n|---|----------|---------|---------|----------|\n| 1 | Sign in teacher | SUPPORTED | `/sign-in` tray Desk\u00b7Capture\u00b7Needs\u00b7Class\u00b7Ask | \u2014 |\n| 2 | Apply/publish syllabus to class | SUPPORTED | `/class/{id}/syllabus` publish when weights valid | `/ask` `scan_class_syllabus` \u2192 confirm \u2192 publish path; `get_class_syllabus_draft` / `discard_class_syllabus_draft`; `get_published_class_syllabus` |\n| 3 | Create assignment (homework) | SUPPORTED | `/assignment` create UI | `/ask` `create_assignment` (after confirm) |\n| 4 | Create quiz (category=quiz) | SUPPORTED | assign UI category quiz | Ask `create_assignment` category quiz \u2014 **no** quiz\u2192include shortcut |\n| 5 | Scan answer key \u2192 associate assignment | SUPPORTED | key photo + assign flow | `/ask` `scan_answer_key` then confirm `create_assignment` |\n| 6 | Scan answer key \u2192 associate quiz | SUPPORTED | same with quiz category | Ask scan + create quiz category |\n| 7 | Focus exercise for one student | SUPPORTED | Approve gap sets `current_focus_skill`; generate/assign practice to student | Ask `approve_capture` / desk tools + `create_assignment` practice; `summarize_class_desk` focus list \u2014 map \u201cfocus exercise\u201d to practice-on-focus, not invented object |\n| 8 | Grade assignment submission | SUPPORTED | gradebook / submission score after Approve gate | Ask `list_grade_cells`; score write may be UI-primary if no grade-write tool \u2192 **PARTIAL** score-via-Ask |\n| 9 | Grade quiz submission | SUPPORTED | gradebook | same PARTIAL Ask score |\n| 10 | Message student\u2019s parent | SUPPORTED | `/messages` or class parent page | `/ask` `send_message` / `list_threads` |\n| 11 | Diary entries multiple types | SUPPORTED | `/diary` create text + photo + filters if present | `/ask` `draft_diary_entry` then user **Save** (never auto-ledger) |\n| 12 | Class feed multiple posts | SUPPORTED | class feed composer posts | Ask `list_feed` read; create **PARTIAL/GAP** |\n| 13 | Reverse: unpublish syllabus; discard draft gap; discard diary draft; discard msg | SUPPORTED | respective UIs | Ask discard_class_syllabus_draft / delete_gap / abandon |\n| 14 | Multiplicity: second student no cross-file; second class independent | SUPPORTED | class switch | Ask class_id grounded tools; class switch clears assignment ground |\n| 15 | Sign out | SUPPORTED | hamburger | \u2014 |\n\n## Lifecycle / reverse / multiplicity / dual-hat / non-goals\n\n- Lifecycle: syllabus publish \u2192 author assign/quiz/keys \u2192 focus \u2192 grade \u2192 msg \u2192 diary \u2192 feed \u2192 sign-out\n- Reverse: unpublish; discard drafts; delete gap retarget focus\n- Dual-hat: none (DH-01)\n- Non-goals: office syllabus.manage; Ask auto-publish grades; solver keys to students; invent focus chrome name; feed Ask create tool\n\n## Suggested QE themes\n\nKey never in student Ask pack; quiz category \u2260 include shortcut; diary Save gate; dual-path parity matrix.\n\n## Artifacts + DB assert (refine-2)\n\n| Beat | Fixture | Format / subject | DB assert after ingest/create |\n|------|---------|------------------|-------------------------------|\n| 2 syllabus | `F-ART-SYL-SCI-TYPED` | typed weights page; science | published syllabus categories/weights sum 100; class_id correct |\n| 3 homework assign | `F-ART-HW-HIST-HW` title source | handwritten homework sheet; history | `assignments.title/subject/category`; class_id |\n| 4 quiz | `F-ART-QUIZ-BIBLE-TYPED` | typed quiz; Bible | `assignments` category quiz (not include shortcut) |\n| 5 key\u2192assignment | `F-ART-KEY-MATH-MIXED` | mixed handwritten+typed key; math | key linked to `assignment_id`; asset stored |\n| 6 key\u2192quiz | `F-ART-KEY-ENG-TYPED` | typed key; English | key \u2192 quiz assignment_id |\n| 7 focus practice | generated | \u2014 | `current_focus_skill_id`; practice assignment to student |\n| 8\u20139 grades | submissions on ditl assigns | \u2014 | grade cell / submission score only after Approve gate |\n| Dual path | UI create **and** Ask `create_assignment` / `scan_answer_key` / `scan_class_syllabus` where tools exist | \u2014 | same durable rows either path |\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 heavy authoring day.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Syllabus draft/publish | unpublish; discard draft | `discard_class_syllabus_draft` | class syllabus = baseline |\n| Assignments (hw + quiz) `ditl-*` | delete assignment UI | if delete tool else UI | `assignments` gone; submissions CASCADE |\n| Answer-key work + key photo assets | delete assignment; unref asset | `scan_answer_key` confirm \u2014 delete UI | no orphan key assets |\n| Focus practice | delete assignment / clear focus | `delete_gap` / UI | `current_focus_skill_id` baseline |\n| Grade cells on ditl assignments | deleted with assignment | PARTIAL | no cells |\n| Parent messages `ditl-` | residual OK if no delete | `send_message` | optional |\n| Diary drafts/entries | discard/delete `/diary` | `draft_diary_entry` never auto-ledger | diary rows for run |\n| Class feed posts `ditl-` | delete/archive if UI | create **GAP**; delete **GAP** | feed posts with ditl body |\n\n**Order:** delete feed \u2192 diary \u2192 messages optional \u2192 unpublish syllabus \u2192 delete assignments/keys \u2192 clear focus/gaps \u2192 delete captures/assets \u2192 sign out. Idempotent.\n"}, {"id": "DITL-T-05", "title": "DITL-T-05", "md": "# DITL-T-05 \u2014 Handwritten student data card \u2192 existing student\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-T-05 |\n| Title | Teacher: photograph handwritten student data card; associate fields to existing student |\n| Primary hat | teacher |\n| Support | SUPPORTED intent `student_card` (ui-design \u00a714.2 D); human confirm; no invent student |\n| Regression tags | `capture`, `student-card`, `bio`, `metadata`, `matcher`, `ask-dual`, `ferpa`, `teardown` |\n| CEO story | Handwritten student data card scan \u2192 existing record |\n\n## Goal / story\n\nTeacher photographs a **handwritten** student data card (name, date, address, phone, email, birthday, emergency contacts). Product classifies `student_card`, proposes canonical metadata fields + student guess. Teacher confirms **existing** `studentId` (spoken name and/or roster picker \u2014 **never invent** a roster row). Confirmed fields persist on that student; QE asserts DB accuracy; teardown reverts bio + deletes card capture.\n\n## Preconditions / fixtures\n\n- F-TEACHER-A; roster includes **existing** target S1 (do not create new student this plan)\n- `F-ART-CARD-STUDENT-HW` handwritten card photo fixture (see index F-ARTIFACTS)\n- Baseline snapshot of S1 `students.metadata` + `name_aliases` before run\n- Camera permissions; active class with S1 enrolled\n\n## Dual-path beat list\n\n| # | Activity | Support | UI path | Ask path |\n|---|----------|---------|---------|----------|\n| 1 | Sign in teacher | SUPPORTED | `/sign-in` tray | \u2014 |\n| 2 | Capture card photo | SUPPORTED | `/capture` shutter | **PHYSICAL-ONLY** camera |\n| 3 | Spoken name / picker for **existing** student | SUPPORTED | proposal sheet AvatarTray / Unknown | PHYSICAL + UI confirm; Ask does not OCR-insert |\n| 4 | Intent `student_card`; review proposed `fields[]` | SUPPORTED | proposal sheet checkboxes | no Ask invent Document AI; may `open_screen` capture/inbox |\n| 5 | Human confirm write metadata on existing student | SUPPORTED | primary Save on sheet | Ask `update_student` **after** fields known \u2014 dual path: UI extract+confirm **or** Ask update with same values on second pass |\n| 6 | **DB assert** each canonical field | SUPPORTED | Details UI read-back | Ask read student if tool lists fields |\n| 7 | Card image filed as note_only capture (no grade) | SUPPORTED | product behavior | \u2014 |\n| 8 | IEP/504 lookalike control (optional) | SUPPORTED | force note-only; no IEP columns | \u2014 |\n| 9 | Reverse: revert metadata to baseline; delete capture | SUPPORTED | Details clear keys; delete capture | `update_student` revert; capture delete PARTIAL/UI |\n| 10 | Sign out | SUPPORTED | hamburger | \u2014 |\n\n## Lifecycle / reverse / multiplicity / dual-hat / non-goals\n\n- Lifecycle: photo \u2192 confirm existing student \u2192 confirm fields \u2192 DB assert \u2192 revert \u2192 sign-out\n- Multiplicity: wrong-guess twin names \u2014 picker corrects; second student not written\n- Dual-hat: none (office field path \u2192 O-07)\n- Non-goals: invent student; IEP/504 extraction; SIS columns; auto-grade; parent_card path (separate); OCR-name-as-sole-matcher for homework (this plan is card fields + existing id)\n\n## Artifacts + DB assert\n\n| Field | Source on card | DB target after confirm |\n|-------|----------------|-------------------------|\n| preferred / given name | handwritten | `students.metadata.preferred_name`; upsert `name_aliases` |\n| birthday | handwritten | `metadata.birthday` `YYYY-MM-DD` |\n| phone / email / address | handwritten | `metadata.phone` / `email` / `address` |\n| emergency name/phone | handwritten | `metadata.emergency_name` / `emergency_phone` |\n| grade/age optional | handwritten | `metadata.grade_or_age` |\n| unrecognized lines | \u2014 | `metadata.notes` only |\n| capture | photo asset | `captures` note_only on student; **no** grade cell |\n\nUnchecked proposed fields must **not** write. Clear = delete key (not `\"\"`).\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 metadata + capture/asset.\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| `students.metadata` keys written this run | Details revert to baseline snapshot | `update_student` baseline | metadata keys match pre-run baseline; no extra keys |\n| `name_aliases` preferred upsert | remove test alias if added | same | aliases baseline |\n| note_only capture + asset | delete capture | PARTIAL | no leftover capture/asset for card |\n\n**Order:** revert metadata \u2192 delete capture/asset \u2192 sign out. Idempotent.\n**Isolation:** existing S1 row stays; never delete student.\n\n## Suggested QE themes\n\nExisting student only; field-level DB parity; FERPA no IEP columns; teardown restores baseline; dual-path UI extract + Ask update.\n"}, {"id": "DITL-X-01", "title": "DITL-X-01", "md": "# DITL-X-01 \u2014 Author Studio pack emit\n\n| Field | Value |\n|-------|-------|\n| Plan ID | DITL-X-01 |\n| Title | Author studio: prepare deck \u2192 pack CLI \u2192 manifest for class app |\n| Primary hat | lesson author (studio user) |\n| Other hats | none in class-app chrome |\n| Support | SUPPORTED in `kelyra-author` only |\n| Regression tags | `author`, `lesson-pack`, `manifest`, `studio` |\n\n## Goal / story\n\nA lesson designer (internal/partner) spends a studio day: prepare source deck under teacher-decks notes, run pack CLI to emit `index.html` + `manifest.json` + media suitable for class-app publish/lesson assignment. This is **not** a school-role daily path in the class app.\n\n## Preconditions / fixtures\n\n- Workspace `~/projects/kelyra-author` available.\n- Source deck inputs per Author README / product-design.\n- Class app consume path known (lesson pack catalog) but publish may be separate gate.\n\n## Beat list\n\n| # | Beat | Surface |\n|---|------|---------|\n| 1 | Open Author studio repo / tooling | kelyra-author CLI/docs |\n| 2 | Prepare or select source deck | `notes/teacher-decks/` or studio sources |\n| 3 | Run pack emit | pack CLI |\n| 4 | Verify outputs: index.html, manifest.json, media paths | emit dir |\n| 5 | **Reverse:** clean rebuild; fail on bad input without corrupt prior good pack | CLI |\n| 6 | Optional: validate manifest fields class app expects | manifest |\n| 7 | Hand off pack for class-app lesson assign (pointer; may be other role) | process |\n| 8 | Stop \u2014 no class-app student login required in this plan | \u2014 |\n\n## Lifecycle\n\nSource ready \u2192 pack \u2192 verify artifacts \u2192 done. No class-app sign-out.\n\n## Multiplicity\n\nMultiple packs/decks; one pack must not clobber another\u2019s emit folder if isolated dirs used.\n\n## Reverse / cancel\n\nRebuild; delete bad emit; do not half-publish.\n\n## Dual-hat\n\nN/A unless same human later teaches \u2014 then class-app plans, not this file.\n\n## Functions exercised\n\nAuthor pack pipeline; manifest emission.\n\n## Explicit non-goals\n\nClass-app chrome DITL; SIS; live teacher Capture; treating studio as office role.\n\n## Scope note for CEO\n\nResearch marks Author as studio-only. Include in program for pack regression; **exclude** from nightly class-app device matrix unless pack format changed.\n\n## Dual path note \u2014 refine 2026-09-10\n\nClass-app UI+Ask dual path **N/A** (studio CLI day). No `/ask` in kelyra-author. Physical/CLI beats only. Do not invent class-app chrome for authors.\n\n## Suggested QE themes\n\nDeterministic emit; manifest schema; media refs resolve; exclude from class-app Ask matrix.\n\n## Teardown / cleanup (refine-2 2026-09-10)\n\n**Mutating?** Yes \u2014 emit directories on disk (studio).\n\n| Created / touched | UI cleanup | Ask cleanup | DB leftover check |\n|--------------------|------------|-------------|-------------------|\n| Pack emit dir (`index.html`, `manifest.json`, media) | delete isolated out dir tagged `ditl-` | N/A studio | **no** class-app DB; filesystem only |\n| Temp bad-input emits | delete | N/A | no corrupt shared golden pack path |\n\n**Order:** verify \u2192 delete disposable emit dirs. Keep golden fixtures.\n**Isolation:** never write emit into a shared golden path without copy.\n"}];
