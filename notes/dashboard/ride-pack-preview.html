const DOCS = [{"label": "R1 Research", "name": "car-rider-research.md", "md": "# Car-Rider / Dismissal Queue Research Note (RIDE-R1)\n\n**Date:** 2026-09-05  \n**Author:** chief-of-staff (CEO vision lock; supersedes 2026-09-03 placard/keypad cut)  \n**Status:** Complete — **CEO locks closed**. GATE before implement.  \n**Prior cut:** 2026-09-03 R1 recommended printed Family ID + staff keypad, **no cameras / no LPR**. Chuck rejected that.  \n**Citations:** placa.ai 2026, Schoolhouse Driveline, SchoolPass, PikMyKid, Bloomz (landscape only). v1 mechanic is **Kelyra product law from CEO**.\n\n---\n\n## Executive Summary\n\nDismissal is a physical queue of **cars**, sometimes **two lines** (typically by grade). Kelyra uses phones already in pockets:\n\n1. The **parent person record** holds vehicles (plate, make, model) — own cars plus **grandma / nanny** cars. Parent adds and removes them. Each vehicle is **today only**, **date range**, or **indefinite**. Staff may attach a plate when the parent has not.\n2. Check-in: pick **which children this stop**, then either photograph the **car ahead**, or **I'm first** (photo of empty lane or manual first). The person **behind** identifies this car when they photograph its bumper. The parent does **not** pick which of their cars they are sitting in.\n3. Unreadable / unknown plate: type the plate or **speak it** (STT). Same for staff attach.\n4. Staff walk photographs cars **1, 2, 3…** on **that line**. Two people claiming first → staff flag + tap to fix order.\n5. Staff **check the parent out of this line** when the child is confirmed picked up, so the parent can join the **other line** for a staggered second child.\n6. Office **blacklist**. Unknown plates stay visible. Restricted parent sees only **Check in failed** (no reason). Success: **Check in successful, you are XX vehicle in line** (no total).\n7. Photos **and** non-photo line events expire **7 days** after that pickup date, unless the **superintendent archives that day's photos** (kept until deleted). Subpoena process is **not v1**.\n\n**Not v1:** Family ID placard; staff keypad as the product; GPS order; pole ANPR / RFID SKU; photo = child released; parent firehose of the school line.\n\n---\n\n## 1. Competitors (landscape, not the spec)\n\nPikMyKid (~$3,750/yr, app + GPS), SchoolPass (LPR poles / RFID / GPS), Driveline (~$935/yr placard + keypad). [1]–[6]  \nKelyra: **phone LPR + predecessor graph + staff walk**, existing hats. 2026-09-03 Driveline-style recommendation is **retired**.\n\n---\n\n## 2. v1 mechanic (CEO lock)\n\n### 2.1 Vehicles on the parent person\n\n- Plate, make, model. Many rows. Includes cars the parent does not drive every day (grandma, nanny).\n- Validity: `today` | `from`–`to` (school-local dates) | `indefinite`. Expired rows do not match the line.\n- Parent add/remove. Staff attach/override. Staff judgment outranks parent hygiene.\n- `plate_norm`: uppercase, no spaces/hyphens. Never invent a parent from a plate.\n- At check-in the parent does **not** select “I’m in the Honda.” Identity of *this* bumper comes from the car behind (photo) or staff walk.\n\n### 2.2 Check-in\n\n- Pick children **this stop** (not the whole sibling set). Then:\n  - **Behind someone:** photo of the car ahead → place behind that plate; if that plate is known but not in **this line**, insert them in front too; unknown → unknown slot + staff flag; unreadable → retry, type, or speak.\n  - **First:** “I’m first” and/or photo of empty pavement. Two firsts on the same line → **staff conflict** on the list; staff tap-corrects order.\n- Copy: success **Check in successful, you are XX vehicle in line** (own position, **no** “of 40”). Fail **Check in failed** (restriction, unlinked child, etc. — **no reason** to the parent).\n- Plate type-in / STT: parent (car ahead) and staff (attach). STT is input, not grok-tts playback.\n\n### 2.3 Two lines and staggered pickup\n\n- Office configures **lines** (typical: grade bands). Each has its own order.\n- Parent may finish line A (child 1), get **checked out by staff**, then check into line B (child 2).\n- Duty is per line. Stage pre-call is per line.\n\n### 2.4 Staff walk, nudge, checkout\n\n- Walk **this line**: photo 1, 2, 3… Spine while the walk is open.\n- Nudge unsigned-in known plates in-app (no plate, no neighbor kids in the copy).\n- **Checkout / release:** staff confirm the child was picked up → parent **leaves this line**. Photo check-in ≠ checkout.\n- Staff tap to repair order (duplicate first, wrong bumper).\n\n### 2.5 Blacklist and unknown\n\n- Restriction: parent (and/or vehicle) must not take student S. Duty sees a **flag**, not the office note. Parent sees **Check in failed** only.\n- Unknown plate: stays on the **curb** list until attach, wave, or escalate.\n\n### 2.6 Retention\n\n- Line photos and **queue events** delete **7 days** after `school_date` of pickup.\n- Within those 7 days, **superintendent** may **archive that day’s photos** (every photo that day — extra evidence in frame). Archived photos **kept until office deletes**. Events still follow the 7-day rule.\n- No public bucket. No Ask ingest. Subpoena workflow **out of v1**.\n\n---\n\n## 3. AI\n\n| Job | v1 | Not v1 |\n|---|---|---|\n| Read plate from photo | Edge, server key | Client keys |\n| STT into plate field | Yes | New TTS vendor; grok-tts is playback only |\n| Behind / first graph | Yes | GPS |\n| Face-match driver | No | |\n| Mint people from plate | No | Matcher law |\n\nUnreadable → human path (retry / type / speak / staff).\n\n---\n\n## 4. Limits (honest)\n\nNight, glare, dirty plates, wrong bumper, cloned plates. Staff ordinal + tap-correct beat a bad parent graph. Photographing another car is PII. Two lines can desync if checkout is skipped (staff must checkout).\n\n---\n\n## 5. v1 vs later\n\n**v1:** vehicles + validity; photo / I’m first; two lines; staff walk + checkout; STT/type plate; blacklist; 7-day purge; superintendent photo archive.  \n**Later:** poles, RFID, GPS, face verify, SMS, nanny’s own login, subpoena desk.\n\n**OPEN ISSUES:** none for GATE.  \n**RECOMMENDED NEXT ACTION:** Hold **RIDE-GATE** until Chuck sends.\n\n## Sources\n\n[1] https://placa.ai/pikmykid-alternatives-school-dismissal  \n[2] https://schoolhousedriveline.com  \n[3] https://schoolpass.com/solutions/carline-automation  \n[4] https://getapp.com/education-childcare-software/a/pikmykid/reviews  \n[5] https://schoolhousedriveline.com/school-dismissal-manager-pricing  \n[6] https://www.bloomz.com/vs-pikmykid\n", "chars": 6339}, {"label": "P1 Plan", "name": "car-rider-plan.md", "md": "# RIDE-P1: Car-rider feature set, UI/UX, AI, implementation tasks\n\n**Date:** 2026-09-05  \n**Author:** chief-of-staff (CEO vision lock)  \n**Status:** Spec only — no app code, no SQL, no kelyra-qa-loop.  \n**Depends on:** `notes/company/car-rider-research.md`  \n**Do not staff Engineering until Chuck sends GATE.**\n\n---\n\n## 0. Product law\n\n| Surface | Job | What it is not |\n|---|---|---|\n| **Vehicles** | Plate/make/model on parent; grandma/nanny cars; today / range / indefinite; add/remove | Hang-tag; student metadata; parent picking “which car I’m in” at shutter |\n| **Lines** | Two (or more) physical lines, typically grade bands | One global school queue |\n| **Check-in** | Children this stop + photo of car ahead **or** I’m first | GPS; placard |\n| **Plate entry** | LPR, else type or STT (parent + staff) | Client vision keys |\n| **Staff** | Walk 1…n; conflict flag; tap-fix order; **checkout** after pickup | Keypad product |\n| **Parent copy** | Success: you are **XX** in line (no total). Fail: **Check in failed** (no reason) | Neighbor plates; “of 40” |\n| **Retention** | Photos + events **7 days**; superintendent may archive **that day’s photos** forever-until-delete | Subpoena desk; public URL |\n\n---\n\n## 1. Hats\n\n**Parent:** vehicle list (own + authorized cars) with validity; at a **line**: child chips; shutter or I’m first; type/speak plate if needed; own status + own XX. Then after checkout, may join the other line with other children.\n\n**Curb:** per-line camera walk; list with duplicate-first conflict; tap reorder; attach (type/STT); nudge; **checkout** when child is in the car.\n\n**Stage:** pre-call children for **this line** only.\n\n**Superintendent:** archive day’s photos; restrictions; lines config; duty. Administrators: restrictions/duty/attach — **archive is superintendent**.\n\n**Student:** no UI.\n\n---\n\n## 2. Non-goals\n\nPlacard/keypad as check-in; poles/RFID; GPS order; auto-checkout on plate read; LPR inserts people; parent sees school line or total count; anon URL; token `/parent`; `is_staff` widen; twin mash-up; class create; face match; Ask dump; subpoena workflow.\n\n---\n\n## 3. Mechanic\n\n- Graph per **line**. Behind-photo places photographer behind that plate **in this line**.\n- I’m first / empty-lane. Two firsts → staff banner + tap correction (append events, don’t rewrite).\n- Parent does not declare own vehicle at check-in.\n- Staff checkout = `released` for **this line** + those children. Parent is off that line and may check into another.\n- Staggered: line A child 1, checkout, line B child 2 — two trips, not one household blob.\n\n---\n\n## 4. Visibility\n\n| Viewer | Sees |\n|---|---|\n| Parent | Own vehicles; own trip; own **XX**; own children. No neighbor plates, no total |\n| Curb | That line’s live order, plates, flags, conflicts |\n| Stage | This line’s children to pre-call |\n| Superintendent | Archive; campus tools |\n| Restricted parent | Check in failed only |\n| Others | Nothing |\n\n---\n\n## 5. AI\n\nLPR server-side. STT fills plate field (OS or existing server STT — not grok-tts). No Ask tool.\n\n---\n\n## 6. Phases (no code)\n\nP0 data: vehicles+validity, lines, photos, events, restrictions, duty, 7-day job, archive flag.  \nP1 Edge LPR + STT field.  \nP2 parent vehicles + check-in + I’m first + copy.  \nP3 staff walk, conflict, checkout, two lines.  \nP4 office restrictions + superintendent archive.\n\n**kelyra-qa-loop only after GATE send.**\n", "chars": 3397}, {"label": "A1 Architecture", "name": "car-rider-architecture.md", "md": "# RIDE-A1: Architecture — car-rider queue (photo / plate)\n\n**Date:** 2026-09-05  \n**Author:** chief-of-staff (CEO vision lock)  \n**Status:** Architecture only — **no SQL**. GATE before implement.  \n**Live ground:** `docs/data-model.md`, `my_school_id`, private `photos`, `write_audit`. No vehicle/queue tables today.\n\n---\n\n## 0. Law\n\n| Q | A |\n|---|---|\n| Order | Per **line**: staff walk seq if open, else predecessor graph + I’m-first. Never GPS. Server clock/seq. |\n| Pickup unit | Signed-in parent + selected children **this stop** + **this line**. Own bumper identity from the car behind or staff walk — not a self-picked vehicle. |\n| Checkout | Curb only. Photo ≠ released. |\n| LPR / STT | Server/OS; no `EXPO_PUBLIC_` vision keys. |\n| Retention | Photos + `queue_events` purge **7 days** after `school_date`. Superintendent `archive` of **that day’s photos** exempts those assets until delete. |\n| Implement? | **NO until GATE send.** |\n\n---\n\n## 1. Sketch (not a migration)\n\nStamp `school_id` on every row.\n\n### `dismissal_lines`\n\n`id`, `school_id`, `name` (e.g. K–2), `sort`, `status`. Duty and events point at `line_id`.\n\n### `parent_vehicles`\n\n`parent_id`, `plate_raw`, `plate_norm`, `make`, `model`, `label` (optional “nanny”), `source` parent|staff, `status` active|void,  \n`validity_kind` `today` | `range` | `indefinite`, `valid_from` date, `valid_to` date (school-local).  \nExpired ⇒ not used for match. Parent upsert/delete (void). Staff attach.\n\nActive unique `(school_id, plate_norm)` among non-void **currently valid** rows — staff voids on conflict; no silent two-owners.\n\n### `pickup_restrictions`\n\n`student_id` + `parent_id` (optional `vehicle_id`). Duty flag only. Parent copy never includes reason.\n\n### `dismissal_duty`\n\n`curb` | `stage` + `line_id` (null = all lines). Not `is_staff`.\n\n### `line_photos`\n\n`line_id`, `school_date`, `asset_id` private, `kind` `parent_ahead` | `parent_first` | `staff_walk`, `staff_seq`, `walk_id`, plate read, unknown/unreadable, `ahead_vehicle_id`, `archived_at` (set by superintendent archive job for that date), `occurred_at` server.\n\n### `queue_events`\n\n`line_id`, kinds: `check_in`, `im_first`, `ahead_insert`, `staff_place`, `order_fix`, `left`, `released` (checkout), `nudge`, `restrict_block`, `attach_vehicle`, `plate_typed`, `plate_stt`.  \n`student_ids` this stop. Server `occurred_at`. Purge with 7-day job (photos not archived go too).\n\n**Order:** walk seq > staff `order_fix` > predecessor / I’m-first graph. Two `im_first` on same line without fix ⇒ `conflict_first` on live DTO.\n\n**Checkout:** `released` for this `line_id` + those children. Parent may `check_in` on another line after.\n\n### Live RPCs\n\n- `dismissal_queue_live(line_id)` duty/office  \n- `dismissal_my_trip()` → status, **position XX**, selected children, line id. No total, no neighbor plates  \n- `dismissal_parent_check_in` photo and/or `im_first` + student ids + line  \n- `dismissal_staff_walk_photo` / `dismissal_order_fix` / `dismissal_release` (checkout) curb  \n- `parent_upsert_vehicle` / `staff_attach_vehicle` (plate via LPR, typed, or STT string — server stores text, not audio by default)  \n- `office_set_pickup_restriction` admin  \n- `superintendent_archive_day_photos(school_date)` superintendent only + `write_audit`\n\nToken `/parent` deny. Student deny. Client cannot set seq / `occurred_at` / neighbor UUID.\n\n**LPR Edge:** JWT, server key, private bytes.  \n**STT:** field receives text; if cloud STT, server-side only.\n\n**7-day job:** delete `queue_events` and `line_photos` (and storage objects) where `school_date` < today-7 **and** photo not archived. Do not CASCADE from parent delete; null display FKs; purge still runs on date.\n\n---\n\n## 2. Why not X\n\nMetadata plates; placard check-in; GPS rank; client INSERT; LPR mint people; auto-stage all siblings; public photos; parent self-selected vehicle as order key.\n", "chars": 3870}, {"label": "S1 Security", "name": "car-rider-security.md", "md": "# RIDE-S1: FERPA / Security Review — Car-rider (photo / plate)\n\n**Date:** 2026-09-05  \n**Author:** chief-of-staff (not a legal opinion)  \n**Status:** Review only. GATE does not authorize a loop.  \n**Depends on:** R1/P1/A1 2026-09-05 locks.\n\n---\n\n## 0. Verdict\n\nPhone LPR is in v1. P0s: photo/plate PII, no parent firehose, duty wall, no anon/token parent, no client INSERT, twins fail closed, matcher never inserts people, restriction **reason hidden from parent**, 7-day purge, superintendent-only photo archive, STT/LPR keys server-side.\n\nCEO closed: TTL **7 days** photos **and** events; archive day’s **photos** (superintendent) kept until delete; parent fail copy has **no reason**; success may show **own XX**, never total; subpoena **out of v1**.\n\n---\n\n## 1. Data classes\n\n| Data | Who |\n|---|---|\n| Line photos | Curb capture; superintendent archive. Never other parents, Ask, public |\n| Plates | Owner parent’s own list; curb. Stage: prefer no plate |\n| Own XX | That parent only |\n| Restriction reason / office note | Office only. Parent: Check in failed |\n| Archived photos | Superintendent |\n\n---\n\n## 2. Threats (must-fix)\n\n**T1 firehose P0** — Parent reads only `dismissal_my_trip` (status, XX, own kids). No base SELECT, no realtime, no total.  \n**T2 columns P0** — No plate lookup oracle.  \n**T3 twins P0** — Linked + picked children only.  \n**T4 duty P0** — No `is_staff` widen.  \n**T5 token/anon P0**.  \n**T6 LPR oracle P0** — Window + line bound; parent DTO does not name the ahead parent.  \n**T7 keys/XSS P0** — No EXPO_PUBLIC vision; no HTML of LPR.  \n**T8 forge order P0** — Server seq; staff `order_fix` audited.  \n**T9 restriction P0** — Fail closed; parent copy has no reason; duty flag only.  \n**T10 unknown P1** — Curb/office, not stage wall.  \n**T11 retention P0** — 7-day purge; archived photos skip purge; no CASCADE wipe on person delete; no public bucket; no Ask. Archive RPC superintendent + audit.  \n**T12 dual-hat P0** — Separate RPCs.  \n**T13 offline P1** — Wipe on sign-out.  \n**T14 school_id P0**.  \n**T15 nudge P1** — No plates/names of others.  \n**T16 no Ask tool P1**.  \n**T17 STT P1** — Plate **text** stored; do not keep raw audio unless a later CEO lock.  \n**T18 two firsts P1** — Conflict visible to **curb**, not to other parents.\n\nIDs RIDE-S1-01…19 plus **20** archive/purge, **21** parent copy (fail no reason; success XX no total).\n\n---\n\n## 3. OPEN\n\nNone for GATE. Subpoena out of v1.\n", "chars": 2433}, {"label": "Q1 Acceptance", "name": "car-rider-acceptance.md", "md": "# RIDE-Q1: Acceptance plan — car-rider photo/plate (not a Build send)\n\n**Date:** 2026-09-05  \n**Author:** chief-of-staff  \n**Status:** PLAN ONLY. Hold until **RIDE-GATE** send.\n\nPack: `car-rider-research.md` / `plan.md` / `architecture.md` / `security.md`.\n\n---\n\n## 0. Laws\n\n| ID | Law |\n|---|---|\n| L1 | Check-in = photo of car ahead **or** I’m first, **per line**. Not placard, not GPS. |\n| L2 | Vehicles on parent (incl. grandma/nanny) with today/range/indefinite. No self-pick of own car at shutter. |\n| L3 | Order per line; staff walk / order_fix / graph. Server seq. |\n| L4 | Duty wall. Two lines. Staggered: checkout line A then check-in line B. |\n| L5 | Checkout = curb `released`. Photo ≠ released. |\n| L6 | Parent: own XX, no total, no neighbor plates. Fail: Check in failed, no reason. |\n| L7 | No anon / token parent. |\n| L8 | Linked+picked children. Restriction fail-closed. |\n| L9 | RPC writes; server LPR; type or STT plate text. |\n| L10 | 7-day purge photos+events; superintendent archive day’s photos until delete. |\n| L11 | LPR never inserts people. |\n| L12 | Private storage. No Ask tool. Not a grade. |\n\n**Out of v1:** poles, GPS, SMS, face match, subpoena desk, nanny’s own login.\n\n---\n\n## 2. Extra cases (add to prior matrix)\n\n| ID | Sev | Pass |\n|---|---|---|\n| C-09 | P0 | I’m first on empty line → position 1, success XX=1 |\n| C-10 | P0 | Two I’m-first → curb conflict; parent still own status; staff order_fix |\n| C-11 | P0 | Restricted → Check in failed, no reason string |\n| C-12 | P0 | Success copy has XX, not “of N” |\n| V-05 | P0 | Parent adds nanny car, today-only; next school day does not match |\n| V-06 | P0 | Parent voids/removes vehicle |\n| V-07 | P0 | Type or STT plate on unreadable / staff attach |\n| L-06 | P0 | Two lines independent orders |\n| L-07 | P0 | Checkout line A; check-in line B other child |\n| L-08 | P0 | Parent cannot checkout themselves |\n| H-08 | P0 | Day 8: unarchived photos+events gone |\n| H-09 | P0 | Super archive day 0: those photos remain after day 8; events still gone |\n| H-10 | P0 | Administrator cannot archive (superintendent only) |\n\nS1-01…21 must have evidence after send.\n\n**Non-acceptance:** placard-only, auto-release, “of 40”, reason on fail, public photos, `is_staff` queue, twin blend, client-forged order, no 7-day purge.\n\n**GATE:** held until Chuck sends.\n", "chars": 2335}];
