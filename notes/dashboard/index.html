<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kelyra desk</title>
  <style>
    :root {
      --bg: #0b0d12;
      --bg-elev: #12151c;
      --bg-card: #161a22;
      --line: #2a3140;
      --gold: #d4b06a;
      --gold-dim: #8a7340;
      --teal: #3d9b8f;
      --teal-dim: #2a6b63;
      --idle: #6b7280;
      --text: #e8e6e1;
      --muted: #9aa3b2;
      --hold: #d4b06a;
      --dns: #c45c5c;
      --shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }
    body {
      background-image:
        radial-gradient(ellipse at 12% 0%, rgba(61,155,143,.08), transparent 42%),
        radial-gradient(ellipse at 88% 8%, rgba(212,176,106,.07), transparent 38%);
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 22px 48px; }
    header.desk {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font-weight: 600;
      letter-spacing: .02em;
      font-size: 1.65rem;
      color: var(--gold);
    }
    h1 span { color: var(--teal); font-weight: 500; }
    .countdown {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: .92rem;
      color: var(--muted);
      text-align: right;
    }
    .countdown strong { color: var(--gold); font-weight: 600; }
    .countdown .target { display: block; font-size: .78rem; margin-top: 4px; color: var(--teal); }
    .teams {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 26px;
    }
    @media (max-width: 800px) {
      .teams { grid-template-columns: repeat(2, 1fr); }
      header.desk { flex-direction: column; }
      .countdown { text-align: left; }
    }
    .team {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 12px 11px;
      box-shadow: var(--shadow);
    }
    .team .name {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .team .state {
      margin-top: 6px;
      font-size: 1.05rem;
    }
    .team.active { border-color: rgba(61,155,143,.45); }
    .team.active .state { color: var(--teal); }
    .team.idle .state { color: var(--idle); }
    h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--gold);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: .88rem;
    }
    th {
      text-align: left;
      padding: 10px 12px;
      color: var(--muted);
      font-weight: 600;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--line);
      background: #10131a;
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: rgba(61,155,143,.08); }
    tbody tr:last-child td { border-bottom: none; }
    .id {
      font-variant-numeric: tabular-nums;
      color: var(--gold);
      font-weight: 600;
      width: 52px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: .7rem;
      letter-spacing: .04em;
      font-weight: 700;
    }
    .badge.hold { color: #1a1408; background: var(--hold); }
    .badge.dns { color: #1a0a0a; background: var(--dns); }
    .lane { color: var(--teal); font-size: .78rem; }
    .blurb { color: var(--text); }
    footer {
      margin-top: 28px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .75rem;
      color: var(--muted);
    }
    dialog {
      width: min(820px, calc(100vw - 32px));
      max-height: min(86vh, 900px);
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text);
      padding: 0;
      box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(5,6,10,.72); }
    .dlg-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
    }
    .dlg-head h3 { margin: 0 0 6px; font-size: 1.15rem; color: var(--gold); }
    .dlg-meta { font-family: ui-sans-serif, system-ui, sans-serif; font-size: .8rem; color: var(--muted); }
    .x {
      appearance: none;
      border: 1px solid var(--line);
      background: #10131a;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
    }
    .x:hover { border-color: var(--gold); color: var(--gold); }
    .prompt {
      margin: 0;
      padding: 16px 18px 20px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .82rem;
      line-height: 1.5;
      color: #d7ddd8;
      overflow: auto;
      max-height: calc(86vh - 90px);
    }
  </style>
</head>

    const tbody = document.getElementById("rows");
    const modal = document.getElementById("modal");
    const mTitle = document.getElementById("m-title");
    const mMeta = document.getElementById("m-meta");
    const mBody = document.getElementById("m-body");

    items.forEach(function (item, i) {
      const tr = document.createElement("tr");
      tr.tabIndex = 0;
      tr.setAttribute("role", "button");
      tr.innerHTML =
        '<td class="id">' + item.id + "</td>" +
        '<td class="lane">' + item.lane + "</td>" +
        '<td><span class="badge ' + (item.status === "DO NOT SEND" ? "dns" : "hold") + '">' + item.status + "</span></td>" +
        '<td class="blurb">' + item.summary + "</td>";
      function openItem() {
        mTitle.textContent = item.id + " · Grok Build prompt";
        mMeta.textContent = item.lane + " · " + item.status;
        mBody.textContent = item.prompt;
        if (typeof modal.showModal === "function") modal.showModal();
        else modal.setAttribute("open", "");
      }
      tr.addEventListener("click", openItem);
      tr.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openItem();
        }
      });
      tbody.appendChild(tr);
    });

    document.getElementById("m-close").addEventListener("click", function () {
      if (typeof modal.close === "function") modal.close();
      else modal.removeAttribute("open");
    });

    modal.addEventListener("click", function (e) {
      if (e.target === modal) {
        if (typeof modal.close === "function") modal.close();
        else modal.removeAttribute("open");
      }
    });

    function pad(n) { return String(n).padStart(2, "0"); }
    function tick() {
      const now = new Date();
      const ms = TARGET.getTime() - now.getTime();
      const el = document.getElementById("clock");
      if (ms <= 0) {
        el.textContent = "window open";
        return;
      }
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      el.textContent = d + "d " + pad(h) + "h " + pad(m) + "m " + pad(sec) + "s";
    }
    tick();
    setInterval(tick, 1000);
  </script>
