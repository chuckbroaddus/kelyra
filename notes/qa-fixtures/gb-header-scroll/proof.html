<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StickyTable scroll sync proof</title>
  <style>
    :root { --frozen: 120px; --head: 56px; --row: 44px; --col: 72px; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 12px/1.3 system-ui, sans-serif; background: #f4f1ea; color: #1a1612; }
    h1 { font-size: 14px; margin: 8px 12px; }
    .meta { margin: 0 12px 8px; color: #6b645c; font-size: 11px; }
    .shell { margin: 0 8px 16px; border: 1px solid #d9d2c8; border-radius: 12px; overflow: hidden; background: #fff; }
    .head {
      position: relative; height: var(--head); background: #efeae2; overflow: hidden;
      border-bottom: 1px solid #d9d2c8;
    }
    .head-mirror {
      display: flex; height: 100%; padding-left: var(--frozen);
      will-change: transform;
    }
    .frozen-head, .frozen-col {
      position: absolute; left: 0; top: 0; width: var(--frozen); height: 100%;
      background: #efeae2; border-right: 1px solid #d9d2c8;
      display: flex; align-items: center; padding: 0 8px; font-weight: 600; z-index: 2;
    }
    .frozen-col { position: relative; height: auto; }
    .cell {
      width: var(--col); min-width: var(--col); height: var(--head);
      border-right: 1px solid #d9d2c8; display: flex; align-items: center; justify-content: center;
      font-weight: 600;
    }
    .body { display: flex; }
    .names { width: var(--frozen); flex-shrink: 0; background: #fff; border-right: 1px solid #d9d2c8; }
    .name-row, .data-row { height: var(--row); display: flex; align-items: center; border-bottom: 1px solid #eee; }
    .name-row { padding: 0 8px; }
    .name-row:nth-child(even), .data-row:nth-child(even) .dcell { background: #faf8f4; }
    .hclip { flex: 1; min-width: 0; overflow: hidden; }
    .body-scroll {
      overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
      height: calc(8 * var(--row));
    }
    .data-rows { display: flex; flex-direction: column; width: max-content; }
    .dcell {
      width: var(--col); min-width: var(--col); height: var(--row);
      border-right: 1px solid #eee; display: flex; align-items: center; justify-content: center;
    }
    .readout {
      margin: 8px 12px; font-family: ui-monospace, monospace; font-size: 11px;
      background: #1a1612; color: #f4f1ea; padding: 8px 10px; border-radius: 8px;
    }
    .ok { color: #7dcea0; } .bad { color: #f5a89a; }
  </style>
</head>
<body>
  <h1>GB header/body horizontal scroll — single owner + translateX mirror</h1>
  <p class="meta">Mirrors StickyTable fix (t_6cc16a3e): body scroll owns offset; header uses translateX = -x including overscroll.</p>
  <div class="shell" id="table">
    <div class="head">
      <div class="head-mirror" id="headMirror"></div>
      <div class="frozen-head">Assignment</div>
    </div>
    <div class="body">
      <div class="names" id="names"></div>
      <div class="hclip">
        <div class="body-scroll" id="bodyScroll">
          <div class="data-rows" id="dataRows"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="readout" id="readout">offset=0 · headerShift=0 · drift=0 · <span class="ok">SYNC</span></div>
  <script>
    const COLS = 24;
    const ROWS = 8;
    const head = document.getElementById('headMirror');
    const names = document.getElementById('names');
    const data = document.getElementById('dataRows');
    const body = document.getElementById('bodyScroll');
    const readout = document.getElementById('readout');

    let heads = '';
    for (let c = 0; c < COLS; c++) heads += `<div class="cell">S${c + 1}</div>`;
    head.innerHTML = heads;

    let nameHtml = '';
    for (let r = 0; r < ROWS; r++) nameHtml += `<div class="name-row">Row ${r + 1}</div>`;
    names.innerHTML = nameHtml;

    let dataHtml = '';
    for (let r = 0; r < ROWS; r++) {
      dataHtml += '<div class="data-row">';
      for (let c = 0; c < COLS; c++) dataHtml += `<div class="dcell">${(r + 1) * 10 + c}</div>`;
      dataHtml += '</div>';
    }
    data.innerHTML = dataHtml;

    function paint() {
      const x = body.scrollLeft;
      const shift = -x;
      head.style.transform = `translateX(${shift}px)`;
      // Measure first header cell vs first data cell left edges in viewport.
      const hCell = head.querySelector('.cell');
      const dCell = data.querySelector('.dcell');
      const hr = hCell.getBoundingClientRect();
      const dr = dCell.getBoundingClientRect();
      const drift = Math.round((hr.left - dr.left) * 1000) / 1000;
      const synced = Math.abs(drift) < 0.75;
      readout.innerHTML =
        `offset=${x.toFixed(1)} · headerShift=${shift.toFixed(1)} · drift=${drift}px · ` +
        `<span class="${synced ? 'ok' : 'bad'}">${synced ? 'SYNC' : 'DESYNC'}</span>`;
      document.body.dataset.offset = String(x);
      document.body.dataset.drift = String(drift);
      document.body.dataset.synced = synced ? '1' : '0';
    }

    body.addEventListener('scroll', paint, { passive: true });
    paint();
    window.__gbScrollProof = {
      scrollTo(x) { body.scrollLeft = x; paint(); return window.__gbScrollProof.sample(); },
      sample() {
        return {
          offset: Number(document.body.dataset.offset),
          drift: Number(document.body.dataset.drift),
          synced: document.body.dataset.synced === '1',
        };
      },
      max() { return body.scrollWidth - body.clientWidth; },
    };
  </script>
</body>
</html>
