<!DOCTYPE html><html><head><meta charset="utf-8"/><style>body{font-family:Georgia,serif;color:#1a1a1a;margin:0;padding:28px;background:#faf8f5;width:800px;box-sizing:border-box}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:18px 0 8px;border-bottom:1px solid #ccc;padding-bottom:4px}
.meta{color:#555;font-size:12px;margin-bottom:16px}table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
td,th{border:1px solid #999;padding:6px 8px;text-align:left}th{background:#eee}

<h1>Geometry — Grading Policy</h1>
<div class="meta">Mrs. Lindqvist · Math Department</div>
<h2>Weights</h2>
<div data-gt-field="syllabus.categories" data-gt-for="cats"><table><tr><th>Category</th><th>Weight</th></tr>
<tr><td>Tests</td><td>50%</td></tr><tr><td>Quizzes</td><td>25%</td></tr>
<tr><td>Homework</td><td>15%</td></tr><tr><td>Notebook</td><td>10%</td></tr></table></div>
<h2>Late and missing work</h2>
<p class="note"><span data-gt-field="syllabus.late_rule" data-gt-for="late">Late homework: 10 points off per day.</span></p>
<p class="note"><span data-gt-field="syllabus.missing_rule" data-gt-for="missing">Missing assignments are recorded as a zero.</span></p>
<h2>Materials</h2><ul><li>Compass and protractor</li><li>Graph-paper notebook</li></ul>
</body></html>
