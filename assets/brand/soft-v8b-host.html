<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>

  html,body{margin:0;padding:0;background:transparent;overflow:visible;}
  .host{width:var(--s,128px);height:var(--s,128px);position:relative;overflow:visible;}


  :root {
    --ink: var(--foreground, #e8e4f0);
    --mute: var(--muted-foreground, #9a93a8);
    --line: var(--border, #3a3348);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  .root {
    display: block; width: max-content; max-width: 760px;
    color: var(--ink, #e8e4f0);
    font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
  }
  h1 { font-size: 16px; font-weight: 650; margin: 0 0 4px; color: var(--ink, #e8e4f0); }
  .lede, .math, .cost { color: var(--mute, #9a93a8); margin: 0 0 12px; max-width: 52rem; font-size: 12px; }
  h1 + .lede { font-size: 13px; }
  .math { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line, #3a3348); background: #1a1624; }
  .math b, .cost b { color: var(--ink, #e8e4f0); font-weight: 650; }
  .row { display: flex; gap: 12px; align-items: stretch; margin: 0 0 12px; }
  .card {
    width: 300px; border: 1px solid var(--line, #3a3348); background: #221c2e;
    border-radius: 16px; padding: 14px 14px 12px;
  }
  .card h2 { font-size: 14px; margin: 0 0 2px; color: var(--ink, #e8e4f0); }
  .card p { margin: 0 0 10px; color: var(--mute, #9a93a8); font-size: 12px; min-height: 2.6em; }
  .stage {
    display: flex; align-items: flex-end; justify-content: center; gap: 28px;
    padding: 16px 8px 12px; border-radius: 12px; background: #14101c;
  }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .slot span { font-size: 10px; color: var(--mute, #9a93a8); letter-spacing: .04em; }
  .pick {
    margin-top: 10px; width: 100%; appearance: none; border: 1px solid var(--line, #3a3348);
    background: #2a2340; color: var(--ink, #e8e4f0); border-radius: 10px; padding: 8px 10px;
    cursor: pointer; font-weight: 600;
  }
  .pick:hover { border-color: #7a5cff; }

  .av {
    position: relative; width: var(--s); height: var(--s);
    --letter: calc(var(--s) * 468 / 512);
    --lcx: calc(var(--s) * 245 / 512);
    --lcy: calc(var(--s) * 254.5 / 512);
  }
  .scene {
    position: absolute; inset: 0;
    perspective: calc(var(--s) * 2.1);
    perspective-origin: 50% 46%;
    transform-style: preserve-3d;
  }
  .idle-png { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 2; }
  /* WKWebView flattens CSS billboard — comet head is scene-level 2D always-facing ball */
  .bit.head {
    position: absolute;
    left: var(--lcx); top: var(--lcy);
    width: calc(var(--letter) * 0.08); height: calc(var(--letter) * 0.08);
    margin: calc(var(--letter) * -0.04) 0 0 calc(var(--letter) * -0.04);
    transform: translate(0px, 0px);
    transform-style: flat;
    z-index: 1;
    pointer-events: none;
  }
  .bit.head .billboard { transform: none !important; animation: none !important; }
  .breathe { z-index: 2; }
  .gimbal { z-index: 1; }
  .scene.comet-front .bit.head,
  .scene.comet-front .gimbal { z-index: 3; }
  .scene.comet-behind .bit.head,
  .scene.comet-behind .gimbal { z-index: 1; }
  .breathe { position: absolute; inset: 0; transform-style: preserve-3d; z-index: 2; }
  .av svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* v7 Soft gimbal: 1.44× letter box, orbit 0.41 of LETTER (not padded slot) */
  .gimbal {
    display: none;
    position: absolute;
    width: calc(var(--letter) * 1.44);
    height: calc(var(--letter) * 1.44);
    left: calc(var(--lcx) - var(--letter) * 0.72);
    top: calc(var(--lcy) - var(--letter) * 0.72);
    transform: rotateX(26deg) rotateZ(14deg);
    transform-style: preserve-3d;
    pointer-events: none;
  }
  .ring-spin { position: absolute; inset: 0; transform-style: preserve-3d; }
  .gas-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transform: rotateX(90deg); overflow: visible; opacity: 0;
  }
  .bit {
    position: absolute; left: 50%; top: 50%;
    width: calc(var(--letter) * 0.08); height: calc(var(--letter) * 0.08);
    margin: calc(var(--letter) * -0.04) 0 0 calc(var(--letter) * -0.04);
    transform-style: preserve-3d;
    transform: rotateY(var(--a)) translateZ(calc(var(--letter) * 0.41));
  }
  .billboard { position: absolute; inset: 0; transform-style: preserve-3d; }
  .zoom { display: block; width: 100%; height: 100%; transform: scale(0.15); opacity: 0; }
  .ball {
    display: block; width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #fff 0 14%, #e8ffff 22%, #9af7ff 40%, #7a5cff 68%, #2a1848 100%);
    box-shadow: inset -18% -18% 0 0 rgba(20, 8, 40, 0.18);
  }

  .face { opacity: 0; }
  /* CEO Soft FIX-NOW: eyes+glasses only — NO mouth (overrides Soft SoT mouth) */
  .mouth { display: none !important; visibility: hidden !important; pointer-events: none !important; width: 0; height: 0; opacity: 0 !important; }
  .mouth * { display: none !important; }
  .lid { transform: scaleY(1); transform-box: fill-box; transform-origin: 50% 0%; }
  .pupils { transform-box: fill-box; transform-origin: center; }
  .blush { opacity: .45; }

  /* static working */
  .is-on .gimbal { display: block; }
  .is-on .gas-svg { opacity: 1; }
  .is-on .zoom { transform: scale(1); opacity: 1; }
  .is-on .ring-spin { animation: yaw-rev 2.45s linear infinite; }
  .is-on .billboard { animation: billboard 2.45s linear infinite; }
  .is-on .face { opacity: 1; }
  .is-on .mouth { display: none !important; }
  .is-on .lid { transform: scaleY(0.06); animation: blink 4.4s ease-in-out infinite; }
  .is-on .lid2 { animation-delay: .12s; }
  .look { transform-box: fill-box; transform-origin: 50% 42%; }
  .is-on .look { animation: glance-frame 8s ease-in-out infinite; }
  .is-on .pupils { animation: glance 8s ease-in-out infinite; }
  .is-on .blush { opacity: .85; }
  .is-on .breathe { animation: wobble 1.7s ease-in-out infinite; }

  /* looping intro: idle → working */
  .demo-in .gimbal { display: block; }
  .demo-in .face { animation: in-face 5.2s ease-in-out infinite; }
  .demo-in .mouth { animation: in-mouth 5.2s ease-in-out infinite; }
  .demo-in .lid { animation: in-lid 5.2s ease-in-out infinite; }
  .demo-in .lid2 { animation-delay: 0.08s; }
  .demo-in .gas-svg { animation: in-trail 5.2s ease-in-out infinite; }
  .demo-in .zoom { animation: in-zoom 5.2s ease-in-out infinite; }
  .demo-in .ring-spin { animation: yaw-rev 2.45s linear infinite; }
  .demo-in .billboard { animation: billboard 2.45s linear infinite; }
  .demo-in .look { animation: glance-frame 8s ease-in-out infinite; }
  .demo-in .pupils { animation: glance 8s ease-in-out infinite; }
  .demo-in .breathe { animation: wobble 1.7s ease-in-out infinite; }

  /* looping outro: working → idle */
  .demo-out .gimbal { display: block; }
  .demo-out .face { animation: out-face 5.2s ease-in-out infinite; }
  .demo-out .mouth { animation: out-mouth 5.2s ease-in-out infinite; }
  .demo-out .lid { animation: out-lid 5.2s ease-in-out infinite; }
  .demo-out .lid2 { animation-delay: 0.08s; }
  .demo-out .gas-svg { animation: out-trail 5.2s ease-in-out infinite; }
  .demo-out .zoom { animation: out-zoom 5.2s ease-in-out infinite; }
  .demo-out .ring-spin { animation: yaw-rev 2.45s linear infinite; }
  .demo-out .billboard { animation: billboard 2.45s linear infinite; }
  .demo-out .look { animation: glance-frame 8s ease-in-out infinite; }
  .demo-out .pupils { animation: glance 8s ease-in-out infinite; }
  .demo-out .breathe { animation: wobble 1.7s ease-in-out infinite; }

  @keyframes yaw-rev { to { transform: rotateY(-360deg); } }
  @keyframes billboard {
    from { transform: rotateY(calc(var(--a) * -1)); }
    to { transform: rotateY(calc(var(--a) * -1 + 360deg)); }
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(-2.2deg); }
    35% { transform: rotate(2.6deg); }
    68% { transform: rotate(-1.4deg); }
  }
  @keyframes glance {
    /* right, pause, center, pause, upper-left, pause, right, pause, center, pause */
    0% { transform: translate(0, 0); }
    6%, 20% { transform: translate(32%, 6%); }
    26%, 40% { transform: translate(0, 0); }
    46%, 60% { transform: translate(-28%, -24%); }
    66%, 80% { transform: translate(32%, 6%); }
    86%, 100% { transform: translate(0, 0); }
  }

  @keyframes glance-frame {
    0% { transform: translate(0, 0); }
    6%, 20% { transform: translate(9%, 4%); }
    26%, 40% { transform: translate(0, 0); }
    46%, 60% { transform: translate(-8%, -10%); }
    66%, 80% { transform: translate(9%, 4%); }
    86%, 100% { transform: translate(0, 0); }
  }
  @keyframes blink {
    0%, 40%, 47%, 100% { transform: scaleY(0.06); }
    43.5% { transform: scaleY(1); }
  }

  /* 0–18% idle, 18–32% intro, 32–78% working, 78–100% hold then reset */
  @keyframes in-face {
    0%, 18% { opacity: 0; }
    32%, 78% { opacity: 1; }
    90%, 100% { opacity: 0; }
  }
  @keyframes in-mouth {
    0%, 18% { transform: scaleX(0.2) scaleY(0.15); }
    32%, 78% { transform: scaleX(1) scaleY(1); }
    90%, 100% { transform: scaleX(0.2) scaleY(0.15); }
  }
  @keyframes in-lid {
    0%, 20% { transform: scaleY(1); }
    26% { transform: scaleY(0.06); }
    32%, 78% { transform: scaleY(0.06); }
    90%, 100% { transform: scaleY(1); }
  }
  @keyframes in-trail {
    0%, 20% { opacity: 0; }
    32%, 78% { opacity: 1; }
    90%, 100% { opacity: 0; }
  }
  @keyframes in-zoom {
    0%, 20% { transform: scale(0.15); opacity: 0; }
    32%, 78% { transform: scale(1); opacity: 1; }
    90%, 100% { transform: scale(0.15); opacity: 0; }
  }

  /* 0–18% working, 18–32% outro, 32–78% idle, 78–100% restore working */
  @keyframes out-face {
    0%, 18% { opacity: 1; }
    32%, 78% { opacity: 0; }
    90%, 100% { opacity: 1; }
  }
  @keyframes out-mouth {
    0%, 18% { transform: scaleX(1) scaleY(1); }
    32%, 78% { transform: scaleX(0.2) scaleY(0.15); }
    90%, 100% { transform: scaleX(1) scaleY(1); }
  }
  @keyframes out-lid {
    0%, 18% { transform: scaleY(0.06); }
    26%, 78% { transform: scaleY(1); }
    90%, 100% { transform: scaleY(0.06); }
  }
  @keyframes out-trail {
    0%, 18% { opacity: 1; }
    32%, 78% { opacity: 0; }
    90%, 100% { opacity: 1; }
  }
  @keyframes out-zoom {
    0%, 18% { transform: scale(1); opacity: 1; }
    32%, 78% { transform: scale(0.15); opacity: 0; }
    90%, 100% { transform: scale(1); opacity: 1; }
  }



  /* JS always-facing + phase occlusion (data-soft-facing=js-always) */
  [data-soft-facing="js-always"] .is-on .billboard,
  [data-soft-facing="js-always"] .demo-in .billboard,
  [data-soft-facing="js-always"] .demo-out .billboard { animation: none !important; transform: none !important; }
  [data-soft-facing="js-always"] .bit.head { /* orbit via JS translate — not rotateY+translateZ */ }
  /* Gas trail: JS DOM beads (WKWebView-safe). Hide SVG css-dash / gimbal gas. */
  [data-soft-facing="js-always"] .gimbal .gas-svg { display: none !important; }
  [data-soft-facing="js-always"] .gas-orbit.gas-svg,
  [data-soft-facing="js-always"] svg.gas-orbit {
    display: none !important;
    opacity: 0 !important;
    inset: auto !important;
    right: auto !important;
    bottom: auto !important;
    transform: none !important;
  }
  /* Scene-level bead trail — NOT under rotateX(90deg) .gas-svg */
  [data-soft-facing="js-always"] .gas-beads {
    display: block;
    position: absolute;
    left: var(--lcx);
    top: var(--lcy);
    width: 0;
    height: 0;
    margin: 0;
    inset: auto;
    right: auto;
    bottom: auto;
    transform: none !important;
    transform-style: flat;
    overflow: visible;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
  }
  [data-soft-facing="js-always"] .is-on .gas-beads,
  [data-soft-facing="js-always"] .demo-in .gas-beads,
  [data-soft-facing="js-always"] .demo-out .gas-beads { opacity: 1; }
  [data-soft-facing="js-always"] .scene.comet-front .gas-beads,
  [data-soft-facing="js-always"] .scene.comet-front .bit.head { z-index: 3; }
  [data-soft-facing="js-always"] .scene.comet-behind .gas-beads,
  [data-soft-facing="js-always"] .scene.comet-behind .bit.head { z-index: 1; }
  [data-soft-facing="js-always"] .gas-bead {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transform-style: flat;
    background: radial-gradient(circle at 32% 28%, #fff 0 14%, #e8ffff 22%, #9af7ff 40%, #7a5cff 68%, #2a1848 100%);
    box-shadow: 0 0 2px rgba(154, 247, 255, 0.55);
    pointer-events: none;
    will-change: transform, opacity, width, height;
  }
  [data-soft-facing="js-always"] .is-on .ring-spin,
  [data-soft-facing="js-always"] .demo-in .ring-spin,
  [data-soft-facing="js-always"] .demo-out .ring-spin { animation: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .pupils, .look, .lid, .breathe, .ring-spin, .billboard, .face, .mouth, .gas-svg, .zoom { animation: none !important; }
    .is-on .gimbal, .demo-in .gimbal, .demo-out .gimbal { display: block; }
    .is-on .face, .demo-in .face { opacity: 1; }
    .is-on .mouth { display: none !important; }
    .is-on .lid { transform: scaleY(0.06); }
    .is-on .gas-svg, .demo-in .gas-svg { opacity: 1; }
    .is-on .zoom { transform: none; opacity: 1; }
  }

</style>
</head>

<script>
/* Soft FIX-NOW: always-facing comet ball + JS bead trail + front/behind K (WKWebView-safe).
 * Ball + beads: same 2D ellipse / screen-plane orbit (not SVG css-dash / rotateX(90) gas).
 * Face: eyes+glasses; mouth hard-hidden (CEO).
 */
(function () {
  var PERIOD = 2450;
  var CANT = 14 * Math.PI / 180;
  var OVAL_Y = 0.58; /* locked iPhone chrome oval; was cos(TILT)≈0.90 */
  var BEAD_N = 12;
  var TRAIL_SPAN = 0.30; /* fraction of orbit behind the ball */
  var root = document.getElementById('soft-root');
  if (!root) return;
  var scene = root.querySelector('.scene');
  var bit = root.querySelector('.bit.head');
  var beadsHost = root.querySelector('.gas-beads');
  if (!scene || !bit) return;
  if (!beadsHost) {
    beadsHost = document.createElement('div');
    beadsHost.className = 'gas-beads';
    beadsHost.setAttribute('data-soft-trail', 'js-beads');
    beadsHost.setAttribute('data-soft-trail-draw', 'js-beads');
    beadsHost.setAttribute('aria-hidden', 'true');
    scene.appendChild(beadsHost);
  }
  root.setAttribute('data-soft-facing', 'js-always');
  root.setAttribute('data-soft-occlusion', 'phase-z');
  root.setAttribute('data-soft-trail', 'js-beads');
  root.setAttribute('data-soft-trail-draw', 'js-beads');
  root.setAttribute('data-soft-face', 'eyes-glasses-nomouth');

  var beads = [];
  function ensureBeads() {
    if (beads.length === BEAD_N) return;
    beadsHost.innerHTML = '';
    beads = [];
    for (var i = 0; i < BEAD_N; i++) {
      var el = document.createElement('span');
      el.className = 'gas-bead';
      beadsHost.appendChild(el);
      beads.push(el);
    }
  }
  ensureBeads();

  function letterPx() {
    var s = parseFloat(getComputedStyle(root).getPropertyValue('--s')) || root.clientWidth || 128;
    return s * 468 / 512;
  }
  function place(theta, r, cosC, sinC) {
    var x = r * Math.sin(theta);
    var y = r * Math.cos(theta) * OVAL_Y;
    return { x: x * cosC - y * sinC, y: x * sinC + y * cosC };
  }

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) {}

  var start = null;
  function frame(now) {
    if (!root.classList.contains('is-on') &&
        !root.classList.contains('demo-in') &&
        !root.classList.contains('demo-out')) {
      bit.style.transform = 'translate(0px, 0px)';
      for (var i = 0; i < beads.length; i++) beads[i].style.opacity = '0';
      scene.classList.remove('comet-front', 'comet-behind');
      requestAnimationFrame(frame);
      return;
    }
    if (start == null) start = now;
    var t = reduced ? 0 : ((now - start) % PERIOD);
    var phase = t / PERIOD;
    var theta = -phase * Math.PI * 2;
    var letter = letterPx();
    var r = letter * 0.41;
    var ballPx = letter * 0.08;
    var cosC = Math.cos(CANT), sinC = Math.sin(CANT);
    var head = place(theta, r, cosC, sinC);
    bit.style.transform = 'translate(' + head.x.toFixed(2) + 'px,' + head.y.toFixed(2) + 'px)';
    for (var b = 0; b < BEAD_N; b++) {
      var lag = ((b + 1) / (BEAD_N + 1)) * TRAIL_SPAN;
      var p = place(-(phase - lag) * Math.PI * 2, r, cosC, sinC);
      var tFrac = (b + 1) / BEAD_N;
      var size = ballPx * (0.72 - 0.48 * tFrac);
      var op = 0.88 - 0.72 * tFrac;
      var el = beads[b];
      el.style.width = size.toFixed(2) + 'px';
      el.style.height = size.toFixed(2) + 'px';
      el.style.opacity = String(op.toFixed(3));
      el.style.transform = 'translate(' + (p.x - size / 2).toFixed(2) + 'px,' + (p.y - size / 2).toFixed(2) + 'px)';
    }
    var front = Math.cos(theta) > 0;
    scene.classList.toggle('comet-front', front);
    scene.classList.toggle('comet-behind', !front);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
